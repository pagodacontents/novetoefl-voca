<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>노베토플 주제별 배경지식</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans:wght@400;500&display=swap">
<style>
/* 레이아웃 — 다섯 영역을 띠로 가르고, 그 아래 묶음(54)이 한 장씩 선다.
   묶음 하나에 개념 네댓이 들어가며, 개념마다 뜻과 보기 한 문장이 붙는다. */
:root{
  --s:#004871; --s-fill:#003A5D; --s-tint:#E8F0F6; --s-soft:#F3F7FA;
  --bg:#FBFCFD; --surf:#FFFFFF; --fg:#131A20; --mut:#657784;
  --faint:#94A4B0; --line:#E0E8ED;
  --f-word:"Lora",Georgia,serif;
  --f-ui:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-ipa:"Noto Sans","Segoe UI",system-ui,sans-serif;
  --r:12px;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --s:#86C2E6; --s-fill:#30708F; --s-tint:#13242E; --s-soft:#121B21;
  --bg:#0E1317; --surf:#171E24; --fg:#EAF1F5; --mut:#92A5B1;
  --faint:#6D808C; --line:#25313A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --s:#86C2E6; --s-fill:#30708F; --s-tint:#13242E; --s-soft:#121B21;
  --bg:#0E1317; --surf:#171E24; --fg:#EAF1F5; --mut:#92A5B1;
  --faint:#6D808C; --line:#25313A; color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--s-fill)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--s-fill);color:#fff}
.top-in{padding-left:var(--gut);padding-right:var(--gut-r);padding-block:10px;display:flex;flex-direction:column;gap:9px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:15px;font-weight:700}
.brand span{font-size:11.5px;opacity:.8;font-family:var(--f-ipa);letter-spacing:.06em;text-transform:uppercase}
.brand .tot{margin-left:auto;font-size:11.5px;opacity:.85;font-family:var(--f-ipa)}
.areas{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.areas::-webkit-scrollbar{display:none}
.areas button{flex:0 0 auto;border:0;border-radius:999px;cursor:pointer;font-family:var(--f-ui);font-size:12.5px;padding:6px 12px;background:rgba(255,255,255,.2);color:#fff;white-space:nowrap}
.areas button[aria-selected="true"]{background:#fff;color:var(--s);font-weight:700}
.areas button:focus-visible,.search input:focus-visible{outline:2px solid #fff;outline-offset:1px}
.search input{width:100%;border:0;border-radius:9px;padding:9px 12px;font-family:var(--f-ui);font-size:14px;background:rgba(255,255,255,.18);color:#fff}
.search input::placeholder{color:rgba(255,255,255,.72)}

main{padding-left:var(--gut);padding-right:var(--gut-r);padding-block:14px 44px;display:flex;flex-direction:column;gap:12px;max-width:620px;margin:0 auto}

.pack{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ph{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;background:var(--s-soft);border-bottom:1px solid var(--line)}
.ph .n{flex:0 0 auto;font-family:var(--f-ipa);font-size:11px;color:#fff;background:var(--s-fill);border-radius:6px;padding:3px 7px;font-variant-numeric:tabular-nums}
.ph .t{flex:1;min-width:0}
.ph h2{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.ph em{font-style:normal;display:block;font-size:11.5px;color:var(--mut);margin-top:1px}

.item{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.item:last-child{border-bottom:0}
.term{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px}
.term b{font-size:14.5px;font-weight:700}
.term i{font-style:italic;font-family:var(--f-word);font-size:13px;color:var(--s)}
.def{margin:0;font-size:13.5px;color:var(--fg)}
.eg{margin:0;font-size:12.5px;color:var(--mut);border-left:2px solid var(--line);padding-left:9px}
.eg::before{content:"보기 ";font-family:var(--f-ipa);font-size:10px;color:var(--faint);letter-spacing:.06em}

.empty{text-align:center;color:var(--faint);font-size:13.5px;padding:48px 0}
.foot{color:var(--faint);font-size:11.5px;text-align:center;padding-top:16px;border-top:1px solid var(--line);margin-top:4px}
mark{background:var(--s-tint);color:inherit;border-radius:3px;padding:0 1px}
</style>
</head>
<body>


<header class="top">
  <div class="top-in">
    <div class="brand"><b>주제별 배경지식</b><span>Background</span><span class="tot" id="tot"></span></div>
    <div class="areas" id="areas" role="tablist" aria-label="영역"></div>
    <div class="search"><input id="q" type="search" placeholder="개념이나 영어 용어로 찾기" autocomplete="off" aria-label="개념 찾기"></div>
  </div>
</header>

<main id="main"><p class="empty">배경지식을 불러오는 중입니다.</p></main>

<script id="DATA" type="application/json">{"groups":[{"no":"1","area":"사회·심리","title":"사회연결망과 사회자본","items":[{"ko":"사회적 자본","en":"social capital","def":"사람들 간의 신뢰와 관계망이 만들어내는 자원으로, 협력과 정보 교환을 가능하게 한다.","ex":"이웃끼리 서로 도와 육아를 분담하는 마을은 사회적 자본이 높다고 말한다."},{"ko":"결속형 사회자본","en":"bonding (social capital)","def":"비슷한 배경을 가진 사람들끼리 강하게 뭉치는 유대. 내부 결속은 강하지만 외부와는 단절되기 쉽다.","ex":"같은 이민자 출신끼리만 모이는 커뮤니티는 결속형 자본은 높지만 주류 사회와의 다리는 약하다."},{"ko":"교량형 사회자본","en":"bridging (social capital)","def":"서로 다른 배경의 집단을 이어주는 느슨한 유대로, 새로운 정보와 기회에 접근하게 해준다.","ex":"동창회에서 다른 업계 사람을 소개받아 이직에 성공하는 것은 교량형 자본 덕분이다."},{"ko":"자기조직화","en":"self-organization","def":"중앙의 지시 없이 구성원들의 상호작용만으로 질서나 패턴이 저절로 생겨나는 현상이다.","ex":"신호등 없이도 자동차들이 로터리에서 스스로 흐름을 만들어내는 것이 자기조직화의 예다."}]},{"no":"2","area":"사회·심리","title":"인지 편향과 판단 오류","items":[{"ko":"인지 편향","en":"cognitive bias","def":"정보를 판단할 때 논리보다 감정이나 습관에 따라 체계적으로 치우치는 사고 오류다.","ex":"같은 통계를 보고도 자기 주장에 유리한 부분만 기억하는 것은 인지 편향 때문이다."},{"ko":"인지 부조화","en":"cognitive dissonance","def":"신념과 행동이 어긋날 때 느끼는 불편함. 사람은 이를 없애려고 행동이 아니라 태도를 바꾼다.","ex":"담배가 해롭다고 알면서도 계속 피우는 사람이 \"스트레스 해소가 더 중요하다\"고 믿게 되는 것."},{"ko":"확증 편향","en":"confirmation bias","def":"자신의 기존 믿음을 뒷받침하는 정보만 찾고 반대되는 정보는 무시하는 경향이다.","ex":"특정 정치인을 지지하는 사람이 그를 비판하는 기사는 거르고 옹호하는 기사만 찾아 읽는 것."},{"ko":"가용성 휴리스틱","en":"availability heuristic","def":"머릿속에 쉽게 떠오르는 사례를 근거로 확률이나 빈도를 과대평가하는 판단법이다.","ex":"비행기 추락 뉴스를 본 뒤 비행이 자동차 운전보다 훨씬 위험하다고 착각하는 것."}]},{"no":"3","area":"사회·심리","title":"주의, 몰입과 창의적 사고","items":[{"ko":"인지 지도","en":"cognitive mapping","def":"머릿속에 공간이나 환경의 구조를 그림처럼 표상해 길을 찾고 방향을 잡는 능력이다.","ex":"처음 간 도시에서도 몇 번 걸어보면 지도 없이 길을 찾게 되는 것은 인지 지도 덕분이다."},{"ko":"부주의맹","en":"inattentional blindness","def":"한 가지에 집중하느라 눈앞에 뻔히 보이는 다른 대상을 전혀 알아채지 못하는 현상이다.","ex":"농구공 패스 횟수를 세는 데 몰두한 사람들이 화면을 가로지르는 고릴라 옷을 입은 사람을 못 보는 실험."},{"ko":"몰입","en":"flow","def":"지금 하는 일에 완전히 빠져들어 시간 감각을 잊고 최고의 수행을 보이는 심리 상태다.","ex":"그림을 그리다 보니 몇 시간이 몇 분처럼 느껴졌다면 몰입 상태에 들어간 것이다."},{"ko":"창의성","en":"creativity","def":"기존 것을 그대로 따르지 않고 새롭고 유용한 아이디어나 결과물을 만들어내는 능력이다.","ex":"버려진 컨테이너를 카페로 개조한 아이디어는 창의성의 결과물로 평가받는다."}]},{"no":"4","area":"사회·심리","title":"사회적 영향과 집단행동","items":[{"ko":"사회적 역할 이론","en":"social role theory","def":"사람은 사회 속 자신의 지위에 맞는 기대된 행동을 하게 된다고 보는 이론이다.","ex":"같은 사람이라도 회사에서는 상사답게, 집에서는 부모답게 행동을 바꾸는 것을 이 이론으로 설명한다."},{"ko":"역할 갈등","en":"role conflict","def":"한 사람이 동시에 맡은 여러 역할이 서로 다른 행동을 요구할 때 생기는 긴장이다.","ex":"팀장이면서 동시에 친한 동료로서 부하 직원의 실수를 감싸야 할지 지적해야 할지 고민하는 것."},{"ko":"집단사고","en":"groupthink","def":"집단의 화합을 지나치게 중시한 나머지 반대 의견을 억누르고 잘못된 결정을 내리는 현상이다.","ex":"회의에서 다들 좋다고 하니 문제점을 알고도 아무도 반박하지 않아 부실한 계획이 그대로 통과되는 것."},{"ko":"동조","en":"conformity","def":"다수의 의견이나 행동에 맞추려고 자신의 판단을 바꾸는 경향이다.","ex":"선분 길이를 잘못 답하는 다른 참가자들을 보고 자신도 틀린 답을 따라 말한 애쉬의 실험 참가자들."}]},{"no":"5","area":"사회·심리","title":"발달심리와 성장 마인드","items":[{"ko":"생태체계이론","en":"Ecological Systems Theory","def":"아동의 발달이 가정, 학교, 문화 등 여러 겹의 환경 체계가 서로 영향을 주고받으며 이루어진다고 보는 이론이다.","ex":"아빠가 직장 상사에게 혼난 날 저녁, 평소보다 아이에게 짜증을 내는 것도 아이의 성장에 영향을 준다."},{"ko":"성장 마인드셋","en":"growth mindset","def":"능력은 노력과 경험으로 얼마든지 발전할 수 있다고 믿는 사고방식이다.","ex":"시험을 망친 뒤 \"나는 원래 못해\"가 아니라 \"더 연습하면 늘겠지\"라고 생각하는 것이 성장 마인드셋이다."},{"ko":"고정 마인드셋","en":"fixed mindset","def":"능력이나 재능은 타고나는 것이어서 노력해도 크게 바뀌지 않는다고 믿는 사고방식이다.","ex":"수학 문제를 몇 번 틀리고 나서 \"나는 수학 머리가 없다\"며 아예 포기해 버리는 것."},{"ko":"회복탄력성","en":"resilience","def":"큰 어려움이나 실패를 겪은 뒤에도 다시 일어서서 이전 상태로 회복하는 능력이다.","ex":"사업 실패로 큰 빚을 졌지만 몇 년 뒤 다시 도전해 재기에 성공한 사람의 회복탄력성."}]},{"no":"6","area":"사회·심리","title":"자유의지와 정치철학","items":[{"ko":"자유지상주의","en":"libertarianism","def":"정부의 개입을 최소화하고 개인의 자유와 재산권을 최우선으로 보장해야 한다는 정치사상이다.","ex":"복지 예산 확대안에 반대하며 세금을 낮추고 개인의 선택에 맡겨야 한다고 목소리를 높이는 유권자."},{"ko":"자기소유권","en":"self-ownership","def":"자기 몸과 능력, 노동의 결과물은 오직 자신에게 속한다는 원칙이다.","ex":"헬멧 착용 의무화 법안에 '내 몸은 내가 정한다'며 반대하는 오토바이 운전자."},{"ko":"자유의지","en":"free will","def":"인간이 외부 원인에 의해 정해지지 않고 스스로 선택할 수 있는 능력이 있다는 개념이다.","ex":"직장 상사에게 화가 치밀어도 참기로 스스로 결심하는 것은 자유의지로 선택한 결과라는 입장."},{"ko":"결정론","en":"determinism","def":"모든 사건과 인간의 행동은 이전 원인에 의해 이미 정해져 있다는 철학적 입장이다.","ex":"불우한 환경에서 자란 사람이 범죄를 저지르면, 그 선택도 이미 정해져 있었을 뿐이라고 보는 것."}]},{"no":"7","area":"사회·심리","title":"언어와 사고","items":[{"ko":"언어유형론","en":"linguistic typology","def":"세계 여러 언어를 어순이나 문법 구조 같은 공통된 특징에 따라 분류하고 비교하는 언어학 분야다.","ex":"한국어와 튀르키예어는 '나는 사과를 먹는다'처럼 목적어가 동사 앞에 오는 같은 어순 유형으로 묶인다."},{"ko":"어순","en":"word order","def":"문장에서 주어, 동사, 목적어가 배열되는 순서로, 언어마다 정해진 기본 패턴이 있다.","ex":"영어는 주어-동사-목적어(SVO) 순서로 배열해 \"나는 사과를 먹는다\"를 \"I eat an apple\"이라고 말한다."},{"ko":"언어 습득","en":"language acquisition","def":"아이가 특별한 교육 없이도 주변 말을 들으며 자연스럽게 모국어 문법을 익혀가는 과정이다.","ex":"세 살 아이가 문법책 한 번 안 보고도 \"먹었다\"처럼 올바른 과거형을 스스로 쓰게 되는 것."}]},{"no":"8","area":"사회·심리","title":"문화인류학: 관습과 생활양식","items":[{"ko":"친족 관계","en":"kinship","def":"혈연이나 결혼으로 맺어진 사람들 사이의 사회적 유대와 그 체계를 가리킨다.","ex":"한 부족에서 사촌끼리는 결혼할 수 있어도 친형제자매 간의 결혼은 금지되는 것처럼 정해진 관계."},{"ko":"혈연 친족","en":"consanguineal (kinship)","def":"부모와 자식, 형제자매처럼 혈연으로 직접 이어진 친족 관계를 가리킨다.","ex":"어머니와 딸, 삼촌과 조카는 혼인이 아니라 혈연으로 맺어진 혈연 친족 관계다."},{"ko":"인척 관계","en":"affinal (kinship)","def":"혈연이 아니라 결혼을 통해 맺어진 친족 관계를 가리킨다.","ex":"배우자의 부모나 형제는 혈연이 아니라 결혼으로 맺어진 인척 관계에 해당한다."},{"ko":"포틀래치","en":"potlatch","def":"북미 원주민 일부 부족에서 지위를 과시하기 위해 재산을 성대하게 나눠주거나 파괴하는 의식이다.","ex":"부족장이 포틀래치에서 담요와 카누를 손님들에게 아낌없이 나눠주며 자신의 부와 지위를 과시한다."},{"ko":"문화 상대주의","en":"cultural relativism","def":"한 문화의 관습은 그 문화 자체의 맥락에서 이해해야 하며 다른 문화의 잣대로 우열을 매길 수 없다는 관점이다.","ex":"손으로 밥을 먹는 관습을 미개하다고 판단하지 않고 그 사회의 위생 관념 속에서 이해하려는 태도."},{"ko":"자문화 중심주의","en":"ethnocentrism","def":"자신이 속한 문화의 기준으로 다른 문화를 열등하거나 비정상적이라고 판단하는 태도다.","ex":"자기 나라의 식사 예절만이 옳다고 여기고 다른 나라의 식습관을 무례하다고 깎아내리는 것."}]},{"no":"9","area":"사회·심리","title":"음식·문화 확산과 세계화","items":[{"ko":"향신료와 더운 기후 요리","en":"spices / hot-climate cuisines","def":"더운 지역 요리에 향신료가 많이 쓰이는 것은 부패를 늦추고 세균 번식을 억제하는 효과 때문이라는 가설이 있다.","ex":"인도나 동남아 음식에 고추와 강황이 많이 들어가는 것은 무더운 기후에서 음식을 상하지 않게 하려는 전통이라는 것."},{"ko":"비거니즘","en":"veganism","def":"동물성 식품뿐 아니라 동물을 이용한 제품 전반을 소비하지 않으려는 생활 방식이다.","ex":"고기와 유제품은 물론 가죽 신발도 피하는 것은 비거니즘을 실천하는 사람의 특징이다."},{"ko":"식물성 식단","en":"plant-based diet","def":"고기와 유제품 대신 채소, 곡물, 콩류 등 식물성 재료 위주로 구성한 식단이다.","ex":"건강과 환경을 이유로 일주일에 며칠은 고기 대신 식물성 식단을 선택하는 사람들이 늘고 있다."},{"ko":"동물 복지","en":"animal welfare","def":"사육되거나 이용되는 동물이 고통을 최소화하고 자연스러운 습성을 지키며 살 수 있도록 배려하는 개념이다.","ex":"좁은 우리 대신 자유롭게 돌아다닐 수 있는 방목 환경에서 닭을 기르는 것은 동물 복지를 고려한 것이다."}]},{"no":"10","area":"사회·심리","title":"도시와 공동체","items":[{"ko":"도시 녹지 공간","en":"urban green spaces","def":"공원이나 가로수길처럼 도시 안에 식물과 자연을 접할 수 있도록 조성한 공간이다.","ex":"콘크리트 건물 사이에 만든 작은 공원은 주민들에게 휴식처가 되어주는 도시 녹지 공간이다."},{"ko":"공동체 텃밭","en":"community gardens","def":"주민들이 함께 땅을 나누어 채소나 꽃을 가꾸며 교류하는 소규모 공동 농지다.","ex":"아파트 옆 빈 땅을 텃밭으로 바꿔 이웃들이 함께 상추와 토마토를 기르며 친해지는 것."},{"ko":"도시 회복력","en":"urban resilience","def":"재난이나 위기가 닥쳤을 때 도시의 기능이 빠르게 회복하고 적응할 수 있는 능력이다.","ex":"홍수가 나도 배수 시설과 대피 체계가 잘 갖춰진 도시는 도시 회복력이 높다고 평가받는다."},{"ko":"녹색 기반 시설","en":"green infrastructure","def":"빗물 정원이나 옥상 녹화처럼 자연의 기능을 활용해 도시 문제를 해결하는 시설이다.","ex":"콘크리트 배수로 대신 식물을 심은 빗물 정원을 만들어 홍수를 줄이는 것이 녹색 기반 시설의 예다."}]},{"no":"11","area":"생명·의학","title":"뇌와 정서 반응","items":[{"ko":"신경전달물질","en":"neurotransmitters","def":"뉴런 사이 신호를 전달하는 화학물질로, 감정과 행동 조절에 관여한다.","ex":"도파민 분비가 늘면 음악을 들을 때 쾌감과 보상감을 느끼게 되는 것."},{"ko":"도파민","en":"dopamine","def":"보상과 쾌감에 관여하는 신경전달물질로, 기대와 동기부여에도 영향을 준다.","ex":"좋아하는 노래의 클라이맥스 직전에 도파민 분비가 최고조에 달하는 것."},{"ko":"거울 자기인식","en":"mirror self-recognition","def":"거울 속 모습을 자신으로 알아보는 능력으로, 자의식 발달의 지표로 쓰인다.","ex":"이마에 표시를 몰래 붙인 침팬지가 거울을 보고 자기 이마를 만지는 것."},{"ko":"공감각","en":"synesthesia","def":"한 감각 자극이 다른 감각의 경험을 동시에 일으키는 신경 현상.","ex":"특정 음을 들을 때마다 특정 색깔이 함께 보인다고 느끼는 사람의 경우."},{"ko":"신경가소성","en":"neuroplasticity","def":"경험과 학습에 따라 뇌의 신경 연결이 변화하고 재구성되는 능력.","ex":"악기를 오래 연습한 사람의 뇌에서 관련 영역이 더 발달해 있는 것."},{"ko":"플라시보 효과","en":"placebo effect","def":"실제 효과가 없는 처치인데도 효과가 있다고 믿어 증상이 호전되는 현상.","ex":"가짜 진통제를 먹고도 통증이 줄었다고 느끼는 환자의 경우."}]},{"no":"12","area":"생명·의학","title":"의료기술과 건강관리","items":[{"ko":"인공 보철","en":"cybernetic prosthetics","def":"신경·근육 신호를 감지해 움직임을 구현하는 전자식 인공 신체 부위.","ex":"팔을 잃은 사람이 생각만으로 로봇 손가락을 움직여 컵을 쥐는 것."},{"ko":"근전도 센서","en":"myoelectric sensors","def":"근육이 수축할 때 발생하는 전기 신호를 감지하는 장치.","ex":"의수 착용자가 팔 근육에 힘을 주면 센서가 이를 읽어 손을 쥐게 하는 것."},{"ko":"생체적합성","en":"biocompatibility","def":"인공 물질이 인체 조직과 거부반응 없이 안전하게 공존할 수 있는 성질.","ex":"인공관절 재료를 고를 때 염증을 일으키지 않는 금속을 선택하는 것."},{"ko":"바이오해킹","en":"biohacking","def":"첨단 기술이나 자가 실험을 통해 스스로 신체 기능을 개선하려는 시도.","ex":"피부밑에 센서 칩을 삽입해 혈당을 실시간으로 확인하는 사람의 경우."}]},{"no":"13","area":"생명·의학","title":"생명공학과 신약개발","items":[{"ko":"생화학 시스템 이론","en":"biochemical systems theory","def":"세포 내 여러 대사 반응을 하나의 상호작용 체계로 보고 수학적으로 분석하는 이론.","ex":"효소 하나의 활성이 달라질 때 전체 대사 흐름이 어떻게 변하는지 방정식으로 예측하는 연구가 그 예다."},{"ko":"대사 경로","en":"metabolic pathways","def":"세포 안에서 물질이 여러 효소 반응을 거쳐 순차적으로 변환되는 경로.","ex":"포도당이 여러 단계를 거쳐 에너지로 전환되는 해당 과정 경로."},{"ko":"효소","en":"enzymes","def":"생체 내 화학반응 속도를 크게 높이는 단백질 촉매.","ex":"소화 효소가 음식 속 녹말을 빠르게 당으로 분해하는 것."},{"ko":"전산화학","en":"computational chemistry","def":"컴퓨터 시뮬레이션으로 분자 구조와 반응을 예측·분석하는 화학 분야.","ex":"신약 후보 물질이 표적 단백질에 잘 결합할지 컴퓨터로 미리 계산해 보는 것."}]},{"no":"14","area":"생명·의학","title":"해양·연안 생태계","items":[{"ko":"산호 백화","en":"coral bleaching","def":"수온 상승 등 스트레스로 산호가 공생조류를 잃고 하얗게 변하는 현상.","ex":"이상 고수온이 지속되자 대보초 산호가 색을 잃고 하얗게 변한 것."},{"ko":"산호 폴립","en":"coral polyps","def":"산호초를 이루는 작은 개체 동물로, 군체를 이뤄 골격을 만든다.","ex":"수천 개의 산호 폴립이 모여 하나의 거대한 산호초 구조를 형성하는 것."},{"ko":"공생조류","en":"symbiotic algae","def":"산호 조직 안에 살며 광합성으로 영양분을 공급하는 조류.","ex":"산호가 수온 스트레스로 공생조류를 내쫓으면서 백화 현상이 시작되는 것."},{"ko":"습지","en":"wetland","def":"물이 상시 또는 계절적으로 고여 있어 독특한 동식물이 서식하는 생태계.","ex":"장마철 폭우가 쏟아진 날 습지가 빗물을 흡수해 하류 마을이 침수를 면한 것."}]},{"no":"15","area":"생명·의학","title":"동물의 방어와 생존전략","items":[{"ko":"생물발광","en":"bioluminescence","def":"생물이 화학반응을 통해 스스로 빛을 내는 현상.","ex":"심해 아귀가 몸의 발광 기관으로 먹이를 유인하는 것."},{"ko":"루시페린","en":"luciferin","def":"발광 효소와 반응해 빛을 만들어내는 생물체 내 화학물질.","ex":"반딧불이 몸속 루시페린이 산소와 만나 빛을 내는 것."},{"ko":"루시페레이스","en":"luciferase","def":"루시페린의 산화 반응을 촉진해 빛을 내게 하는 효소.","ex":"반딧불이의 루시페레이스가 없으면 루시페린만으로는 빛이 나지 않는 것."},{"ko":"곰벌레","en":"tardigrade","def":"극한 건조·방사선·저온에서도 가사 상태로 생존하는 초미세 무척추동물.","ex":"곰벌레가 수분을 모두 잃고도 수년 뒤 물을 만나면 다시 활동을 시작하는 것."}]},{"no":"16","area":"생명·의학","title":"동물의 이동과 항법","items":[{"ko":"철새 이동","en":"bird migration","def":"계절에 따라 새들이 번식지와 월동지 사이를 규칙적으로 이동하는 현상.","ex":"제비가 매년 가을 한국을 떠나 동남아시아로 날아가는 것."},{"ko":"북극제비갈매기","en":"Arctic terns","def":"지구상에서 가장 긴 거리를 이동하는 철새로, 북극과 남극을 오간다.","ex":"북극제비갈매기가 한 해 동안 지구 둘레의 약 두 배에 달하는 거리를 이동하는 것."},{"ko":"항법","en":"navigation","def":"동물이 지형, 태양, 지구 자기장 등을 이용해 방향과 경로를 찾는 능력.","ex":"철새가 흐린 날에도 지구 자기장을 감지해 이동 방향을 잃지 않는 것."}]},{"no":"17","area":"생명·의학","title":"동물의 소통과 신체 구조","items":[{"ko":"8자 춤","en":"waggle dance","def":"꿀벌이 몸을 흔들며 움직여 먹이 위치와 방향을 동료에게 알리는 소통 행동.","ex":"정찰벌이 8자 춤을 춰서 다른 벌들에게 꽃밭까지의 거리와 방향을 알리는 것."},{"ko":"채집벌","en":"forager bees","def":"벌집 밖으로 나가 꽃꿀과 꽃가루를 모아오는 역할을 맡은 일벌.","ex":"채집벌이 좋은 꽃밭을 찾으면 돌아와 춤으로 동료들에게 위치를 전달하는 것."},{"ko":"영역 행동","en":"territorial behavior","def":"동물이 자신의 서식 공간을 지키기 위해 다른 개체를 위협하거나 쫓아내는 행동.","ex":"수컷 물고기가 자기 구역에 다른 수컷이 들어오면 몸을 부풀리며 쫓아내는 것."},{"ko":"생물음향학","en":"bioacoustics","def":"동물이 내는 소리를 통해 행동과 소통 방식을 연구하는 학문.","ex":"연구자들이 고래 노래를 녹음·분석해 무리 간 소통 방식을 밝혀내는 것."}]},{"no":"18","area":"생명·의학","title":"수면과 생체리듬","items":[{"ko":"반구수면","en":"unihemispheric sleep","def":"뇌의 절반씩 번갈아 재우며 나머지 절반은 깨어 있는 수면 방식.","ex":"돌고래가 반구수면을 하며 헤엄치는 동안에도 숨쉬기와 경계를 유지하는 것."},{"ko":"24시간 생체리듬","en":"circadian rhythm","def":"약 24시간 주기로 반복되는 신체의 생리적 리듬.","ex":"밤낮이 바뀐 야간 근무자가 생체리듬이 흐트러져 낮에도 졸음을 느끼는 것."},{"ko":"빛 노출","en":"light exposure","def":"빛에 노출되는 정도와 시간이 생체시계를 조절하는 신호로 작용하는 것.","ex":"아침에 밝은 햇빛을 쬐면 생체시계가 재설정되어 밤에 더 잘 잠드는 것."},{"ko":"기억 공고화","en":"memory consolidation","def":"학습한 정보가 수면 중 뇌에서 안정적인 장기기억으로 저장되는 과정.","ex":"시험공부 후 충분히 잔 학생이 그렇지 않은 학생보다 내용을 더 잘 기억하는 것."}]},{"no":"19","area":"생명·의학","title":"미생물과 물질순환","items":[{"ko":"비브리오균","en":"Vibrio bacteria","def":"오염된 해산물이나 상처를 통해 감염을 일으킬 수 있는 세균 종류.","ex":"덜 익힌 굴을 먹은 사람이 비브리오균에 감염돼 급성 장염을 앓는 것."},{"ko":"위장염","en":"gastroenteritis","def":"세균이나 바이러스 감염으로 위와 장에 염증이 생겨 구토·설사를 일으키는 질환.","ex":"오염된 물을 마신 뒤 심한 위장염 증상으로 응급실을 찾는 것."},{"ko":"분해(균류)","en":"decomposition","def":"균류나 미생물이 죽은 유기물을 분해해 단순한 물질로 되돌리는 과정.","ex":"버섯 균사가 쓰러진 나무를 서서히 분해해 흙으로 되돌리는 것."},{"ko":"면역","en":"immunity","def":"병원체나 이물질로부터 신체를 방어하는 생물학적 방어 체계.","ex":"어릴 때 다양한 미생물에 노출된 아이가 오히려 면역력이 튼튼해지는 것."}]},{"no":"20","area":"생명·의학","title":"생태계 교란과 보전","items":[{"ko":"경관 연결성","en":"landscape connectivity","def":"서식지들이 서로 이동 가능한 통로로 연결되어 있는 정도.","ex":"도로 위에 생태통로를 만들어 끊어진 숲 사이를 동물이 오갈 수 있게 하는 것."},{"ko":"서식지 단편화","en":"habitat fragmentation","def":"큰 서식지가 개발 등으로 작은 조각들로 쪼개져 고립되는 현상.","ex":"도로와 농경지가 숲을 갈라놓아 동물 개체군이 서로 오가지 못하게 되는 것."},{"ko":"도시화","en":"urbanization","def":"인구와 건물이 도시로 집중되며 자연 서식지가 인공 환경으로 바뀌는 과정.","ex":"도시화로 습지가 매립되면서 그곳에 살던 새들이 서식지를 잃는 것."},{"ko":"서식지 손실","en":"habitat loss","def":"개발이나 환경 변화로 생물이 살아갈 자연 공간이 줄어드는 현상.","ex":"열대우림 벌목으로 그곳에 살던 원숭이들의 서식지가 크게 줄어든 것."}]},{"no":"21","area":"생명·의학","title":"식물의 적응과 소통","items":[{"ko":"식물 간 소통","en":"plant communication","def":"식물이 화학물질을 방출해 주변 식물이나 곤충에게 신호를 전달하는 현상.","ex":"초식동물에게 뜯긴 나무가 화학신호를 내보내 이웃 나무가 방어물질을 미리 만드는 것."},{"ko":"화학 신호","en":"chemical signals","def":"식물이나 동물이 정보를 전달하기 위해 방출하는 화학물질.","ex":"진딧물이 공격하면 식물이 화학 신호를 내뿜어 천적 곤충을 유인하는 것."},{"ko":"뿌리 삼출물","en":"root exudates","def":"식물 뿌리가 토양으로 분비하는 당·아미노산 등의 화학물질.","ex":"뿌리 삼출물이 주변 미생물을 유인해 뿌리 근처에 유익균 군집을 형성하는 것."}]},{"no":"22","area":"생명·의학","title":"고생물학과 화석 증거","items":[{"ko":"깃털 공룡","en":"feathered dinosaurs","def":"몸에 깃털 구조를 지녔던 것으로 화석에서 확인된 공룡 무리.","ex":"시노사우롭테릭스 화석에서 몸을 덮은 원시 깃털 흔적이 발견된 것."},{"ko":"시노사우롭테릭스","en":"Sinosauropteryx","def":"깃털의 흔적이 처음으로 뚜렷하게 확인된 초기 육식 공룡 화석종.","ex":"시노사우롭테릭스 화석 표면에서 색소 흔적까지 남은 깃털 자국이 발견된 것."},{"ko":"화석","en":"fossils","def":"오래전에 살았던 생물의 몸이나 흔적이 암석 속에 보존된 것.","ex":"지층 속에서 발견된 삼엽충 화석으로 고대 바다 환경을 추정하는 것."}]},{"no":"23","area":"예술·문학·역사","title":"근현대 미술 사조의 실험","items":[{"ko":"입체주의","en":"Cubism","def":"사물을 여러 각도에서 본 모습을 한 화면에 동시에 담아 표현하는 미술 기법. 피카소와 브라크가 대표적이다.","ex":"사람의 얼굴을 정면과 옆면을 동시에 겹쳐 그려 하나의 초상화로 보여주는 방식."},{"ko":"표현주의","en":"Expressionism","def":"대상을 사실적으로 재현하기보다 작가의 내면 감정과 불안을 왜곡된 형태와 색으로 드러내는 사조.","ex":"뭉크의 \"절규\"처럼 인물의 표정과 배경을 뒤틀어 공포감을 시각적으로 전달하는 것."},{"ko":"초현실주의","en":"Surrealism","def":"꿈, 무의식, 우연을 활용해 논리를 벗어난 이미지를 결합하는 20세기 초 예술 운동.","ex":"시계가 녹아내리는 달리의 그림처럼 현실에서는 불가능한 장면을 사실적으로 그려내는 것."},{"ko":"아웃사이더 아트","en":"outsider art","def":"정규 미술교육을 받지 않은 사람이 독학이나 개인적 충동으로 만든 작품을 가리키는 말.","ex":"미술학교를 다닌 적 없는 농부가 평생 자기 집 마당에 조각상을 세워 만든 작품이 이 범주로 평가받는 경우."},{"ko":"키네틱 아트","en":"kinetic art","def":"바람, 모터, 관람객의 움직임 등을 이용해 실제로 움직이는 요소를 작품에 결합한 예술.","ex":"천장에 매달린 조각이 바람에 따라 균형을 이루며 천천히 회전하는 모빌 작품."},{"ko":"대지미술","en":"land art","def":"자연 그대로의 땅, 돌, 흙을 재료 삼아 야외 대규모 지형에 직접 작업하는 미술 형식.","ex":"스미스슨의 \"나선형 방파제\"처럼 호숫가에 돌을 나선형으로 쌓아 거대한 형태를 만든 작업."}]},{"no":"24","area":"예술·문학·역사","title":"회화의 기법과 재료","items":[{"ko":"트롱프뢰유","en":"trompe-l'oeil","def":"실제 사물처럼 착각하게 만드는 극도로 사실적인 눈속임 회화 기법.","ex":"벽에 그린 그림인데 진짜 창문이나 계단처럼 보여 관람객이 손을 뻗어 만져보게 되는 경우."},{"ko":"데칼코마니","en":"decalcomania","def":"물감을 종이에 바른 뒤 반으로 접거나 다른 면에 눌러 찍어 우연한 대칭 무늬를 만드는 기법.","ex":"물감을 찍고 종이를 반으로 접었다 펴면 좌우가 똑같은 나비 모양 얼룩이 생기는 것."},{"ko":"선형 원근법","en":"linear perspective","def":"소실점을 향해 선들이 모이도록 그려 평면 위에 입체적 공간감을 만드는 원근 표현 기법.","ex":"길게 뻗은 철로를 그릴 때 두 선이 화면 저 멀리 한 점에서 만나도록 그려 거리감을 주는 것."},{"ko":"회화의 지지체","en":"painting support","def":"물감이 발려 그림이 그려지는 캔버스, 목판, 벽 등 밑바탕 재료를 가리키는 말.","ex":"유화를 천 캔버스 대신 나무판 위에 그려 훨씬 오래 보존되게 만든 경우."},{"ko":"청색 안료(라피스라줄리)","en":"lapis lazuli","def":"준보석을 갈아 만든 짙은 파란색 안료로, 과거에는 금보다 비싸 귀하게 쓰였다.","ex":"중세 화가가 성모마리아의 옷을 칠할 때만 이 값비싼 파란 안료를 아껴 사용한 경우."},{"ko":"태피스트리","en":"tapestry","def":"색실을 씨실과 날실로 짜서 그림이나 문양을 표현한 직물 형태의 벽걸이 예술품.","ex":"중세 성벽에 전쟁 장면을 짜 넣은 커다란 천을 걸어 이야기를 전하고 냉기도 막은 것."}]},{"no":"25","area":"예술·문학·역사","title":"예술가 인물 연구","items":[{"ko":"레오나르도 다빈치","en":"Leonardo da Vinci","def":"회화, 해부학, 공학을 넘나들며 활동한 르네상스 시대의 대표적 만능 예술가.","ex":"\"모나리자\"를 그리는 한편 시체를 해부해 인체 근육 구조를 스케치로 남긴 것."},{"ko":"해부학","en":"anatomy","def":"인체 근육과 뼈의 구조를 연구하는 학문으로, 르네상스 화가들이 사실적 인체 표현을 위해 익혔다.","ex":"화가가 팔을 자연스럽게 그리기 위해 먼저 뼈와 근육이 어떻게 연결되는지 공부하는 것."},{"ko":"르네상스","en":"Renaissance","def":"14~16세기 유럽에서 고대 그리스·로마 문화를 재조명하며 미술과 학문이 크게 발전한 시기.","ex":"부유해진 피렌체 상인 가문이 화가와 학자들을 후원해 도시 곳곳에 성당과 조각상을 세우게 한 것."},{"ko":"자화상","en":"self-portrait","def":"화가가 자기 자신을 모델로 삼아 그린 초상화.","ex":"화가가 거울을 보며 자신의 표정과 심리 상태를 그대로 캔버스에 옮긴 작품."}]},{"no":"26","area":"예술·문학·역사","title":"서양 음악의 연주와 지휘","items":[{"ko":"오케스트라 지휘","en":"orchestral conducting","def":"지휘자가 몸짓과 지휘봉으로 여러 연주자의 박자, 강약, 표현을 하나로 통합하는 행위.","ex":"지휘자가 팔을 크게 휘저어 오케스트라 전체가 동시에 소리를 점점 키우도록 이끄는 것."},{"ko":"지휘봉","en":"baton","def":"지휘자가 손에 쥐고 박자와 손짓의 방향을 더 또렷하게 전달하기 위해 사용하는 얇은 막대.","ex":"지휘자가 지휘봉 끝을 아래로 툭 내리쳐서 연주자들에게 정확한 시작 타이밍을 주는 것."},{"ko":"음악적 해석","en":"musical interpretation","def":"같은 악보라도 연주자나 지휘자가 속도, 강약, 분위기를 다르게 선택해 표현하는 방식.","ex":"같은 교향곡을 어떤 지휘자는 느리고 웅장하게, 어떤 지휘자는 빠르고 경쾌하게 연주하는 것."},{"ko":"류트 송","en":"lute song","def":"류트라는 현악기 반주에 맞춰 부르던 르네상스 시대 유럽의 독창곡 장르.","ex":"궁정에서 가수 한 명이 류트를 든 반주자 옆에서 사랑 노래를 부르는 것."}]},{"no":"27","area":"예술·문학·역사","title":"악기의 발전과 대중음악 장르","items":[{"ko":"재즈","en":"jazz","def":"19세기 말~20세기 초 미국 뉴올리언스에서 흑인 음악 전통과 유럽 화성이 섞여 탄생한 즉흥 중심 음악.","ex":"트럼펫 연주자가 정해진 악보 없이 그 자리에서 멜로디를 자유롭게 바꿔가며 연주하는 것."},{"ko":"즉흥연주","en":"improvisation","def":"미리 짜인 악보 없이 연주자가 그 순간 떠오르는 멜로디나 리듬을 즉석에서 만들어내는 연주 방식.","ex":"재즈 밴드에서 한 연주자가 솔로 순간에 정해지지 않은 멜로디를 즉석에서 이어가는 것."},{"ko":"보사노바","en":"bossa nova","def":"1950년대 브라질에서 삼바 리듬과 재즈 화성이 결합해 탄생한 부드럽고 나른한 느낌의 음악 장르.","ex":"기타의 잔잔한 리듬 위에 낮은 목소리로 속삭이듯 노래하는 브라질 음악."},{"ko":"신시사이저","en":"synthesizer","def":"전자 회로로 소리를 직접 만들고 조작해 다양한 음색을 낼 수 있는 전자 악기.","ex":"버튼 하나로 피아노 소리를 우주적인 전자음으로 바꿔 연주하는 것."}]},{"no":"28","area":"예술·문학·역사","title":"공연예술과 영상매체의 역사","items":[{"ko":"비선형 서사","en":"nonlinear narrative","def":"사건을 시간 순서대로 보여주지 않고 과거와 현재를 오가거나 순서를 뒤섞어 전달하는 이야기 구성 방식.","ex":"영화가 주인공의 죽음 장면으로 먼저 시작한 뒤, 그가 어떻게 그 상황에 이르렀는지 과거로 돌아가 설명하는 것."},{"ko":"그리스 비극","en":"Greek tragedy","def":"고대 그리스에서 인간의 운명과 몰락을 다룬 진지한 주제의 연극 장르로, 서양 연극의 기원이 된다.","ex":"주인공이 자신의 오만함 때문에 신의 벌을 받아 파멸에 이르는 구조를 가진 고대 연극."},{"ko":"가스등 조명","en":"gas lighting","def":"19세기 극장에서 촛불을 대체해 밝기 조절이 가능해진 가스를 이용한 무대 조명 방식.","ex":"장면 분위기에 맞춰 무대를 서서히 어둡게 낮추는 연출이 가스등 도입 이후 가능해진 것."},{"ko":"다큐멘터리","en":"documentary","def":"실제 사건이나 인물을 허구 없이 사실 그대로 기록해 보여주는 영상 장르.","ex":"배우의 연기 없이 실제 인물을 인터뷰하며 그의 삶을 그대로 촬영해 담은 영상."}]},{"no":"29","area":"예술·문학·역사","title":"문학의 구조와 모티프","items":[{"ko":"마술적 사실주의","en":"magical realism","def":"현실적인 배경과 사건 속에 마법 같은 초자연적 요소를 아무렇지 않게 섞어 넣는 문학 기법.","ex":"마을 이야기 속 한 인물이 하늘로 둥둥 떠오르는 장면을 다른 등장인물들이 놀라지 않고 자연스럽게 받아들이는 것."},{"ko":"영웅의 여정","en":"hero's journey","def":"평범한 주인공이 부름을 받아 시련을 겪고 성장한 뒤 돌아오는, 많은 신화와 이야기에 반복되는 서사 구조.","ex":"평범한 소년이 마을을 떠나 괴물과 싸운 뒤 지혜를 얻어 고향으로 돌아오는 전형적인 모험 구조."},{"ko":"고립 모티프","en":"isolation","def":"인물이 사회나 타인으로부터 물리적, 정서적으로 단절된 상태를 반복적으로 다루는 문학적 소재.","ex":"무인도에 혼자 남겨진 인물이 점점 자신과 대화하며 정체성을 되짚어보는 이야기."},{"ko":"모티프","en":"motif","def":"작품 전체에서 반복적으로 등장해 주제나 분위기를 강화하는 이미지, 상징, 구절.","ex":"소설 속에서 \"비\"라는 단어가 슬픈 장면마다 반복해서 등장해 우울한 분위기를 계속 환기하는 것."}]},{"no":"30","area":"예술·문학·역사","title":"서양 철학의 주요 개념","items":[{"ko":"가치론","en":"value theory","def":"어떤 것이 왜 가치를 갖는지를 다루는 철학 분야로, 그 자체로 좋은 것과 수단으로서 좋은 것을 구분한다.","ex":"행복은 그 자체로 소중하지만, 돈은 행복을 얻기 위한 수단으로서만 가치를 갖는다고 나누는 것."},{"ko":"본래적 가치","en":"intrinsic value","def":"다른 무언가를 위한 수단이 아니라 그 자체로서 좋은 것으로 평가되는 가치.","ex":"우정을 돈을 벌기 위한 수단이 아니라 그 자체로 소중하게 여기는 경우."},{"ko":"도구적 가치","en":"instrumental value","def":"그 자체로는 가치가 없지만 다른 목적을 이루는 수단이 되기 때문에 갖게 되는 가치.","ex":"돈 자체는 종이일 뿐이지만 원하는 것을 살 수 있게 해주기 때문에 가치를 갖는 것."},{"ko":"실존주의","en":"existentialism","def":"정해진 본질이나 운명 없이 인간이 스스로 선택을 통해 자신의 존재 의미를 만들어간다고 보는 철학 사조.","ex":"안정된 회사를 그만두고 화가가 되기로 한 사람이, 그 선택이 옳은지는 아무도 정해준 적 없다며 스스로 받아들이는 것."}]},{"no":"31","area":"예술·문학·역사","title":"고대 교역로와 항해술","items":[{"ko":"실크로드","en":"Silk Road","def":"고대 중국과 지중해 지역을 잇던 육상 교역로로, 비단뿐 아니라 다양한 물자와 문화가 오갔다.","ex":"중국의 비단이 이 길을 따라 상인들의 손을 여러 번 거쳐 결국 로마까지 전해진 것."},{"ko":"문화 교류","en":"cultural exchange","def":"교역이나 이동을 통해 서로 다른 지역의 언어, 종교, 기술, 예술이 섞이고 전파되는 현상.","ex":"교역로를 오가던 상인들을 통해 한 지역의 종교가 멀리 떨어진 다른 지역까지 전파된 것."},{"ko":"페니키아인","en":"Phoenician","def":"고대 지중해 동부 해안에 살며 뛰어난 항해술과 무역망으로 지중해 전역에 도시를 세운 상업 민족.","ex":"알파벳의 원형을 만들어 지중해 여러 지역에 전파한 상인 집단으로 알려진 것."},{"ko":"페트라","en":"Petra","def":"고대 나바테아인이 절벽을 깎아 건설한 요르단의 무역 도시로, 사막 교역로의 중심지였다.","ex":"사막 한가운데 붉은 바위산을 깎아 만든 신전과 무덤이 대상들의 중요한 교역 거점이 된 것."}]},{"no":"32","area":"예술·문학·역사","title":"로마·비잔틴 제국과 중세 유럽의 형성","items":[{"ko":"로마 수도교","en":"aqueduct","def":"높은 곳의 물을 경사를 이용해 먼 도시까지 끌어오도록 로마인이 건설한 다리 형태의 수로 시설.","ex":"산속 수원지의 물이 완만한 경사의 돌다리를 타고 수십 킬로미터 떨어진 도시까지 흘러온 것."},{"ko":"봉건제","en":"feudalism","def":"중세 유럽에서 왕이 귀족에게 땅을 나눠주고, 귀족은 그 대가로 군사적 충성을 바치던 계층적 사회 체제.","ex":"영주가 기사에게 땅을 내어주는 대신, 기사는 전쟁이 나면 영주를 위해 싸우기로 약속한 것."},{"ko":"비잔틴 제국","en":"Byzantine Empire","def":"서로마 제국 멸망 이후에도 콘스탄티노플을 수도로 천 년 가까이 이어진 동로마 제국.","ex":"서로마가 무너진 뒤에도 그리스·로마의 학문과 문헌을 보존해 훗날 유럽에 전한 것."},{"ko":"콘스탄티노플","en":"Constantinople","def":"비잔틴 제국의 수도로, 유럽과 아시아를 잇는 지리적 요충지이자 무역·학문의 중심지였다.","ex":"동서 교역로가 만나는 지점에 위치해 상인과 학자들이 끊임없이 오간 도시."}]},{"no":"33","area":"예술·문학·역사","title":"고고학 발굴과 문명의 흔적","items":[{"ko":"파이스토스 원반","en":"Phaistos Disc","def":"크레타 섬에서 발견된, 아직 완전히 해독되지 않은 상형문자가 나선형으로 새겨진 원반형 점토판.","ex":"원반 표면에 나선형으로 찍힌 그림 문자가 무슨 뜻인지 학자들 사이에서도 의견이 갈리는 것."},{"ko":"미노스 문명","en":"Minoan civilization","def":"청동기시대 크레타 섬에서 번성한, 유럽에서 가장 오래된 문명 중 하나로 꼽히는 고대 문명.","ex":"화려한 벽화로 장식된 궁전 유적이 크레타 섬에서 발굴되어 이 고대 문명의 존재를 알려준 것."},{"ko":"점토판","en":"clay tablet","def":"축축한 점토에 글자를 새긴 뒤 굳혀 만든, 고대 문서 기록에 널리 쓰인 매체.","ex":"쐐기 모양 도구로 점토판에 곡물 거래 내역을 눌러 새긴 뒤 햇볕에 말려 보관한 것."},{"ko":"미라화","en":"mummification","def":"시신이 썩지 않도록 특수 처리해 오랜 기간 보존하는 방법으로, 자연적으로도 인위적으로도 일어난다.","ex":"늪지의 산소 부족한 환경 때문에 수천 년 전 시신의 피부와 머리카락까지 그대로 남아 발견된 것."},{"ko":"청동기시대","en":"Bronze Age","def":"인류가 구리와 주석을 합금한 청동으로 도구와 무기를 만들어 쓰기 시작한 시대.","ex":"돌로 만든 도끼 대신 훨씬 단단하고 날카로운 청동 도끼를 사용하기 시작한 시기."},{"ko":"농경","en":"agriculture","def":"채집과 수렵 대신 작물을 재배하고 가축을 기르며 정착 생활을 가능하게 한 생산 방식.","ex":"계절마다 먹을 것을 찾아 이동하던 사람들이 한곳에 정착해 밀을 심고 거두기 시작한 것."}]},{"no":"34","area":"예술·문학·역사","title":"산업화·도시화와 근대 기술사","items":[{"ko":"산업혁명","en":"Industrial Revolution","def":"18~19세기 기계와 공장 생산이 확산되며 경제와 사회 구조가 급격히 바뀐 변화의 시기.","ex":"손으로 짜던 옷감을 증기기관으로 움직이는 기계가 대신 짜면서 생산량이 폭발적으로 늘어난 것."},{"ko":"인쇄기","en":"printing press","def":"활자를 이용해 문서를 빠르고 대량으로 찍어낼 수 있게 한 근대 초기의 인쇄 기계.","ex":"손으로 일일이 베끼던 책을 한 번에 수백 부씩 찍어내 값싸게 널리 퍼뜨릴 수 있게 된 것."},{"ko":"카메라 옵스큐라","en":"camera obscura","def":"어두운 방 벽에 작은 구멍을 뚫어 바깥 풍경이 반대편 벽에 거꾸로 비치게 만든, 사진기의 원리가 된 장치.","ex":"화가가 이 장치로 벽에 비친 풍경을 따라 그려 정확한 비례의 그림을 그린 것."},{"ko":"헬리오그래피","en":"heliography","def":"빛에 반응하는 물질을 이용해 세계 최초로 영구적인 이미지를 남긴 초기 사진 기술.","ex":"감광 물질을 바른 판을 몇 시간 동안 빛에 노출시켜 창밖 풍경을 희미하게나마 남긴 것."}]},{"no":"35","area":"지구·환경·물리","title":"기후변화와 생태계","items":[{"ko":"해양 산성화","en":"ocean acidification","def":"대기 중 이산화탄소가 바닷물에 녹아 pH가 낮아지는 현상. 산호와 조개류의 석회질 골격 형성을 방해한다.","ex":"산호초가 하얗게 변해 죽어가는 백화현상의 원인 중 하나로 해양 산성화가 꼽힌다."},{"ko":"생태발자국","en":"ecological footprint","def":"한 사람 또는 집단이 자원을 소비하고 폐기물을 처리하는 데 필요한 토지·바다의 면적으로 나타낸 지표.","ex":"선진국 국민의 생태발자국이 개발도상국보다 훨씬 커서 지구가 여러 개 필요하다는 계산이 나온다."},{"ko":"탄소발자국","en":"carbon footprint","def":"개인이나 활동이 직간접적으로 배출하는 온실가스의 총량을 이산화탄소 기준으로 환산한 값.","ex":"비행기 여행 한 번이 자동차를 몇 달 타는 것과 맞먹는 탄소발자국을 남기기도 한다."},{"ko":"온실가스","en":"greenhouse gases","def":"태양열을 대기 중에 가두어 지구 온도를 높이는 기체. 이산화탄소, 메탄 등이 대표적이다.","ex":"화석연료를 태울 때 나오는 온실가스가 지구온난화를 가속시킨다."},{"ko":"지구공학","en":"geoengineering","def":"기후변화를 인위적으로 억제하기 위해 지구 시스템에 대규모로 개입하는 기술.","ex":"성층권에 에어로졸을 뿌려 햇빛을 반사시키자는 제안도 지구공학의 한 사례다."},{"ko":"영구동토층","en":"permafrost","def":"2년 이상 계속 얼어 있는 땅. 녹으면 갇혀 있던 메탄과 이산화탄소가 대량 방출된다.","ex":"시베리아 영구동토층이 녹으면서 그 안에 묻혀 있던 고대 유기물이 분해되어 온실가스를 뿜어낸다."}]},{"no":"36","area":"지구·환경·물리","title":"에너지 생산 기술","items":[{"ko":"재생에너지","en":"renewable energy","def":"태양광, 풍력처럼 자연적으로 계속 보충되는 자원에서 얻는 에너지.","ex":"지붕에 태양광 패널을 얹은 어느 가정은 전기요금 고지서가 한 달 내내 0원으로 나왔다."},{"ko":"광전지","en":"photovoltaic cell","def":"빛 에너지를 반도체를 이용해 직접 전기로 바꾸는 장치. 태양전지의 기본 단위다.","ex":"태양광 패널은 수많은 광전지를 이어 붙여 만든다."},{"ko":"반도체","en":"semiconductor","def":"전기를 특정 조건에서만 전도하는 물질. 실리콘이 대표적이며 전자기기의 핵심 소재다.","ex":"스마트폰 속 손톱만 한 반도체 칩 하나에 수십억 개의 트랜지스터가 들어차 있다."},{"ko":"플라스마","en":"plasma","def":"기체가 초고온에서 이온화되어 전기적으로 대전된 입자들로 이루어진 물질의 상태.","ex":"핵융합로 안에서는 수소 연료가 수백만 도로 가열되어 플라스마 상태가 된다."}]},{"no":"37","area":"지구·환경·물리","title":"도시 환경과 삶의 질","items":[{"ko":"옥상 녹화","en":"green roofs","def":"건물 옥상에 식물을 심어 조성한 녹지. 단열 효과와 빗물 흡수 기능이 있다.","ex":"옥상에 잔디를 깔아둔 건물은 한여름에도 꼭대기 층 냉방비가 눈에 띄게 줄었다는 후기가 많다."},{"ko":"우수","en":"stormwater","def":"비가 내려 지표를 흐르는 물. 도시에서는 배수 시설로 처리해야 할 대상이 된다.","ex":"포장된 도로가 많은 도시에서는 우수가 땅에 스며들지 못해 홍수 위험이 커진다."},{"ko":"도시 열섬현상","en":"urban heat island","def":"건물과 아스팔트가 열을 흡수해 도심 기온이 주변 지역보다 높아지는 현상.","ex":"한여름 도심의 기온이 교외보다 몇 도씩 높게 나타나는 것이 도시 열섬현상의 예다."},{"ko":"도시 텃밭","en":"urban gardening","def":"도시의 자투리 공간에서 채소나 화초를 직접 기르는 활동.","ex":"아파트 옥상에 상추와 방울토마토를 심은 주민들이 수확철마다 이웃과 반찬을 나눠 먹는다."}]},{"no":"38","area":"지구·환경·물리","title":"오염과 친환경 화학","items":[{"ko":"런던 대스모그","en":"Great Smog","def":"1952년 런던에서 석탄 매연과 안개가 결합해 발생한 대규모 대기오염 사건.","ex":"런던 대스모그 이후 영국은 청정대기법을 제정해 석탄 사용을 규제하기 시작했다."},{"ko":"이산화황","en":"sulfur dioxide","def":"황을 포함한 화석연료를 태울 때 나오는 자극성 기체. 산성비의 주요 원인이다.","ex":"공장 굴뚝에서 배출된 이산화황이 대기 중 수분과 반응해 산성비로 내리기도 한다."},{"ko":"그린 화학","en":"green chemistry","def":"유해 물질의 사용과 발생을 줄이는 방향으로 화학 제품과 공정을 설계하는 분야.","ex":"세제 회사가 표백제 대신 옥수수 성분으로 만든 세탁세제를 내놓은 것이 그린 화학의 사례다."}]},{"no":"39","area":"지구·환경·물리","title":"지구의 구조와 지표 변화","items":[{"ko":"퇴적암","en":"sedimentary rocks","def":"모래, 진흙 같은 퇴적물이 오랜 시간 쌓이고 다져져 만들어진 암석.","ex":"사암과 석회암은 대표적인 퇴적암으로, 층층이 쌓인 지층에서 잘 관찰된다."},{"ko":"다짐작용","en":"compaction","def":"퇴적물이 위에 쌓인 물질의 무게에 눌려 압축되며 부피가 줄어드는 과정.","ex":"모래사장에서 사람들이 반복해서 밟고 지나간 자리가 유독 단단하게 다져져 있다."},{"ko":"교결작용","en":"cementation","def":"퇴적물 입자 사이 틈에 광물질이 침전해 입자들을 단단하게 붙이는 과정.","ex":"교결작용으로 모래 알갱이들이 서로 결합하면 단단한 사암이 만들어진다."},{"ko":"사막화","en":"desertification","def":"기후변화나 인간 활동으로 비옥했던 땅이 점차 황폐한 사막으로 변하는 현상.","ex":"과도한 방목과 가뭄이 겹치면서 사헬 지역에서는 사막화가 빠르게 진행되고 있다."}]},{"no":"40","area":"지구·환경·물리","title":"천문학과 우주 관측","items":[{"ko":"전파천문학","en":"radio astronomy","def":"가시광선이 아닌 전파를 관측해 천체를 연구하는 천문학 분야.","ex":"푸에르토리코의 아레시보 전파망원경은 외계로 인사 메시지를 쏘아 보낸 적이 있다."},{"ko":"우주배경복사","en":"cosmic microwave background","def":"빅뱅 직후 우주에 남은 열의 흔적으로, 우주 전역에서 균일하게 관측되는 마이크로파 복사.","ex":"우주배경복사의 미세한 온도 차이는 훗날 은하가 형성될 씨앗이 된 것으로 여겨진다."},{"ko":"별의 형성","en":"star formation","def":"거대한 가스와 먼지 구름이 중력에 의해 뭉쳐져 별이 만들어지는 과정.","ex":"오리온 대성운 한가운데서 갓 태어난 별이 주변 가스구름을 뜨겁게 밝히는 모습이 포착됐다."},{"ko":"분자운","en":"molecular clouds","def":"수소 분자를 주성분으로 하는 차갑고 밀도 높은 성간가스 구름. 별이 태어나는 요람이다.","ex":"오리온 대성운 같은 분자운 안에서 새로운 별들이 끊임없이 탄생하고 있다."}]},{"no":"41","area":"지구·환경·물리","title":"태양계 행성 탐사","items":[{"ko":"계곡망","en":"valley networks","def":"화성 표면에서 발견되는, 과거 물이 흘렀던 것으로 추정되는 가지 모양의 지형.","ex":"화성의 계곡망은 강물이 오랜 시간에 걸쳐 지표를 깎아 만든 지형과 매우 닮았다."},{"ko":"하천 수로","en":"river channels","def":"물이 흐르며 지표를 침식시켜 만든 길쭉한 통로 지형.","ex":"화성 표면의 마른 하천 수로는 과거 그곳에 액체 상태의 물이 흘렀다는 증거로 제시된다."},{"ko":"외계 생명체","en":"extraterrestrial life","def":"지구 밖 다른 천체에 존재할 가능성이 있는 생명체.","ex":"금성의 대기 상층부에서 생명 활동의 부산물로 추정되는 물질이 발견되며 외계 생명체 가능성이 다시 주목받았다."}]},{"no":"42","area":"지구·환경·물리","title":"일상 속 물리와 화학","items":[{"ko":"관성","en":"inertia","def":"물체가 외부 힘을 받지 않는 한 현재의 운동 상태를 그대로 유지하려는 성질.","ex":"급브레이크를 밟으면 몸이 앞으로 쏠리는 것은 관성 때문에 몸이 계속 움직이려 하기 때문이다."},{"ko":"박막 간섭","en":"thin film interference","def":"얇은 막의 위아래 표면에서 반사된 빛이 서로 겹치며 색을 만들어내는 현상.","ex":"비눗방울이나 기름막 표면에서 무지갯빛이 보이는 것은 박막 간섭 때문이다."},{"ko":"LED","en":"LED","def":"전류가 흐르면 반도체 내부에서 전자와 정공이 결합하며 빛을 내는 발광다이오드.","ex":"신호등이 예전 백열전구에서 LED로 바뀌면서 전구를 교체하는 주기가 몇 년씩 길어졌다."},{"ko":"백열전구","en":"incandescent","def":"필라멘트에 전류를 흘려 고온으로 가열함으로써 빛을 내는 방식의 전구.","ex":"백열전구를 만졌다가 너무 뜨거워 손을 뗀 경험은 에너지 대부분이 열로 새기 때문이다."}]},{"no":"43","area":"지구·환경·물리","title":"대기와 해양의 특이 현상","items":[{"ko":"제트기류","en":"jet stream","def":"대류권 상층부에서 매우 빠른 속도로 부는 좁고 긴 띠 모양의 바람.","ex":"비행기가 미국 서부에서 동부로 갈 때 제트기류를 타면 비행시간이 단축된다."},{"ko":"수중청음기","en":"hydrophone","def":"물속의 음파를 감지해 전기 신호로 바꾸는 수중 마이크.","ex":"연구자들은 수중청음기를 이용해 심해에서 들려오는 정체불명의 소리를 기록했다."},{"ko":"대기","en":"atmosphere","def":"지구를 둘러싸고 있는 기체 층으로, 여러 층으로 나뉘며 각기 다른 특성을 가진다.","ex":"대기 최상층에서는 밀도가 매우 낮아 소리가 거의 전달되지 않는다."}]},{"no":"44","area":"기술·공학·경제","title":"경제학의 기본 개념과 행동경제학","items":[{"ko":"휴리스틱","en":"heuristics","def":"복잡한 문제를 빠르게 풀기 위해 사용하는 단순화된 어림짐작 판단 방법.","ex":"낯선 도시에서 \"사람이 많은 식당이 맛있겠지\"라고 판단해 고르는 것."},{"ko":"기회비용","en":"opportunity cost","def":"하나를 선택함으로써 포기해야 하는 다른 대안들 중 가장 가치 있는 것.","ex":"대학원 진학을 택하면 그 기간에 벌 수 있었던 직장 급여가 기회비용이 된다."},{"ko":"트레이드오프","en":"trade-off","def":"한 가지를 얻으려면 다른 무언가를 반드시 포기해야 하는 균형 관계.","ex":"항공사가 좌석 간격을 줄여 항공권 값을 낮추자, 승객들은 다리를 뻗기 힘들어진 것."}]},{"no":"45","area":"기술·공학·경제","title":"혁신 경영과 발명의 역사","items":[{"ko":"파괴적 혁신","en":"disruptive innovation","def":"처음엔 성능이 부족해 보이지만 점차 발전해 기존 시장의 주류 제품을 밀어내는 혁신.","ex":"초기 디지털카메라가 필름 카메라 시장을 서서히 대체한 것이 대표적 사례다."},{"ko":"린 스타트업","en":"lean startup","def":"완벽한 제품을 만들기보다 최소한의 형태로 빠르게 출시해, 시장 반응을 보며 고쳐가는 창업 방식.","ex":"핵심 기능만 넣은 앱을 먼저 출시하고, 사용자 피드백을 받아 계속 개선하는 방식."},{"ko":"최소 기능 제품","en":"minimum viable product","def":"핵심 기능만 담아 시장에 내놓는, 반응 검증용 최소한의 시제품.","ex":"신발을 미리 사두지 않고 홈페이지만 만들어, 주문이 들어오면 그때 신발을 사서 배송한 초기 사업 모델."},{"ko":"스타트업 인큐베이터","en":"startup incubator","def":"초기 창업 기업에게 공간, 자금, 멘토링 등을 지원해 성장을 돕는 기관.","ex":"캠퍼스에 입주한 스타트업들이 사무 공간과 투자자 소개를 함께 지원받는 것."}]},{"no":"46","area":"기술·공학·경제","title":"새로운 노동과 정책 실험","items":[{"ko":"기본소득","en":"universal basic income","def":"조건 없이 모든 국민에게 정기적으로 일정 금액을 지급하는 복지 제도.","ex":"핀란드가 실업자 일부에게 조건 없이 매달 일정액을 지급하며 근로 의욕 변화를 실험한 것."},{"ko":"시범 프로그램","en":"pilot program","def":"제도를 전국적으로 시행하기 전에 소규모로 먼저 실시해 효과를 검증하는 시험 운영.","ex":"새 복지 정책을 한 도시에서만 2년간 시범 운영해 본 뒤 확대 여부를 결정하는 것."},{"ko":"긱 이코노미","en":"gig economy","def":"정규직 고용 대신 필요할 때마다 단기 계약으로 일을 맡기고 맡는 노동 형태가 중심이 된 경제.","ex":"배달 앱 기사나 프리랜서 디자이너처럼 건별로 일감을 받아 일하는 사람들이 늘어나는 현상."}]},{"no":"47","area":"기술·공학·경제","title":"마케팅과 유통 전략","items":[{"ko":"스토리텔링 마케팅","en":"storytelling","def":"제품 정보를 나열하는 대신 이야기 형식으로 전달해 소비자의 공감을 이끌어내는 마케팅 기법.","ex":"신발 브랜드가 창업자가 어려움을 딛고 첫 신발을 만든 이야기를 광고에 담는 것."},{"ko":"브랜드 내러티브","en":"brand narrative","def":"하나의 브랜드가 시간이 지나도 일관되게 전달하는 정체성과 가치관의 이야기.","ex":"한 커피 브랜드가 \"작은 농장과의 신뢰\"라는 서사를 광고와 매장 디자인에 일관되게 담는 것."},{"ko":"감성 소구","en":"emotional appeal","def":"논리나 정보보다 감정을 자극해 소비자의 마음을 움직이려는 설득 전략.","ex":"보험 광고가 통계 대신 가족의 따뜻한 순간을 보여주며 안전의 필요성을 느끼게 하는 것."}]},{"no":"48","area":"기술·공학·경제","title":"생체모방 공학","items":[{"ko":"생체모방","en":"biomimicry","def":"자연에 존재하는 생물의 구조나 원리를 관찰해 기술이나 디자인에 응용하는 것.","ex":"상어 피부의 미세한 돌기 무늬를 본떠 물의 저항을 줄인 수영복을 만드는 것."},{"ko":"수동 냉각","en":"passive cooling","def":"전기 장치 없이 건축 구조나 자연 원리만으로 실내 온도를 낮추는 방식.","ex":"흰개미집의 통풍 구조를 본떠 에어컨 없이도 시원함을 유지하는 건물을 설계하는 것."},{"ko":"큰턱","en":"mandible","def":"곤충이 먹이를 물거나 자르는 데 쓰는, 입 주위의 강한 턱 부위.","ex":"개미가 자기 몸무게의 몇 배나 되는 물체를 큰턱으로 물어 옮기는 힘을 로봇 설계에 응용하는 것."}]},{"no":"49","area":"기술·공학·경제","title":"인공지능의 발전과 사회적 영향","items":[{"ko":"전문가 시스템","en":"expert system","def":"특정 분야 전문가의 지식과 판단 규칙을 프로그램으로 구현해, 그 분야 문제에 조언이나 진단을 내리는 컴퓨터 시스템.","ex":"환자의 증상을 입력받아 가능한 세균 감염과 항생제를 제안하도록 만든 초기 의료 프로그램 마이신(MYCIN)."},{"ko":"양자 컴퓨팅","en":"quantum computing","def":"원자 단위의 물리 현상을 이용해, 기존 컴퓨터보다 특정 계산을 훨씬 빠르게 처리하는 컴퓨팅 방식.","ex":"신약 개발에 필요한 분자 구조 계산을 기존 컴퓨터로는 수년 걸릴 것을 훨씬 단축하려는 연구."},{"ko":"큐비트","en":"qubit","def":"양자 컴퓨터가 정보를 저장하는 최소 단위로, 일반 컴퓨터의 비트와 달리 0과 1을 동시에 나타낼 수 있다.","ex":"동전을 던진 순간 앞면과 뒷면이 동시에 겹쳐 있다고 상상하면 큐비트의 상태와 비슷하다."},{"ko":"자동화","en":"automation","def":"기계나 소프트웨어가 사람이 하던 작업을 대신 수행하게 되면서 일자리 구조가 바뀌는 현상.","ex":"콜센터 상담원의 업무 상당 부분을 챗봇이 대신하게 되면서 관련 일자리가 줄어드는 것."}]},{"no":"50","area":"기술·공학·경제","title":"수리과학과 정보기술","items":[{"ko":"조화 해석","en":"harmonic analysis","def":"복잡한 신호나 파동을 여러 개의 단순한 주기 함수(사인·코사인)의 합으로 분해해 분석하는 수학 분야.","ex":"복잡한 음악 소리를 여러 개의 순수한 음(주파수)으로 나누어 분석하는 것."},{"ko":"기본 주파수","en":"fundamental frequency","def":"어떤 소리나 신호를 구성하는 여러 주파수 중 가장 낮고 기본이 되는 진동수.","ex":"기타 줄을 튕겼을 때 가장 두드러지게 들리는 낮은 음이 그 소리의 기본 주파수다."},{"ko":"근사 이론","en":"approximation theory","def":"정확히 계산하기 어려운 함수나 값을 더 간단한 함수로 최대한 비슷하게 표현하는 방법을 다루는 이론.","ex":"복잡한 곡선을 여러 개의 직선 조각으로 대략 그려서 컴퓨터 계산을 빠르게 하는 것."},{"ko":"병렬 알고리즘","en":"parallel algorithm","def":"하나의 문제를 여러 부분으로 나누어, 여러 처리장치가 동시에 계산하도록 설계된 알고리즘.","ex":"큰 사진 파일을 4등분해서 4개의 프로세서가 동시에 보정하면 훨씬 빨리 끝나는 것."}]},{"no":"51","area":"기술·공학·경제","title":"첨단 소재와 나노기술","items":[{"ko":"스마트 섬유","en":"smart textile","def":"온도, 압력, 습도 같은 외부 자극에 반응하거나 전자 기능을 내장한 옷감.","ex":"체온에 따라 색이 변하거나, 심박수를 측정해 스마트폰으로 전송하는 운동복."},{"ko":"상변화 물질","en":"phase-change material","def":"고체와 액체 사이를 오가며 열을 흡수하거나 방출해 온도를 일정하게 유지하는 데 쓰이는 소재.","ex":"낮에는 열을 흡수해 녹고 밤에는 열을 내보내며 굳어, 실내 온도를 일정하게 유지하는 벽 소재."},{"ko":"나노입자","en":"nanoparticle","def":"크기가 1~100나노미터에 불과할 만큼 매우 작은 입자로, 작아질수록 성질이 크게 달라진다.","ex":"같은 금이라도 나노입자 크기가 되면 노란색이 아니라 빨간색을 띠게 되는 것."},{"ko":"나노기술","en":"nanotechnology","def":"물질을 원자·분자 단위로 조작해 새로운 성질을 가진 소재나 장치를 만드는 기술.","ex":"옷감 표면에 나노 크기의 돌기를 만들어 물이 스며들지 않고 방울져 굴러떨어지게 만드는 것."}]},{"no":"52","area":"기술·공학·경제","title":"지속가능성과 도시 인프라","items":[{"ko":"부유식 풍력 터빈","en":"floating wind turbine","def":"바다 밑바닥에 고정하지 않고 물 위에 띄운 채로 계류줄로 고정해 전기를 생산하는 풍력 발전 설비.","ex":"수심이 너무 깊어 기둥을 박을 수 없는 먼바다에서도 부유식 풍력 터빈은 설치할 수 있다."},{"ko":"계류 시스템","en":"mooring system","def":"물 위에 떠 있는 구조물이 파도나 바람에 떠밀려 가지 않도록 바닥에 고정하는 줄과 닻의 체계.","ex":"부유식 터빈이 태풍에도 제자리를 지키도록 여러 개의 줄로 해저에 고정하는 계류 시스템."},{"ko":"로마 콘크리트","en":"Roman concrete","def":"고대 로마인들이 화산재를 섞어 만든 콘크리트로, 현대 콘크리트보다 바닷물 속에서 오래 견디는 것으로 알려져 있다.","ex":"2천 년 전에 지어진 로마의 방파제가 지금도 바닷물 속에서 무너지지 않고 남아 있는 것."},{"ko":"화산재","en":"volcanic ash","def":"화산 폭발로 분출된 미세한 광물 입자로, 특정 화학 성분이 콘크리트 강도를 높이는 데 쓰인다.","ex":"로마인들이 콘크리트에 화산재를 섞어 바닷물과 반응해 더 단단해지는 효과를 얻었다."}]},{"no":"53","area":"기술·공학·경제","title":"현대 농업 기술","items":[{"ko":"정밀 농업","en":"precision farming","def":"위성 영상이나 센서 데이터를 이용해 농지 상태를 구역별로 파악하고, 필요한 만큼만 물과 비료를 주는 농업 방식.","ex":"드론으로 찍은 영상을 분석해 물이 부족한 구역에만 자동으로 물을 더 주는 스마트 농장."},{"ko":"위성 영상","en":"satellite imagery","def":"인공위성이 촬영한 지표면 사진으로, 넓은 지역의 상태를 한눈에 파악하는 데 쓰인다.","ex":"위성 영상으로 농작물의 색깔 변화를 분석해 어느 구역이 병충해를 입었는지 미리 찾아내는 것."},{"ko":"작물 수확량","en":"crop yield","def":"일정한 농지 면적에서 거두어들이는 농작물의 양.","ex":"같은 밭이라도 비료를 적절히 준 해에는 작물 수확량이 눈에 띄게 늘어난다."}]},{"no":"54","area":"기술·공학·경제","title":"정밀 제어와 방위 기술","items":[{"ko":"스텔스 기술","en":"stealth technology","def":"레이더나 적외선 탐지 장비에 잘 잡히지 않도록 기체의 모양과 표면 소재를 설계하는 기술.","ex":"비행기 표면을 각진 다면체로 만들어, 레이더 전파가 발신지로 되돌아가지 않고 흩어지게 하는 것."},{"ko":"레이더","en":"radar","def":"전파를 쏘아 보낸 뒤 물체에 부딪혀 되돌아오는 신호를 분석해 위치와 거리를 알아내는 장치.","ex":"관제탑이 레이더로 하늘 위 비행기의 위치를 실시간으로 추적하는 것."},{"ko":"F-117 나이트호크","en":"F-117 Nighthawk","def":"세계 최초로 실전 배치된 스텔스 전투기로, 각진 표면 설계로 레이더 탐지를 피하도록 만들어졌다.","ex":"걸프전에서 적의 레이더망을 거의 들키지 않고 통과해 정밀 폭격 임무를 수행한 미군기."}]}]}</script>
<script>
(function(){
  "use strict";
  var KEY="novetoefl-bg-area";
  var G=null, area="전체", query="";
  try{ area=localStorage.getItem(KEY)||"전체" }catch(e){}

  var $main=document.getElementById("main"), $areas=document.getElementById("areas"),
      $q=document.getElementById("q"), $tot=document.getElementById("tot");
  function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}

  var tag=document.getElementById("DATA"), raw=tag?tag.textContent.trim():"";
  (raw ? Promise.resolve(JSON.parse(raw))
       : fetch("data/bg.json").then(function(r){return r.json()})
  ).then(function(j){ G=j.groups; buildAreas(); render(); })
   .catch(function(){ $main.innerHTML='<p class="empty">배경지식을 불러오지 못했습니다.</p>' });

  function areas(){
    var seen=[], out=["전체"];
    G.forEach(function(g){ if(seen.indexOf(g.area)<0){seen.push(g.area);out.push(g.area)} });
    return out;
  }

  function buildAreas(){
    $areas.innerHTML="";
    areas().forEach(function(a){
      var n=a==="전체"?G.length:G.filter(function(g){return g.area===a}).length;
      var b=el("button",null,a+" "+n);
      b.setAttribute("role","tab");
      b.setAttribute("aria-selected", a===area?"true":"false");
      b.onclick=function(){
        area=a; try{localStorage.setItem(KEY,a)}catch(e){}
        buildAreas(); render(); window.scrollTo(0,0);
      };
      $areas.appendChild(b);
    });
  }

  function esc(s){return s.replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function hi(s){
    var q=query.trim(); if(!q) return esc(s);
    var safe=esc(s), rx=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
    return safe.replace(rx,"<mark>$1</mark>");
  }
  function hit(it){
    var q=query.trim().toLowerCase(); if(!q) return true;
    return (it.ko+" "+it.en+" "+it.def+" "+it.ex).toLowerCase().indexOf(q)>-1;
  }

  function render(){
    $main.innerHTML="";
    var n=0; G.forEach(function(g){n+=g.items.length});
    $tot.textContent="개념 "+n;

    var list=G.filter(function(g){return area==="전체"||g.area===area});
    var shown=0;
    list.forEach(function(g){
      var items=g.items.filter(hit);
      if(!items.length) return;
      shown++;
      var p=el("section","pack");
      var h=el("div","ph");
      h.appendChild(el("span","n",String(g.no).padStart(2,"0")));
      var t=el("div","t");
      var h2=el("h2"); h2.innerHTML=hi(g.title); t.appendChild(h2);
      t.appendChild(el("em",null,g.area));
      h.appendChild(t); p.appendChild(h);
      items.forEach(function(it){
        var b=el("div","item");
        var tm=el("div","term");
        var bb=el("b"); bb.innerHTML=hi(it.ko); tm.appendChild(bb);
        if(it.en){ var ii=el("i"); ii.innerHTML=hi(it.en); tm.appendChild(ii) }
        b.appendChild(tm);
        var df=el("p","def"); df.innerHTML=hi(it.def); b.appendChild(df);
        if(it.ex){ var eg=el("p","eg"); eg.innerHTML=hi(it.ex); b.appendChild(eg) }
        p.appendChild(b);
      });
      $main.appendChild(p);
    });
    if(!shown) $main.appendChild(el("p","empty","찾는 개념이 없습니다."));
    $main.appendChild(el("p","foot","노베토플 4.5+ 단어장 · 배경지식 54묶음 215개념"));
  }

  $q.addEventListener("input",function(){query=$q.value;render()});
})();
