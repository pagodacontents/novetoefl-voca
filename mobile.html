<title>노베토플 모바일 단어장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans:wght@400&display=swap">
<style>
/* 레이아웃 — 고정 머리(책 · DAY · 도구) 아래로 표제어 카드가 한 장씩 흐른다.
   책 두 권이 별색을 갈라 쓰므로 강조색 토큰만 책에 따라 바뀐다. */
:root{
  /* 실용 VOCA — PANTONE 170 C 계열 */
  --s1:#D1522B; --s1-fill:#FF8D6D; --s1-tint:#FFF1EB;
  /* 학술 VOCA — PANTONE 2955 C 계열 */
  --s2:#004871; --s2-fill:#003A5D; --s2-tint:#E8F0F6;

  --bg:#FDFAF8;
  --surf:#FFFFFF;
  --fg:#1B1512;
  --mut:#7C6C64;
  --faint:#A99A93;
  --line:#EDE2DC;
  --veil:#E6DAD4;

  --spot:var(--s1); --spot-fill:var(--s1-fill); --spot-tint:var(--s1-tint);

  --f-word:"Lora",Georgia,"Times New Roman",serif;
  --f-ui:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-ipa:"Noto Sans","Segoe UI",system-ui,sans-serif;

  --r:12px;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
body[data-book="2"]{ --spot:var(--s2); --spot-fill:var(--s2-fill); --spot-tint:var(--s2-tint) }

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --s1:#FFA98E; --s1-fill:#FF8D6D; --s1-tint:#2C1C16;
  --s2:#86C2E6; --s2-fill:#5AA7D4; --s2-tint:#122531;
  --bg:#141110; --surf:#1D1917; --fg:#F3ECE8; --mut:#A6968E;
  --faint:#7E6F68; --line:#2F2825; --veil:#3A3130;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --s1:#FFA98E; --s1-fill:#FF8D6D; --s1-tint:#2C1C16;
  --s2:#86C2E6; --s2-fill:#5AA7D4; --s2-tint:#122531;
  --bg:#141110; --surf:#1D1917; --fg:#F3ECE8; --mut:#A6968E;
  --faint:#7E6F68; --line:#2F2825; --veil:#3A3130;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--f-ui); font-size:15px; line-height:1.6;
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--spot-fill)}

/* ---- 머리 ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--spot-fill);color:#fff}
body[data-book="2"] .top{color:#fff}
.top-in{padding-left:var(--gut);padding-right:var(--gut-r);padding-block:10px;display:flex;flex-direction:column;gap:9px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-size:15px;font-weight:700;letter-spacing:.01em}
.brand span{font-size:11.5px;opacity:.8;font-family:var(--f-ipa);letter-spacing:.06em;text-transform:uppercase}

.books{display:flex;gap:6px}
.books button{
  flex:1;min-width:0;border:0;border-radius:999px;cursor:pointer;
  font-family:var(--f-ui);font-size:12.5px;font-weight:500;padding:7px 4px;
  background:rgba(255,255,255,.22);color:#fff;
}
.books button[aria-selected="true"]{background:#fff;color:var(--spot);font-weight:700}

.days{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.days button{
  flex:0 0 auto;border:0;border-radius:8px;cursor:pointer;
  font-family:var(--f-ipa);font-size:12px;font-weight:400;padding:6px 9px;
  background:rgba(255,255,255,.18);color:#fff;font-variant-numeric:tabular-nums;
}
.days button[aria-current="true"]{background:#fff;color:var(--spot);font-weight:700}
.days button.done::after{content:"·";margin-left:3px;opacity:.9}

/* ---- 도구 띠 ---- */
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{padding-left:var(--gut);padding-right:var(--gut-r);padding-block:8px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tool{
  border:1px solid var(--line);background:var(--surf);color:var(--mut);
  border-radius:999px;padding:5px 11px;font-family:var(--f-ui);font-size:12px;cursor:pointer;
}
.tool[aria-pressed="true"]{background:var(--spot-tint);border-color:var(--spot);color:var(--spot);font-weight:500}
.tool:focus-visible,.books button:focus-visible,.days button:focus-visible,
.find input:focus-visible,.card:focus-visible{outline:2px solid var(--spot);outline-offset:2px}
.count{margin-left:auto;font-family:var(--f-ipa);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}

.find{padding-left:var(--gut);padding-right:var(--gut-r);padding-block:0 8px}
.find input{
  width:100%;border:1px solid var(--line);background:var(--surf);color:var(--fg);
  border-radius:9px;padding:8px 11px;font-family:var(--f-ui);font-size:14px;
}
.find input::placeholder{color:var(--faint)}

/* ---- 본문 ---- */
main{padding-left:var(--gut);padding-right:var(--gut-r);padding-block:12px 40px;display:flex;flex-direction:column;gap:10px}
.head{display:flex;align-items:baseline;gap:9px;margin-bottom:2px;flex-wrap:wrap}
.head h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.head em{font-style:normal;font-family:var(--f-ipa);font-size:11.5px;letter-spacing:.08em;color:var(--spot);font-weight:400;text-transform:uppercase}
.prog{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--spot-fill);transition:width .25s}

.card{
  background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px 12px;display:flex;flex-direction:column;gap:7px;
}
.card.known{opacity:.52}
.row1{display:flex;align-items:flex-start;gap:9px}
.row1 .n{
  flex:0 0 auto;font-family:var(--f-ipa);font-size:11px;color:var(--faint);
  font-variant-numeric:tabular-nums;padding-top:5px;min-width:16px;
}
.wd{flex:1;min-width:0}
.wd b{display:block;font-family:var(--f-word);font-size:20px;font-weight:600;color:var(--spot);letter-spacing:-.01em;word-break:break-word}
.wd .ipa{font-family:var(--f-ipa);font-size:11.5px;color:var(--mut)}
.star{flex:0 0 auto;font-size:11px;color:var(--spot-fill);letter-spacing:.5px;padding-top:6px}
.tick{
  flex:0 0 auto;width:26px;height:26px;border-radius:7px;cursor:pointer;
  border:1.5px solid var(--line);background:transparent;color:transparent;
  font-size:14px;line-height:1;display:grid;place-items:center;margin-top:3px;
}
.tick[aria-pressed="true"]{border-color:var(--spot);background:var(--spot);color:#fff}
body[data-book="2"] .tick[aria-pressed="true"]{color:#fff}

.sense{display:flex;flex-direction:column;gap:5px}
.sense p{margin:0;display:flex;gap:7px;align-items:flex-start}
.pos{
  flex:0 0 auto;background:var(--spot-tint);color:var(--spot);border-radius:5px;
  font-size:10.5px;font-weight:700;padding:2px 6px;margin-top:2px;
}
.mean{font-size:14.5px;font-weight:500;min-width:0}
.syn{font-family:var(--f-word);font-size:12.5px;color:var(--spot);font-style:italic;display:block;margin-top:2px}

/* 뜻 가리기 */
body.veil .mean,body.veil .syn{
  background:var(--veil);color:transparent;border-radius:4px;cursor:pointer;
  box-shadow:0 0 0 2px var(--veil);
}
body.veil .card.open .mean,body.veil .card.open .syn{
  background:transparent;box-shadow:none;cursor:auto;
}
body.veil .card.open .mean{color:var(--fg)}
body.veil .card.open .syn{color:var(--spot)}

.note{
  display:flex;gap:8px;align-items:flex-start;background:var(--spot-tint);
  border-radius:var(--r);padding:11px 13px;font-size:12.5px;color:var(--mut);line-height:1.6;
}
.note b{color:var(--spot);font-weight:700;flex:0 0 auto}

.empty{text-align:center;color:var(--faint);font-size:13.5px;padding:48px 0;line-height:1.8}
.foot{color:var(--faint);font-size:11.5px;text-align:center;padding-top:14px;border-top:1px solid var(--line);margin-top:6px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>노베토플 단어장</b><span>Mobile</span></div>
    <div class="books" role="tablist" aria-label="권">
      <button role="tab" id="bk1" aria-selected="true">실용 VOCA · DAY 01–21</button>
      <button role="tab" id="bk2" aria-selected="false">학술 VOCA · DAY 22–42</button>
    </div>
    <div class="days" id="days" role="tablist" aria-label="DAY"></div>
  </div>
</header>

<div class="bar">
  <div class="bar-in">
    <button class="tool" id="tVeil" aria-pressed="false">뜻 가리기</button>
    <button class="tool" id="tHide" aria-pressed="false">외운 단어 접기</button>
    <button class="tool" id="tFind" aria-pressed="false">찾기</button>
    <span class="count" id="count"></span>
  </div>
  <div class="find" id="findWrap" hidden>
    <input id="q" type="search" placeholder="영어 단어나 우리말 뜻으로 찾기" autocomplete="off">
  </div>
</div>

","mean":"밀봉하다, 틈을 막다"}],"syn":["plug, block"]},{"day":42,"no":"9","word":"semiconductor","ipa":"ˌsemikənˈdʌktər","star":2,"sense":[{"pos":"명","mean":"반도체"}],"syn":[]},{"day":42,"no":"10","word":"traction","ipa":"ˈtrækʃən","star":2,"sense":[{"pos":"명","mean":"추진력, 탄력"}],"syn":["momentum"]},{"day":42,"no":"11","word":"transmit","ipa":"trænzˈmɪt","star":2,"sense":[{"pos":"동","mean":"전송하다, 보내다"}],"syn":["send, convey, relay"]},{"day":42,"no":"12","word":"affluent","ipa":"ˈæfluənt","star":1,"sense":[{"pos":"형","mean":"부유한, 풍요로운"}],"syn":["wealthy, prosperous, rich"]},{"day":42,"no":"13","word":"assembly-line","ipa":"əˈsembli laɪn","star":1,"sense":[{"pos":"형","mean":"조립 라인식의, 대량 생산식의"}],"syn":["mass-production"]},{"day":42,"no":"14","word":"calibrate","ipa":"ˈkæləbreɪt","star":1,"sense":[{"pos":"동","mean":"정밀 조정하다, 눈금을 맞추다"}],"syn":["tune, adjust"]},{"day":42,"no":"15","word":"capitalism","ipa":"ˈkæpɪtəˌlɪzəm","star":1,"sense":[{"pos":"명","mean":"자본주의"}],"syn":["private enterprise, market economy"]},{"day":42,"no":"16","word":"circulate","ipa":"ˈsərkjəleɪt","star":1,"sense":[{"pos":"동","mean":"순환하다"}],"syn":["rotate, cycle"]},{"day":42,"no":"17","word":"drainage","ipa":"ˈdreɪnədʒ","star":1,"sense":[{"pos":"명","mean":"배수"}],"syn":["draining, runoff, outflow"]},{"day":42,"no":"18","word":"fireproof","ipa":"ˈfaɪərpruf","star":1,"sense":[{"pos":"형","mean":"내화성의"}],"syn":["noncombustible, fire-resistant"]},{"day":42,"no":"19","word":"freelance","ipa":"ˈfrilæns","star":1,"sense":[{"pos":"형","mean":"회사에 소속되지 않은, 프리랜서의"}],"syn":["independent, self-employed"]},{"day":42,"no":"20","word":"hydroelectric","ipa":"ˌhaɪdroʊɪˈlektrɪk","star":1,"sense":[{"pos":"형","mean":"수력 발전의"}],"syn":["water-powered, hydropower"]},{"day":42,"no":"21","word":"iteration","ipa":"ˌɪtərˈeɪʃən","star":1,"sense":[{"pos":"명","mean":"반복, 반복 버전"}],"syn":["version, repetition, cycle"]},{"day":42,"no":"22","word":"just-in-time","ipa":"dʒʌst ɪn taɪm","star":1,"sense":[{"pos":"형","mean":"적시 공급의"}],"syn":["on-demand, timely"]},{"day":42,"no":"23","word":"laissez-faire","ipa":"ˈleɪzeɪ fer","star":1,"sense":[{"pos":"형","mean":"자유방임주의의"}],"syn":["free-market"]},{"day":42,"no":"24","word":"loyalty","ipa":"ˈlɔɪəlti","star":1,"sense":[{"pos":"명","mean":"충성도"}],"syn":["allegiance, devotion, faithfulness"]},{"day":42,"no":"25","word":"maximization","ipa":"ˌmæksɪmɪˈzeɪʃən","star":1,"sense":[{"pos":"명","mean":"극대화"}],"syn":["increase, enhancement"]},{"day":42,"no":"26","word":"nanomaterial","ipa":"ˈnɑnoʊməˈtɪriəl","star":1,"sense":[{"pos":"명","mean":"나노 소재"}],"syn":[]},{"day":42,"no":"27","word":"occupancy","ipa":"ˈɑkjəpənsi","star":1,"sense":[{"pos":"명","mean":"점유, 사용"}],"syn":["tenancy, occupation"]},{"day":42,"no":"28","word":"pipeline","ipa":"ˈpaɪplaɪn","star":1,"sense":[{"pos":"명","mean":"송유관·가스관, 배관"}],"syn":["conduit, duct, channel"]},{"day":42,"no":"29","word":"proximity","ipa":"prɑkˈsɪməti","star":1,"sense":[{"pos":"명","mean":"근접성, 가까이 있음"}],"syn":["closeness, nearness, adjacency"]},{"day":42,"no":"30","word":"redistribute","ipa":"ˌridɪsˈtrɪbjut","star":1,"sense":[{"pos":"동","mean":"재분배하다"}],"syn":["reallocate, spread"]},{"day":42,"no":"31","word":"retrieve","ipa":"rɪˈtriv","star":1,"sense":[{"pos":"동","mean":"검색하다, 가져오다"}],"syn":["access, recover, obtain"]},{"day":42,"no":"32","word":"risk-averse","ipa":"rɪsk əˈvərs","star":1,"sense":[{"pos":"형","mean":"위험 회피적인"}],"syn":["cautious, conservative"]},{"day":42,"no":"33","word":"stairwell","ipa":"ˈsterwel","star":1,"sense":[{"pos":"명","mean":"계단실"}],"syn":["staircase, stairway"]},{"day":42,"no":"34","word":"taxation","ipa":"tækˈseɪʃən","star":1,"sense":[{"pos":"명","mean":"과세"}],"syn":["taxes, levy"]},{"day":42,"no":"35","word":"ventilation","ipa":"ˌventəˈleɪʃən","star":1,"sense":[{"pos":"명","mean":"환기"}],"syn":["airflow, aeration, air circulation"]},{"day":42,"no":"36","word":"warehouse","ipa":"ˈwerhaʊs","star":1,"sense":[{"pos":"명","mean":"창고"}],"syn":["storehouse, depot, storage"]}]}]}</script>
<script>
(function(){
  "use strict";
  var KEY="novetoefl-voca-known", SET="novetoefl-voca-set";
  var DATA=null, book=1, day=1, mode={veil:false,hide:false,find:false}, query="";
  var known=load(KEY,{}), saved=load(SET,{});
  if(saved.book){book=saved.book} if(saved.day){day=saved.day}
  if(saved.veil){mode.veil=true} if(saved.hide){mode.hide=true}

  function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
  function kid(w){return w.day+":"+w.no}

  var $days=document.getElementById("days"), $main=document.getElementById("main"),
      $count=document.getElementById("count"), $q=document.getElementById("q"),
      $findWrap=document.getElementById("findWrap");

  // 데이터는 페이지 안에 박혀 오거나(배포본) 옆 파일에서 온다(작업본)
  var tag=document.getElementById("DATA"), raw=tag?tag.textContent.trim():"";
  (raw ? Promise.resolve(JSON.parse(raw))
       : fetch("data/voca.json").then(function(r){return r.json()})
  ).then(function(j){
    DATA=j.days; buildDays(); render();
  }).catch(function(){
    $main.innerHTML='<p class="empty">단어를 불러오지 못했습니다.<br>잠시 뒤 새로고침해 주세요.</p>';
  });

  function daysOf(b){return DATA.filter(function(d){return d.book===b})}

  function buildDays(){
    $days.innerHTML="";
    daysOf(book).forEach(function(d){
      var b=el("button",null,"DAY "+String(d.day).padStart(2,"0"));
      b.setAttribute("role","tab");
      b.setAttribute("aria-current", d.day===day ? "true":"false");
      if(doneCount(d)===d.words.length) b.classList.add("done");
      b.onclick=function(){day=d.day;persist();buildDays();render();window.scrollTo(0,0)};
      $days.appendChild(b);
    });
    var cur=$days.querySelector('[aria-current="true"]');
    if(cur) cur.scrollIntoView({block:"nearest",inline:"center"});
  }

  function doneCount(d){var c=0;d.words.forEach(function(w){if(known[kid(w)])c++});return c}
  function persist(){save(SET,{book:book,day:day,veil:mode.veil,hide:mode.hide})}

  function matches(w){
    var s=query.trim().toLowerCase(); if(!s) return true;
    if(w.word.toLowerCase().indexOf(s)>-1) return true;
    var hay=w.sense.map(function(x){return x.mean}).join(" ")+" "+w.syn.join(" ");
    return hay.toLowerCase().indexOf(s)>-1;
  }

  function render(){
    document.body.dataset.book=book;
    document.body.classList.toggle("veil",mode.veil);
    $main.innerHTML="";

    var list, title, sub;
    if(mode.find && query.trim()){
      list=[]; DATA.forEach(function(d){d.words.forEach(function(w){if(matches(w))list.push(w)})});
      title="찾기 결과"; sub=query.trim();
    }else{
      var d=DATA.filter(function(x){return x.day===day})[0];
      if(!d){d=daysOf(book)[0]; day=d.day}
      list=d.words; title=d.topic; sub="DAY "+String(d.day).padStart(2,"0");
      var done=doneCount(d);
      $count.textContent=done+" / "+d.words.length+" 외움";
      var h=el("div","head");
      var e=el("em",null,sub); h.appendChild(e);
      h.appendChild(el("h1",null,title));
      $main.appendChild(h);
      var pr=el("div","prog"), bar=el("i"); bar.style.width=(d.words.length?done/d.words.length*100:0)+"%";
      pr.appendChild(bar); $main.appendChild(pr);
    }

    if(mode.find && query.trim()){
      $count.textContent=list.length+"개";
      var h2=el("div","head");
      h2.appendChild(el("em",null,sub)); h2.appendChild(el("h1",null,title));
      $main.appendChild(h2);
    }

    var shown=0;
    list.forEach(function(w){
      if(mode.hide && known[kid(w)]) return;
      shown++; $main.appendChild(card(w));
    });

    if(!shown){
      $main.appendChild(el("p","empty",
        mode.find&&query.trim() ? "찾는 단어가 없습니다." : "이 DAY 의 단어를 모두 외웠습니다."));
    }
    if(!(mode.find && query.trim())){
      var nt=el("div","note");
      nt.appendChild(el("b",null,"책에서"));
      nt.appendChild(el("span",null,
        "예문과 해석, WORD FAMILY, 배경지식은 본책에 있습니다. 여기서 뜻을 훑고 책에서 문장으로 익히세요."));
      $main.appendChild(nt);
    }
    var f=el("p","foot","노베토플 4.5+ 단어장 · 표제어 1,608");
    $main.appendChild(f);
  }

  function card(w){
    var c=el("div","card"+(known[kid(w)]?" known":""));

    var r1=el("div","row1");
    r1.appendChild(el("span","n",w.no));
    var wd=el("div","wd");
    wd.appendChild(el("b",null,w.word));
    if(w.ipa) wd.appendChild(el("span","ipa","["+w.ipa+"]"));
    r1.appendChild(wd);
    if(w.star) r1.appendChild(el("span","star",new Array(w.star+1).join("★")));
    var tk=el("button","tick","✓");
    tk.setAttribute("aria-pressed", known[kid(w)]?"true":"false");
    tk.setAttribute("aria-label", w.word+" 외움 표시");
    tk.onclick=function(ev){
      ev.stopPropagation();
      if(known[kid(w)]) delete known[kid(w)]; else known[kid(w)]=1;
      save(KEY,known); buildDays(); render();
    };
    r1.appendChild(tk);
    c.appendChild(r1);

    var sw=el("div","sense");
    w.sense.forEach(function(s,i){
      var p=el("p");
      p.appendChild(el("span","pos",s.pos));
      var m=el("span","mean",s.mean);
      if(i===0 && w.syn.length){
        var sy=el("span","syn","= "+w.syn[0]);
        var box=el("span"); box.style.minWidth="0";
        box.appendChild(m); box.appendChild(sy); p.appendChild(box);
      }else{ p.appendChild(m) }
      sw.appendChild(p);
    });
    c.appendChild(sw);

    c.onclick=function(){ if(mode.veil) c.classList.toggle("open") };
    return c;
  }

  document.getElementById("bk1").onclick=function(){pick(1)};
  document.getElementById("bk2").onclick=function(){pick(2)};
  function pick(b){
    if(book===b) return;
    book=b; day=daysOf(b)[0].day;
    document.getElementById("bk1").setAttribute("aria-selected", b===1?"true":"false");
    document.getElementById("bk2").setAttribute("aria-selected", b===2?"true":"false");
    persist(); buildDays(); render(); window.scrollTo(0,0);
  }

  function tool(id,key,after){
    var b=document.getElementById(id);
    b.setAttribute("aria-pressed", mode[key]?"true":"false");
    b.onclick=function(){
      mode[key]=!mode[key];
      b.setAttribute("aria-pressed", mode[key]?"true":"false");
      persist(); if(after)after(); render();
    };
  }
  tool("tVeil","veil");
  tool("tHide","hide");
  tool("tFind","find",function(){
    $findWrap.hidden=!mode.find;
    if(mode.find){$q.focus()}else{query="";$q.value=""}
  });
  $q.addEventListener("input",function(){query=$q.value;render()});

  document.getElementById("bk1").setAttribute("aria-selected", book===1?"true":"false");
  document.getElementById("bk2").setAttribute("aria-selected", book===2?"true":"false");
  document.body.dataset.book=book;
  document.body.classList.toggle("veil",mode.veil);
})();
</script>
