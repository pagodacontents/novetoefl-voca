<title>노베토플 실전 표현 훈련</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans:wght@400&display=swap">
<style>
/* 레이아웃 — 고정 머리(책 · DAY · 도구) 아래로 표현 카드가 한 장씩 흐른다.
   DAY 42 뒤에 「권말」 칸을 하나 더 두어 221개 표현을 같은 꼴로 담는다. */
:root{
  --s1:#D1522B; --s1-fill:#FF8D6D; --s1-tint:#FFF1EB;
  --s2:#004871; --s2-fill:#003A5D; --s2-tint:#E8F0F6;
  --bg:#FDFAF8; --surf:#FFFFFF; --fg:#1B1512; --mut:#7C6C64;
  --faint:#A99A93; --line:#EDE2DC; --veil:#E6DAD4;
  --spot:var(--s1); --spot-fill:var(--s1-fill); --spot-tint:var(--s1-tint);
  --f-word:"Lora",Georgia,"Times New Roman",serif;
  --f-ui:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-ipa:"Noto Sans","Segoe UI",system-ui,sans-serif;
  --r:12px;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
body[data-book="2"]{ --spot:var(--s2); --spot-fill:var(--s2-fill); --spot-tint:var(--s2-tint) }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --s1:#FFA98E; --s1-fill:#FF8D6D; --s1-tint:#2C1C16;
  --s2:#86C2E6; --s2-fill:#5AA7D4; --s2-tint:#122531;
  --bg:#141110; --surf:#1D1917; --fg:#F3ECE8; --mut:#A6968E;
  --faint:#7E6F68; --line:#2F2825; --veil:#3A3130; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --s1:#FFA98E; --s1-fill:#FF8D6D; --s1-tint:#2C1C16;
  --s2:#86C2E6; --s2-fill:#5AA7D4; --s2-tint:#122531;
  --bg:#141110; --surf:#1D1917; --fg:#F3ECE8; --mut:#A6968E;
  --faint:#7E6F68; --line:#2F2825; --veil:#3A3130; color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--spot-fill)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--spot-fill);color:#fff}
.top-in{padding-left:var(--gut);padding-right:var(--gut-r);padding-block:10px;display:flex;flex-direction:column;gap:9px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-size:15px;font-weight:700}
.brand span{font-size:11.5px;opacity:.8;font-family:var(--f-ipa);letter-spacing:.06em;text-transform:uppercase}
.books{display:flex;gap:6px}
.books button{flex:1;min-width:0;border:0;border-radius:999px;cursor:pointer;font-family:var(--f-ui);font-size:12.5px;font-weight:500;padding:7px 4px;background:rgba(255,255,255,.22);color:#fff}
.books button[aria-selected="true"]{background:#fff;color:var(--spot);font-weight:700}
.days{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 auto;border:0;border-radius:8px;cursor:pointer;font-family:var(--f-ipa);font-size:12px;padding:6px 9px;background:rgba(255,255,255,.18);color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.days button[aria-current="true"]{background:#fff;color:var(--spot);font-weight:700}

.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{padding-left:var(--gut);padding-right:var(--gut-r);padding-block:8px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:var(--surf);color:var(--mut);border-radius:999px;padding:5px 11px;font-family:var(--f-ui);font-size:12px;cursor:pointer}
.tool[aria-pressed="true"]{background:var(--spot-tint);border-color:var(--spot);color:var(--spot);font-weight:500}
.tool:focus-visible,.books button:focus-visible,.days button:focus-visible,.find input:focus-visible{outline:2px solid var(--spot);outline-offset:2px}
.count{margin-left:auto;font-family:var(--f-ipa);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.find{padding-left:var(--gut);padding-right:var(--gut-r);padding-block:0 8px}
.find input{width:100%;border:1px solid var(--line);background:var(--surf);color:var(--fg);border-radius:9px;padding:8px 11px;font-family:var(--f-ui);font-size:14px}
.find input::placeholder{color:var(--faint)}

main{padding-left:var(--gut);padding-right:var(--gut-r);padding-block:12px 40px;display:flex;flex-direction:column;gap:10px}
.head{display:flex;flex-direction:column;gap:1px;margin-bottom:2px}
.head em{font-style:normal;font-family:var(--f-ipa);font-size:11.5px;letter-spacing:.08em;color:var(--spot);text-transform:uppercase}
.head h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}

.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px 13px;display:flex;flex-direction:column;gap:8px}
.card.known{opacity:.52}
.row1{display:flex;align-items:flex-start;gap:9px}
.ph{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:7px}
.ph b{font-family:var(--f-word);font-size:18px;font-weight:600;color:var(--spot);letter-spacing:-.01em;word-break:break-word}
.pos{background:var(--spot-tint);color:var(--spot);border-radius:5px;font-size:10.5px;font-weight:700;padding:2px 6px;white-space:nowrap}
.tick{flex:0 0 auto;width:26px;height:26px;border-radius:7px;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:transparent;font-size:14px;line-height:1;display:grid;place-items:center;margin-top:2px}
.tick[aria-pressed="true"]{border-color:var(--spot);background:var(--spot);color:#fff}
.ko{font-size:14.5px;font-weight:500}
.ex{border-left:2px solid var(--line);padding-left:10px;display:flex;flex-direction:column;gap:3px}
.ex .en{margin:0;font-family:var(--f-word);font-size:14.5px;line-height:1.52}
.ex .en strong{color:var(--spot);font-weight:600}
.ex .kr{margin:0;font-size:12.5px;color:var(--mut)}

/* 가리기 — 뜻을 가리거나(표현→뜻) 표현을 가린다(뜻→표현) */
body.veil-ko .ko,body.veil-ko .ex .kr{background:var(--veil);color:transparent;border-radius:4px;box-shadow:0 0 0 2px var(--veil);cursor:pointer}
body.veil-en .ph b,body.veil-en .ex .en{background:var(--veil);color:transparent;border-radius:4px;box-shadow:0 0 0 2px var(--veil);cursor:pointer}
body.veil-en .ex .en strong{color:transparent}
.card.open .ko,.card.open .ex .kr,.card.open .ph b,.card.open .ex .en{background:transparent!important;box-shadow:none!important;cursor:auto}
.card.open .ko{color:var(--fg)}
.card.open .ex .kr{color:var(--mut)}
.card.open .ph b{color:var(--spot)}
.card.open .ex .en{color:var(--fg)}
.card.open .ex .en strong{color:var(--spot)}

.empty{text-align:center;color:var(--faint);font-size:13.5px;padding:48px 0;line-height:1.8}
.foot{color:var(--faint);font-size:11.5px;text-align:center;padding-top:14px;border-top:1px solid var(--line);margin-top:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>실전 표현 훈련</b><span>Phrases</span></div>
    <div class="books" role="tablist" aria-label="권">
      <button role="tab" id="bk1" aria-selected="true">실용 · DAY 01–21</button>
      <button role="tab" id="bk2" aria-selected="false">학술 · DAY 22–42</button>
      <button role="tab" id="bk3" aria-selected="false">권말 221</button>
    </div>
    <div class="days" id="days" role="tablist" aria-label="DAY"></div>
  </div>
</header>

<div class="bar">
  <div class="bar-in">
    <button class="tool" id="tKo" aria-pressed="false">뜻 가리기</button>
    <button class="tool" id="tEn" aria-pressed="false">표현 가리기</button>
    <button class="tool" id="tHide" aria-pressed="false">외운 것 접기</button>
    <button class="tool" id="tFind" aria-pressed="false">찾기</button>
    <span class="count" id="count"></span>
  </div>
  <div class="find" id="findWrap" hidden>
    <input id="q" type="search" placeholder="표현이나 우리말 뜻으로 찾기" autocomplete="off">
  </div>
</div>

r","pos":"전구","ko":"~을 계속 찾다, 눈여겨보다","ex":"I'm on the lookout for a cheap used bike.","kr":"나는 저렴한 중고 자전거를 계속 찾고 있다."},{"en":"prior to","pos":"전구","ko":"~보다 먼저, ~ 이전에","ex":"Please arrive thirty minutes prior to the scheduled interview.","kr":"예정된 면접 30분 전에 도착해 주기 바란다."},{"en":"rain or shine","pos":"관용","ko":"비가 오든 안 오든, 무슨 일이 있어도","ex":"The festival happens every year, rain or shine.","kr":"그 축제는 비가 오든 안 오든 매년 열린다."},{"en":"require assistance","pos":"동구","ko":"도움을 필요로 하다","ex":"Passengers who require assistance should contact a staff member.","kr":"도움이 필요한 승객은 직원에게 연락하면 된다."},{"en":"run out of","pos":"동구","ko":"다 떨어지다, 동나다","ex":"We're about to run out of printer paper again.","kr":"프린터 용지가 또 다 떨어지려 한다."},{"en":"skill level","pos":"명구","ko":"실력 수준","ex":"The class is grouped by each student's skill level.","kr":"그 수업은 학생들의 실력 수준에 따라 나뉜다."},{"en":"speed up","pos":"동구","ko":"속도를 높이다, 빠르게 하다","ex":"Using shortcuts can speed up your daily workflow considerably.","kr":"단축키를 사용하면 일상 업무 흐름을 상당히 빠르게 할 수 있다."},{"en":"spread out","pos":"동구","ko":"넓게 퍼지다","ex":"The campus buildings are spread out across a wide green hill.","kr":"캠퍼스 건물들이 넓은 푸른 언덕에 퍼져 있다."}]},{"day":21,"topic":"생활 실무 — 식당·건강·돈","book":1,"items":[{"en":"starting at","pos":"전구","ko":"~부터 시작하여","ex":"Tickets are available starting at twenty dollars each.","kr":"표는 한 장에 20달러부터 구매할 수 있다."},{"en":"stick with","pos":"동구","ko":"계속 유지하다","ex":"If you stick with practice, you'll improve quickly.","kr":"연습을 꾸준히 계속하면 빠르게 실력이 늘 것이다."},{"en":"stop by","pos":"동구","ko":"잠깐 들르다","ex":"Could you stop by the office on your way home tonight?","kr":"오늘 밤 집에 가는 길에 사무실에 잠깐 들러 줄 수 있나요?"},{"en":"make a note","pos":"동구","ko":"메모하다, 적어두다","ex":"Make a note of the deadline so you don't forget.","kr":"잊지 않게 마감일을 적어 두세요."},{"en":"swing by","pos":"동구","ko":"잠깐 들르다","ex":"I'll swing by your dorm after class to grab it.","kr":"수업 끝나고 네 기숙사에 잠깐 들러서 가져가겠다."},{"en":"take a break","pos":"동구","ko":"잠깐 쉬다","ex":"Let's take a break and grab some coffee.","kr":"잠깐 쉬면서 커피 한잔해요."},{"en":"take care of","pos":"동구","ko":"처리하다, 돌보다","ex":"Don't worry, I'll take care of the registration forms.","kr":"걱정 말라, 등록 서류는 내가 처리하겠다."},{"en":"the day after tomorrow","pos":"명구","ko":"모레, 내일의 다음 날","ex":"The project is due the day after tomorrow.","kr":"그 프로젝트는 모레가 마감이다."},{"en":"time slot","pos":"명구","ko":"시간대, 배정된 시간","ex":"Only one time slot is left for the afternoon consultation.","kr":"오후 상담은 시간대가 딱 하나 남았다."},{"en":"until further notice","pos":"전구","ko":"추후 공지가 있을 때까지","ex":"The pool is closed until further notice.","kr":"수영장은 추후 공지가 있을 때까지 폐쇄된다."},{"en":"up to speed","pos":"관용","ko":"최신 내용을 잘 파악한 상태","ex":"Read the summary to get up to speed quickly.","kr":"요약본을 읽으면 최신 내용을 빠르게 파악할 수 있다."},{"en":"well organized","pos":"형구","ko":"잘 정돈된, 체계적인","ex":"Her notes were well organized and easy to follow.","kr":"그녀의 필기는 잘 정리되어 있어서 따라가기 쉬웠다."},{"en":"worth a shot","pos":"형구","ko":"한번 해볼 만한","ex":"The deadline is tight, but applying is still worth a shot.","kr":"마감이 빡빡하지만 그래도 지원해볼 만하다."},{"en":"take note","pos":"동구","ko":"주의 깊게 알아두다","ex":"Take note of the deadline written on the board.","kr":"칠판에 적힌 마감일을 잘 알아 두세요."}]},{"day":22,"topic":"사회·심리","book":2,"items":[{"en":"bystander effect","pos":"명구","ko":"방관자 효과(주위에 사람이 많을수록 돕지 않게 되는 현상)","ex":"The bystander effect explains why crowds often fail to help.","kr":"방관자 효과는 군중이 흔히 돕지 못하는 이유를 설명한다."},{"en":"bonding social capital","pos":"명구","ko":"결속형 사회 자본(가까운 사람끼리를 묶는 관계망)","ex":"Tight family ties are a classic example of bonding social capital.","kr":"끈끈한 가족 유대는 결속형 사회 자본의 전형적인 예다."},{"en":"cultural relativism","pos":"명구","ko":"문화 상대주의(각 문화를 그 자체의 기준으로 이해하는 관점)","ex":"Cultural relativism encourages scholars to judge each society by its own standards.","kr":"문화 상대주의는 학자들이 각 사회를 그 사회 자체의 기준으로 판단하도록 권장한다."}]},{"day":23,"topic":"사회·심리","book":2,"items":[{"en":"food security","pos":"명구","ko":"식량 안보","ex":"Local farming projects can strengthen food security in growing cities.","kr":"지역 농업 사업은 성장하는 도시의 식량 안보를 강화할 수 있다."},{"en":"consolidation of memory","pos":"명구","ko":"기억 강화(새 기억이 장기 기억으로 굳어지는 과정)","ex":"Deep sleep supports the consolidation of memory after a long day.","kr":"깊은 잠은 긴 하루 뒤 기억의 강화를 돕는다."},{"en":"free will","pos":"명구","ko":"자유 의지","ex":"Philosophers have long debated whether humans truly possess free will.","kr":"철학자들은 인간이 정말로 자유 의지를 지니는지를 오랫동안 논쟁해 왔다."},{"en":"creative class","pos":"명구","ko":"창조 계급(창의적 직업 종사자들이 이루는 사회 계층)","ex":"Cities often compete to attract the creative class of designers and engineers.","kr":"도시들은 디자이너와 엔지니어 같은 창조 계급을 끌어들이려고 자주 경쟁한다."},{"en":"constitutional law","pos":"명구","ko":"헌법학, 헌법","ex":"She specializes in constitutional law and frequently argues before the high court.","kr":"그녀는 헌법을 전문으로 다루며 대법원에서 자주 변론한다."},{"en":"growth mindset","pos":"명구","ko":"성장형 사고방식(능력은 노력으로 자란다고 믿는 태도)","ex":"Students with a growth mindset see failure as a chance to learn.","kr":"성장 마인드셋을 가진 학생들은 실패를 배움의 기회로 본다."},{"en":"inattentional blindness","pos":"명구","ko":"무주의 맹시(주의를 두지 않은 것을 알아차리지 못하는 현상)","ex":"Inattentional blindness explains why focused drivers miss obvious hazards.","kr":"무주의 맹시는 집중한 운전자가 명백한 위험을 놓치는 이유를 설명한다."},{"en":"cultural appropriation","pos":"명구","ko":"문화 전유(다른 문화의 요소를 맥락 없이 가져다 쓰는 일)","ex":"Debates about cultural appropriation often arise in the fashion industry.","kr":"문화적 전유에 대한 논쟁은 패션 업계에서 자주 일어난다."},{"en":"cultural sensitivity","pos":"명구","ko":"문화적 감수성","ex":"Cultural sensitivity is essential when conducting research in indigenous communities.","kr":"토착 공동체에서 연구를 진행할 때 문화적 감수성은 필수다."},{"en":"language acquisition","pos":"명구","ko":"언어 습득","ex":"Children show remarkable speed in early language acquisition.","kr":"아이들은 초기 언어 습득에서 놀라운 속도를 보인다."},{"en":"cultural identity","pos":"명구","ko":"문화적 정체성","ex":"Language is often central to a community's sense of cultural identity.","kr":"언어는 흔히 한 공동체의 문화적 정체성에서 핵심이 된다."}]},{"day":24,"topic":"사회·심리","book":2,"items":[{"en":"pluralistic ignorance","pos":"명구","ko":"다원적 무지(속으로는 반대하면서 남들은 찬성한다고 믿는 상태)","ex":"Pluralistic ignorance can keep an unpopular norm alive for years.","kr":"다원적 무지는 인기 없는 규범을 수년간 유지시킬 수 있다."},{"en":"decision fatigue","pos":"명구","ko":"결정 피로(잦은 선택으로 인한 정신적 소진)","ex":"Shopping all day can lead to decision fatigue by the evening.","kr":"하루 종일 쇼핑하면 저녁 무렵 결정 피로로 이어질 수 있다."},{"en":"digital divide","pos":"명구","ko":"정보 격차(기술·인터넷 접근성 차이로 생기는 격차)","ex":"The digital divide leaves rural students with far fewer online resources.","kr":"정보 격차 탓에 시골 학생들은 온라인 자원을 훨씬 적게 이용한다."},{"en":"densely populated","pos":"형구","ko":"인구가 밀집된","ex":"The river valley became densely populated within a few centuries.","kr":"그 강 유역은 몇 세기 만에 인구가 빽빽하게 들어찼다."},{"en":"echo chamber","pos":"명구","ko":"반향실 (같은 의견만 반복되는 폐쇄적 환경)","ex":"Social media can create an echo chamber that reinforces existing beliefs.","kr":"소셜 미디어는 기존 신념을 강화하는 반향실을 만들 수 있다."},{"en":"social capital","pos":"명구","ko":"사회적 자본 (인맥·관계망에서 나오는 자원)","ex":"Strong community ties build the social capital that supports each member.","kr":"강한 공동체 유대는 각 구성원을 지지하는 사회적 자본을 쌓아준다."},{"en":"facial expression","pos":"명구","ko":"표정","ex":"The portrait captured a subtle facial expression of quiet sadness.","kr":"그 초상화는 조용한 슬픔이 담긴 미묘한 표정을 포착했다."},{"en":"food desert","pos":"명구","ko":"식품 사막(신선식품을 구하기 어려운 지역)","ex":"Many low-income neighborhoods are food deserts with few grocery stores.","kr":"많은 저소득 동네는 식료품점이 거의 없는 식품 사막이다."},{"en":"soft power","pos":"명구","ko":"소프트 파워(매력과 문화로 상대를 움직이는 힘)","ex":"A nation's films and music can become powerful tools of soft power.","kr":"한 나라의 영화와 음악은 강력한 소프트 파워의 도구가 될 수 있다."}]},{"day":25,"topic":"학술 빈출 형용사","book":2,"items":[{"en":"fixed mindset","pos":"명구","ko":"고정형 사고방식(능력은 타고나 바뀌지 않는다고 믿는 태도)","ex":"A fixed mindset can make people avoid difficult challenges.","kr":"고정적인 사고방식은 사람들이 어려운 도전을 피하게 만들 수 있다."},{"en":"moral relativism","pos":"명구","ko":"도덕 상대주의(도덕 기준은 문화마다 다르다고 보는 관점)","ex":"Moral relativism holds that ethical standards vary from one culture to another.","kr":"도덕 상대주의는 윤리 기준이 문화마다 다르다고 본다."},{"en":"marginalized community","pos":"명구","ko":"소외된 공동체","ex":"The mural gave a voice to a long-marginalized community.","kr":"그 벽화는 오랫동안 소외된 공동체에 목소리를 주었다."},{"en":"public sphere","pos":"명구","ko":"공론장(시민이 공적인 문제를 자유롭게 논의하는 장)","ex":"Coffeehouses once served as an important public sphere for political debate.","kr":"커피하우스는 한때 정치 토론을 위한 중요한 공론장으로 기능했다."},{"en":"melting pot","pos":"관용","ko":"문화의 용광로(여러 문화가 섞여 하나로 동화되는 사회)","ex":"The neighborhood is a melting pot of languages, foods, and traditions.","kr":"그 동네는 언어와 음식, 전통이 뒤섞인 문화의 용광로이다."},{"en":"role conflict","pos":"명구","ko":"역할 갈등","ex":"Working parents often experience role conflict between career and family duties.","kr":"일하는 부모는 흔히 직장과 가정의 책임 사이에서 역할 갈등을 겪는다."},{"en":"mutual aid","pos":"명구","ko":"상호 부조","ex":"During the flood, neighbors organized mutual aid to share food and shelter.","kr":"홍수 동안 이웃들은 음식과 거처를 나누려고 상호 부조를 조직했다."},{"en":"selective attention","pos":"명구","ko":"중요한 것만 골라 집중하는 주의","ex":"Selective attention lets us focus on one voice in a noisy room.","kr":"선택적 주의는 시끄러운 방에서 한 목소리에 집중하게 해준다."},{"en":"skill acquisition","pos":"명구","ko":"기술 습득","ex":"Simulations can accelerate skill acquisition in medical training programs.","kr":"시뮬레이션은 의료 훈련 프로그램에서 기술 습득을 가속화할 수 있다."},{"en":"mutual support","pos":"명구","ko":"상호 지원","ex":"Early communities relied on mutual support to survive harsh winters.","kr":"초기 공동체는 혹독한 겨울을 견디려고 상호 지원에 의존했다."}]},{"day":26,"topic":"학술 빈출 형용사","book":2,"items":[{"en":"social influence","pos":"명구","ko":"주변 사람이 행동에 미치는 영향","ex":"Social influence can powerfully shape how teenagers make decisions.","kr":"사회적 영향은 십대가 결정을 내리는 방식을 강력하게 형성할 수 있다."},{"en":"social interaction","pos":"명구","ko":"사회적 상호작용","ex":"Public plazas encourage spontaneous social interaction among residents.","kr":"공공 광장은 주민들 사이의 자연스러운 사회적 상호작용을 촉진한다."},{"en":"social psychological","pos":"형구","ko":"사회 심리와 관련된","ex":"Researchers studied the social psychological causes of the behavior.","kr":"연구자들은 그 행동의 사회 심리적 원인을 연구했다."},{"en":"rite of passage","pos":"명구","ko":"통과의례(출생·성인·결혼처럼 삶의 단계를 넘는 의식)","ex":"In some cultures, a long journey marks a young person's rite of passage.","kr":"어떤 문화에서는 긴 여정이 젊은이의 통과의례를 나타낸다."},{"en":"rule of law","pos":"명구","ko":"법치주의","ex":"The rule of law ensures that even leaders remain accountable to courts.","kr":"법치주의는 지도자조차 법원에 책임을 지도록 보장한다."},{"en":"the human condition","pos":"명구","ko":"인간 존재가 처한 근본적 상황","ex":"Great literature often reflects on the human condition and its struggles.","kr":"위대한 문학은 흔히 인간 존재의 조건과 그 고난을 성찰한다."},{"en":"sensory input","pos":"명구","ko":"감각으로 들어오는 자극","ex":"The brain constantly filters sensory input from our surroundings.","kr":"뇌는 주변 환경에서 들어오는 감각 자극을 끊임없이 걸러낸다."}]},{"day":27,"topic":"생명·의학","book":2,"items":[{"en":"tribal affiliation","pos":"명구","ko":"부족 소속","ex":"The pattern on the cloth signals the wearer's tribal affiliation.","kr":"천에 새겨진 무늬는 착용자의 부족 소속을 나타낸다."},{"en":"breeding season","pos":"명구","ko":"번식기","ex":"During the breeding season, the birds migrate to warmer coasts.","kr":"번식기 동안 그 새들은 더 따뜻한 해안으로 이동한다."},{"en":"acoustic data","pos":"명구","ko":"음향 데이터","ex":"Scientists analyzed the acoustic data to track migrating dolphins.","kr":"과학자들은 이동하는 돌고래를 추적하려고 음향 데이터를 분석했다."},{"en":"coral reef","pos":"명구","ko":"산호초","ex":"A healthy coral reef supports thousands of different ocean species.","kr":"건강한 산호초는 수천 종의 다양한 해양 생물을 부양한다."},{"en":"acoustic signal","pos":"명구","ko":"음향 신호","ex":"Whales use acoustic signals to communicate across vast distances.","kr":"고래는 먼 거리를 가로질러 의사소통하려고 음향 신호를 쓴다."},{"en":"genetically modified","pos":"형구","ko":"유전적으로 변형된","ex":"Many countries debate the safety of genetically modified crops.","kr":"많은 나라가 유전자 변형 작물의 안전성을 두고 논쟁한다."},{"en":"antifreeze protein","pos":"명구","ko":"부동 단백질(체액이 어는 것을 막아 주는 단백질)","ex":"Certain fish produce antifreeze protein to survive in icy waters.","kr":"어떤 물고기는 얼음물에서 살아남으려고 부동 단백질을 만든다."},{"en":"mental fatigue","pos":"명구","ko":"정신적 피로","ex":"Long study sessions without breaks often cause mental fatigue.","kr":"쉬지 않고 오래 공부하면 흔히 정신적 피로가 온다."},{"en":"binding affinity","pos":"명구","ko":"결합 친화도(분자들이 서로 달라붙는 세기)","ex":"The drug's binding affinity determines how tightly it can attach to receptors.","kr":"그 약물의 결합 친화도는 수용체에 얼마나 단단히 붙을 수 있는지를 결정한다."},{"en":"placebo effect","pos":"명구","ko":"위약 효과(가짜 약이 믿음만으로 효과를 내는 현상)","ex":"The placebo effect can improve symptoms even without real medicine.","kr":"위약 효과는 진짜 약이 없어도 증상을 나아지게 할 수 있다."},{"en":"breeding ground","pos":"명구","ko":"번식지","ex":"The marshland serves as an important breeding ground for migratory birds.","kr":"그 습지는 철새들에게 중요한 번식지 역할을 한다."},{"en":"seed dispersal","pos":"명구","ko":"종자 산포(씨앗이 멀리 퍼져 나가는 일)","ex":"Birds play a vital role in the seed dispersal of many trees.","kr":"새들은 많은 나무의 종자 산포에서 중요한 역할을 한다."}]},{"day":28,"topic":"생명·의학","book":2,"items":[{"en":"circadian rhythm","pos":"명구","ko":"일주기 리듬(약 24시간 주기의 생체 주기)","ex":"Exposure to bright light at night can disrupt the body's natural circadian rhythm.","kr":"밤에 밝은 빛에 노출되는 것은 몸의 자연스러운 생체 리듬을 교란시킨다."},{"en":"drug delivery system","pos":"명구","ko":"약물 전달 시스템","ex":"Researchers designed a new drug delivery system that releases medicine slowly.","kr":"연구자들은 약을 천천히 방출하는 새로운 약물 전달 시스템을 설계했다."},{"en":"environmental cue","pos":"명구","ko":"환경적 신호","ex":"Shorter daylight serves as an environmental cue that triggers migration in birds.","kr":"짧아진 낮 시간은 새의 이동을 촉발하는 환경 신호 역할을 한다."},{"en":"genetic mutation","pos":"명구","ko":"유전적 돌연변이","ex":"A single genetic mutation can make an organism resistant to a common drug.","kr":"단 하나의 유전적 돌연변이가 생물을 흔한 약물에 저항하게 만들 수 있다."},{"en":"larval stage","pos":"명구","ko":"애벌레 단계","ex":"During the larval stage, the insect grows rapidly.","kr":"애벌레 단계 동안 그 곤충은 빠르게 성장한다."}]},{"day":29,"topic":"생명·의학","book":2,"items":[{"en":"microbial activity","pos":"명구","ko":"미생물 활동","ex":"Warmer soil increases microbial activity that releases trapped carbon.","kr":"더 따뜻한 토양은 갇혀 있던 탄소를 방출하는 미생물 활동을 늘린다."},{"en":"nerve impulse","pos":"명구","ko":"신경 자극, 신경 신호","ex":"A nerve impulse travels rapidly along the axon to the next neuron.","kr":"신경 자극은 축삭을 따라 다음 뉴런으로 빠르게 전달된다."},{"en":"neural connection","pos":"명구","ko":"신경 연결","ex":"Learning a new skill strengthens the neural connection between brain cells.","kr":"새 기술을 배우면 뇌세포 사이의 신경 연결이 강화된다."},{"en":"neural pathway","pos":"명구","ko":"신경 경로","ex":"Repeated practice strengthens the neural pathway responsible for the skill.","kr":"반복된 연습은 그 기술을 담당하는 신경 경로를 강화한다."},{"en":"reward system","pos":"명구","ko":"뇌의 보상 체계","ex":"The brain's reward system releases chemicals that make us feel good.","kr":"뇌의 보상 체계는 우리를 기분 좋게 하는 화학 물질을 분비한다."},{"en":"sea urchin","pos":"명구","ko":"성게","ex":"The sea urchin grazed on kelp along the rocky reef.","kr":"성게는 바위 암초를 따라 다시마를 뜯어 먹었다."},{"en":"sensory impairment","pos":"명구","ko":"감각 장애","ex":"Pollution can cause sensory impairment in fish that rely on smell.","kr":"오염은 후각에 의존하는 물고기에게 감각 장애를 일으킬 수 있다."},{"en":"sleep deprivation","pos":"명구","ko":"수면 부족","ex":"Long-term sleep deprivation impairs both memory and concentration.","kr":"장기적인 수면 부족은 기억력과 집중력을 모두 손상시킨다."}]},{"day":30,"topic":"학술 빈출 동사·명사 ①","book":2,"items":[{"en":"kinetic art","pos":"명구","ko":"키네틱 아트(움직임을 작품의 요소로 쓰는 미술)","ex":"Kinetic art relies on motion, often powered by air currents or small motors.","kr":"키네틱 아트는 움직임에 의존하는데, 흔히 공기 흐름이나 작은 모터로 작동된다."},{"en":"anthology series","pos":"명구","ko":"앤솔러지 시리즈(매회 독립된 이야기로 구성된 시리즈)","ex":"Each season of the anthology series tells a completely new and separate story.","kr":"그 앤솔러지 시리즈는 매 시즌마다 완전히 새롭고 독립적인 이야기를 들려준다."},{"en":"cultural development","pos":"명구","ko":"문화 발전","ex":"Trade routes accelerated the cultural development of cities along their paths.","kr":"교역로는 그 경로를 따라 있는 도시들의 문화 발전을 가속화했다."},{"en":"outsider art","pos":"명구","ko":"이방인 예술(정규 미술 교육·제도권 밖에서 만들어진 예술)","ex":"Outsider art is created by people with no formal training.","kr":"이방인 예술은 정규 교육을 받지 않은 사람들에 의해 창조된다."},{"en":"call to adventure","pos":"명구","ko":"모험으로 이끄는 부름","ex": stice to","pos":"관용","ko":"제대로 표현하다","ex":"No photo can do justice to this sunset.","kr":"어떤 사진도 이 노을을 제대로 담아내지 못한다."},{"en":"dress in layers","pos":"동구","ko":"여러 겹 껴입다","ex":"It is best to dress in layers when hiking in the mountains.","kr":"산에서 등산할 때는 여러 겹 껴입는 것이 가장 좋다."},{"en":"ease the pressure","pos":"동구","ko":"압박을 덜어주다, 부담을 완화하다","ex":"Hiring more staff helped ease the pressure on the team.","kr":"직원을 더 뽑은 덕분에 팀의 부담을 덜 수 있었다."},{"en":"emergency alert","pos":"명구","ko":"비상 경보","ex":"The campus sent an emergency alert about the storm.","kr":"캠퍼스가 폭풍에 관한 비상 경보를 보냈다."},{"en":"energy independence","pos":"명구","ko":"에너지 자립","ex":"Many nations pursue energy independence to reduce reliance on imports.","kr":"많은 국가가 수입 의존을 줄이려고 에너지 자립을 추구한다."},{"en":"error message","pos":"명구","ko":"오류 메시지","ex":"An error message popped up during installation.","kr":"설치 중에 오류 메시지가 떴다."},{"en":"experience level","pos":"명구","ko":"숙련도","ex":"Please choose a course that matches your experience level.","kr":"자신의 숙련도에 맞는 강좌를 선택해 주기 바란다."},{"en":"get a feel for","pos":"동구","ko":"분위기를 파악하다, 감을 잡다","ex":"Try a trial lesson to get a feel for the class.","kr":"그 수업의 감을 잡으려면 체험 수업을 들으세요."},{"en":"get a head start","pos":"관용","ko":"유리한 출발을 하다, 선제적으로 시작하다","ex":"Reviewing now lets you get a head start on the exam.","kr":"지금 복습하면 시험을 남보다 미리 준비할 수 있다."},{"en":"get soaked","pos":"동구","ko":"흠뻑 젖다","ex":"We got soaked walking home in the storm.","kr":"우리는 폭풍 속에서 집에 걸어오다 흠뻑 젖었다."},{"en":"go about","pos":"동구","ko":"착수하다","ex":"I'm not sure how to go about starting this project.","kr":"이 프로젝트를 어떻게 착수해야 할지 잘 모르겠다."},{"en":"go for it","pos":"관용","ko":"도전하다, 한번 해보다","ex":"If you really want that internship, just go for it.","kr":"그 인턴십을 정말 원한다면 한번 도전하세요."},{"en":"go into effect","pos":"동구","ko":"효력이 발생하다","ex":"The new parking rules go into effect next Monday.","kr":"새 주차 규정이 다음 주 월요일부터 효력이 발생한다."},{"en":"have an impact","pos":"동구","ko":"영향을 미치다","ex":"Volunteering can have an impact on your whole community.","kr":"봉사 활동은 지역 사회 전체에 영향을 미칠 수 있다."},{"en":"hazard a guess","pos":"동구","ko":"추측해보다","ex":"If I had to hazard a guess, I'd say she left early.","kr":"굳이 추측을 해보자면, 그녀가 일찍 떠난 것 같다."},{"en":"hold down","pos":"동구","ko":"(버튼을) 누르고 있다","ex":"Hold down the power button to restart the device.","kr":"기기를 재시작하려면 전원 버튼을 누르고 있으면 된다."},{"en":"hold off","pos":"동구","ko":"미루다, 보류하다","ex":"Let's hold off on the decision until we have more data.","kr":"자료가 더 모일 때까지 결정을 미뤄요."},{"en":"hold one's breath","pos":"관용","ko":"기대하며 기다리다 (보통 부정형으로 씀)","ex":"Don't hold your breath waiting for the bus to arrive.","kr":"버스가 오기를 너무 기대하며 기다리지는 마세요."},{"en":"hop on","pos":"동구","ko":"접속하다, 참여하다","ex":"Let's hop on a video call to discuss the details.","kr":"세부 사항을 의논하게 화상 통화에 접속해 봐요."},{"en":"if all else fails","pos":"관용","ko":"다른 방법이 다 통하지 않을 때","ex":"If all else fails, we can just restart the computer.","kr":"다른 방법이 다 안 되면 그냥 컴퓨터를 재시작하면 된다."},{"en":"in bad shape","pos":"형구","ko":"상태가 좋지 않은","ex":"The old bicycle was in bad shape after years of neglect.","kr":"그 낡은 자전거는 수년간 방치되어 상태가 안 좋았다."},{"en":"in one go","pos":"부구","ko":"한 번에","ex":"She finished the entire novel in one go.","kr":"그녀는 그 소설 전체를 한 번에 다 읽었다."},{"en":"ins and outs","pos":"관용","ko":"세세한 사항","ex":"She knows all the ins and outs of the lease.","kr":"그녀는 임대 계약의 세세한 내용을 다 안다."},{"en":"jot down","pos":"동구","ko":"간단히 적다","ex":"Let me jot down your phone number before I forget.","kr":"잊어버리기 전에 전화번호를 적어 두겠다."},{"en":"jump in","pos":"동구","ko":"뛰어들다, 참여하다","ex":"If you want to help, feel free to jump in anytime.","kr":"돕고 싶으면 언제든 편하게 뛰어들어도 좋다."},{"en":"just to be safe","pos":"관용","ko":"혹시 모르니","ex":"I brought an umbrella just to be safe.","kr":"나는 혹시 모르니까 우산을 챙겨 왔다."},{"en":"keep one's fingers crossed","pos":"관용","ko":"행운을 빌다","ex":"I'll keep my fingers crossed for your interview.","kr":"네 면접이 잘되기를 빌겠다."},{"en":"leave a lot to be desired","pos":"관용","ko":"많이 부족하다, 아쉬움이 남다","ex":"The food was fine, but the service left a lot to be desired.","kr":"음식은 괜찮았지만 서비스는 많이 아쉬웠다."},{"en":"long overdue","pos":"형구","ko":"진작 됐어야 할","ex":"A pay raise for the staff is long overdue.","kr":"직원들의 급여 인상은 진작 이루어졌어야 했다."},{"en":"make a point of","pos":"관용","ko":"일부러 꼭 하다","ex":"I make a point of calling my parents every Sunday.","kr":"나는 일요일마다 꼭 부모님께 전화한다."},{"en":"make other plans","pos":"동구","ko":"다른 계획을 세우다","ex":"If the concert sells out, we'll have to make other plans.","kr":"콘서트가 매진되면 다른 계획을 세워야 한다."},{"en":"make sense","pos":"동구","ko":"이해가 되다, 말이 되다","ex":"Your explanation really helps it make sense now.","kr":"네 설명 덕분에 이제 정말 이해가 된다."},{"en":"mark one's calendar","pos":"동구","ko":"달력에 일정을 표시하다","ex":"Be sure to mark your calendar for the festival.","kr":"축제를 위해 꼭 달력에 표시해 두세요."},{"en":"mark your calendar","pos":"동구","ko":"일정을 표시해 두다, 잊지 말고 챙기다","ex":"Mark your calendar for the festival next month.","kr":"다음 달 축제를 위해 일정을 표시해 두세요."},{"en":"mix up","pos":"동구","ko":"다양하게 바꾸다, 섞다","ex":"Try to mix up your routine so it stays interesting.","kr":"지루하지 않도록 루틴을 다양하게 바꿔주세요."},{"en":"narrow down","pos":"동구","ko":"추려내다, 범위를 좁히다","ex":"Let's narrow down our choices to two laptops.","kr":"선택지를 노트북 두 개로 좁혀 봐요."},{"en":"off the top of one's head","pos":"관용","ko":"깊이 생각하지 않고 바로 떠오르는 대로","ex":"Off the top of my head, I can name three good cafes.","kr":"바로 떠오르는 대로, 괜찮은 카페 세 곳을 말할 수 있다."},{"en":"on the spot","pos":"전구","ko":"즉석에서","ex":"Applicants may be hired on the spot at the job fair.","kr":"지원자들은 취업 박람회에서 즉석에서 채용될 수 있다."},{"en":"opt for","pos":"동구","ko":"선택하다","ex":"Many travelers opt for trains rather than crowded buses.","kr":"많은 여행객이 붐비는 버스보다 기차를 선택한다."},{"en":"pair with","pos":"동구","ko":"~와 짝지어 주다","ex":"The program will pair you with a partner who shares your goals.","kr":"그 프로그램은 목표가 같은 파트너와 짝지어 줄 것이다."},{"en":"pass out","pos":"동구","ko":"여러 사람에게 나눠주다","ex":"Volunteers will pass out flyers at the entrance.","kr":"자원봉사자들이 입구에서 전단을 나눠줄 것이다."},{"en":"pay attention","pos":"동구","ko":"주의를 기울이다, 신경 쓰다","ex":"Students should pay attention to the safety instructions.","kr":"학생들은 안전 지침에 주의를 기울여야 한다."},{"en":"personal conflict","pos":"명구","ko":"(일정이 겹치는) 개인 사정, 개인적 갈등","ex":"She missed the meeting due to a personal conflict.","kr":"그녀는 개인 사정 때문에 회의에 못 왔다."},{"en":"pertain to","pos":"동구","ko":"~와 관련되다","ex":"These rules pertain to all first-year students.","kr":"이 규칙들은 모든 1학년 학생에게 적용된다."},{"en":"plan ahead","pos":"동구","ko":"미리 계획하다","ex":"It's wise to plan ahead for your final projects.","kr":"기말 프로젝트는 미리 계획하는 게 현명하다."},{"en":"pleasantly surprised","pos":"형구","ko":"기분 좋게 놀란","ex":"I was pleasantly surprised by how good the meal was.","kr":"식사가 너무 맛있어서 기분 좋게 놀랐다."},{"en":"push the envelope","pos":"관용","ko":"한계에 도전하다","ex":"This young designer loves to push the envelope with bold ideas.","kr":"이 젊은 디자이너는 과감한 아이디어로 한계를 밀어붙이는 걸 좋아한다."},{"en":"qualify as","pos":"동구","ko":"~의 자격에 해당하다","ex":"A short nap can qualify as real rest.","kr":"짧은 낮잠도 진짜 휴식으로 볼 수 있다."},{"en":"refrain from","pos":"동구","ko":"~을 삼가다","ex":"Visitors should refrain from touching the museum exhibits.","kr":"방문객은 박물관 전시품을 만지는 것을 삼가야 한다."},{"en":"run late","pos":"동구","ko":"늦어지다","ex":"Sorry, I'm running late because of the traffic.","kr":"미안하다, 교통 체증 때문에 늦어지고 있다."},{"en":"run low on","pos":"동구","ko":"~이 떨어져 가다, 부족해지다","ex":"We are starting to run low on printer ink.","kr":"프린터 잉크가 점점 떨어져 가고 있다."},{"en":"run to","pos":"동구","ko":"(잠깐) ~에 다녀오다, 급히 가다","ex":"I need to run to the store before it closes.","kr":"문 닫기 전에 가게에 잠깐 다녀와야 한다."},{"en":"set goals","pos":"동구","ko":"목표를 세우다","ex":"At the start of each term, I like to set goals for myself.","kr":"매 학기 초에 나는 스스로 목표를 세우는 걸 좋아한다."},{"en":"settle in","pos":"동구","ko":"적응하다","ex":"It took a few weeks to settle in at my new school.","kr":"새 학교에 적응하는 데 몇 주가 걸렸다."},{"en":"silent mode","pos":"명구","ko":"무음 모드","ex":"Please set your phone to silent mode during the lecture.","kr":"강의 중에는 휴대폰을 무음 모드로 설정해 주기 바란다."},{"en":"skip out on","pos":"동구","ko":"빠져나가다, 건너뛰다","ex":"Try not to skip out on breakfast before a long exam.","kr":"긴 시험 전에는 아침을 건너뛰지 마세요."},{"en":"smart move","pos":"명구","ko":"현명한 선택","ex":"Saving money early was a really smart move.","kr":"일찍부터 돈을 모은 건 정말 현명한 선택이었다."},{"en":"sworn to secrecy","pos":"동구","ko":"비밀을 지키기로 맹세한 상태다","ex":"Everyone on the project was sworn to secrecy about the plot.","kr":"그 프로젝트의 모두가 줄거리에 대해 비밀을 지키기로 맹세했다."},{"en":"take back","pos":"동구","ko":"반납하다, 돌려주다","ex":"I need to take back these library books today.","kr":"오늘 이 도서관 책들을 돌려줘야 한다."},{"en":"take forever","pos":"동구","ko":"엄청나게 오래 걸리다","ex":"The download seems to take forever on this connection.","kr":"이 연결에서는 다운로드가 엄청 오래 걸리는 것 같다."},{"en":"tech whiz","pos":"명구","ko":"기술에 능통한 사람","ex":"Ask Mia to fix it; she's a real tech whiz.","kr":"미아한테 고쳐 달라고 해 봐라. 진짜 컴퓨터 도사다."},{"en":"the next big thing","pos":"명구","ko":"차세대 유망주, 다음에 크게 뜰 것","ex":"Everyone says this app is the next big thing.","kr":"다들 이 앱이 다음에 크게 뜰 것이라고 말한다."},{"en":"tie into","pos":"동구","ko":"~와 밀접하게 연결되다","ex":"Your conclusion should tie into the main argument.","kr":"결론은 주된 주장과 밀접하게 연결되어야 한다."},{"en":"turn down","pos":"동구","ko":"거절하다, (소리·세기를) 줄이다","ex":"Could you turn down the music a little, please?","kr":"음악 소리를 조금만 줄여 줄 수 있나요?"},{"en":"wash out","pos":"동구","ko":"유실되다","ex":"Heavy rain might wash out the mountain road.","kr":"폭우로 산길이 유실될 수도 있다."}]}</script>
<script>
(function(){
  "use strict";
  var KEY="novetoefl-phrase-known", SET="novetoefl-phrase-set";
  var DAYS=null, APP=null, book=1, day=1,
      mode={ko:false,en:false,hide:false,find:false}, query="";
  var known=load(KEY,{}), saved=load(SET,{});
  if(saved.book)book=saved.book; if(saved.day)day=saved.day;
  if(saved.ko)mode.ko=true; if(saved.en)mode.en=true; if(saved.hide)mode.hide=true;

  function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
  function pad(n){return String(n).padStart(2,"0")}

  var $days=document.getElementById("days"), $main=document.getElementById("main"),
      $count=document.getElementById("count"), $q=document.getElementById("q"),
      $findWrap=document.getElementById("findWrap");

  var tag=document.getElementById("DATA"), raw=tag?tag.textContent.trim():"";
  (raw ? Promise.resolve(JSON.parse(raw))
       : fetch("data/phrase.json").then(function(r){return r.json()})
  ).then(function(j){
    DAYS=j.days; APP=j.append; buildDays(); render();
  }).catch(function(){
    $main.innerHTML='<p class="empty">표현을 불러오지 못했습니다.<br>잠시 뒤 새로고침해 주세요.</p>';
  });

  function daysOf(b){return DAYS.filter(function(d){return d.book===b})}

  function buildDays(){
    $days.innerHTML="";
    if(book===3){ $days.hidden=true; return }
    $days.hidden=false;
    daysOf(book).forEach(function(d){
      var b=el("button",null,"DAY "+pad(d.day));
      b.setAttribute("role","tab");
      b.setAttribute("aria-current", d.day===day?"true":"false");
      b.onclick=function(){day=d.day;persist();buildDays();render();window.scrollTo(0,0)};
      $days.appendChild(b);
    });
    var cur=$days.querySelector('[aria-current="true"]');
    if(cur)cur.scrollIntoView({block:"nearest",inline:"center"});
  }
  function persist(){save(SET,{book:book,day:day,ko:mode.ko,en:mode.en,hide:mode.hide})}
  function kid(p,scope){return scope+":"+p.en}

  function all(){
    var out=[];
    DAYS.forEach(function(d){d.items.forEach(function(p){out.push([p,"d"+d.day])})});
    APP.forEach(function(p){out.push([p,"ap"])});
    return out;
  }
  function matches(p){
    var s=query.trim().toLowerCase(); if(!s)return true;
    return (p.en+" "+p.ko).toLowerCase().indexOf(s)>-1;
  }

  function render(){
    document.body.dataset.book = book===3 ? "2" : book;
    document.body.classList.toggle("veil-ko",mode.ko);
    document.body.classList.toggle("veil-en",mode.en);
    $main.innerHTML="";

    var pairs, eyebrow, title;
    if(mode.find && query.trim()){
      pairs=all().filter(function(x){return matches(x[0])});
      eyebrow="찾기"; title=query.trim();
      $count.textContent=pairs.length+"개";
    }else if(book===3){
      pairs=APP.map(function(p){return [p,"ap"]});
      eyebrow="권말"; title="실전 표현 모음";
      $count.textContent=pairs.length+"개";
    }else{
      var d=DAYS.filter(function(x){return x.day===day})[0];
      if(!d){d=daysOf(book)[0];day=d.day}
      pairs=d.items.map(function(p){return [p,"d"+d.day]});
      eyebrow="DAY "+pad(d.day); title=d.topic;
      var done=0;
      pairs.forEach(function(x){if(known[kid(x[0],x[1])])done++});
      $count.textContent=done+" / "+pairs.length+" 외움";
    }

    var h=el("div","head");
    h.appendChild(el("em",null,eyebrow));
    h.appendChild(el("h1",null,title));
    $main.appendChild(h);

    var shown=0;
    pairs.forEach(function(x){
      if(mode.hide && known[kid(x[0],x[1])]) return;
      shown++; $main.appendChild(card(x[0],x[1]));
    });
    if(!shown){
      $main.appendChild(el("p","empty",
        mode.find&&query.trim()?"찾는 표현이 없습니다.":"이 묶음을 모두 외웠습니다."));
    }
    $main.appendChild(el("p","foot","노베토플 4.5+ 단어장 · 실전 표현 628"));
  }

  function card(p,scope){
    var id=kid(p,scope), c=el("div","card"+(known[id]?" known":""));
    var r1=el("div","row1"), ph=el("div","ph");
    ph.appendChild(el("b",null,p.en));
    if(p.pos) ph.appendChild(el("span","pos",p.pos));
    r1.appendChild(ph);
    var tk=el("button","tick","✓");
    tk.setAttribute("aria-pressed",known[id]?"true":"false");
    tk.setAttribute("aria-label",p.en+" 외움 표시");
    tk.onclick=function(ev){
      ev.stopPropagation();
      if(known[id])delete known[id]; else known[id]=1;
      save(KEY,known); render();
    };
    r1.appendChild(tk);
    c.appendChild(r1);
    c.appendChild(el("p","ko",p.ko));
    if(p.ex){
      var b=el("div","ex"), en=el("p","en");
      en.innerHTML=mark(p.ex,p.en);
      b.appendChild(en);
      if(p.kr) b.appendChild(el("p","kr",p.kr));
      c.appendChild(b);
    }
    c.onclick=function(){ if(mode.ko||mode.en) c.classList.toggle("open") };
    return c;
  }

  function esc(s){return s.replace(/[&<>"]/g,function(ch){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]})}
  function mark(sentence, phrase){
    var safe=esc(sentence);
    var w=phrase.split(/\s+/).filter(function(x){return /^[A-Za-z-]{3,}$/.test(x)});
    w.forEach(function(x){
      safe=safe.replace(new RegExp("\\b("+x+"[a-z]*)\\b","gi"),"<strong>$1</strong>");
    });
    return safe;
  }

  function pick(b){
    if(book===b)return;
    book=b;
    if(b!==3){ day=daysOf(b)[0].day }
    [1,2,3].forEach(function(i){
      document.getElementById("bk"+i).setAttribute("aria-selected", i===b?"true":"false");
    });
    persist(); buildDays(); render(); window.scrollTo(0,0);
  }
  document.getElementById("bk1").onclick=function(){pick(1)};
  document.getElementById("bk2").onclick=function(){pick(2)};
  document.getElementById("bk3").onclick=function(){pick(3)};

  function tool(id,key,after){
    var b=document.getElementById(id);
    b.setAttribute("aria-pressed",mode[key]?"true":"false");
    b.onclick=function(){
      mode[key]=!mode[key];
      if(key==="ko"&&mode.ko&&mode.en){mode.en=false;
        document.getElementById("tEn").setAttribute("aria-pressed","false")}
      if(key==="en"&&mode.en&&mode.ko){mode.ko=false;
        document.getElementById("tKo").setAttribute("aria-pressed","false")}
      b.setAttribute("aria-pressed",mode[key]?"true":"false");
      persist(); if(after)after(); render();
    };
  }
  tool("tKo","ko"); tool("tEn","en"); tool("tHide","hide");
  tool("tFind","find",function(){
    $findWrap.hidden=!mode.find;
    if(mode.find){$q.focus()}else{query="";$q.value=""}
  });
  $q.addEventListener("input",function(){query=$q.value;render()});

  [1,2,3].forEach(function(i){
    document.getElementById("bk"+i).setAttribute("aria-selected", i===book?"true":"false");
  });
})();
</script>
