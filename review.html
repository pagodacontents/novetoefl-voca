<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>노베토플 복습 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃 — 한 번에 한 문항. 머리에 회차와 진행 막대, 가운데에 문항,
   아래에 답안지 눈금. 세 유형의 답하는 꼴이 달라 답란만 갈아 끼운다.
     A 뜻쓰기   낱말을 보고 뜻 고르기 (네 갈래)
     B 동의어   문장 속 낱말을 바꿔 쓸 말 고르기 (워드뱅크)
     C 빈칸     앞 절반만 열린 철자를 채워 넣기 */
:root{
  --s1:#D1522B; --s1-fill:#FF8D6D; --s1-tint:#FFF1EB;
  --s2:#004871; --s2-fill:#003A5D; --s2-tint:#E8F0F6;
  --bg:#FDFAF8; --surf:#FFFFFF; --fg:#1B1512; --mut:#7C6C64;
  --faint:#A99A93; --line:#EDE2DC;
  --ok:#2E7D5B; --ok-t:#E6F3EC; --no:#B3402E; --no-t:#FBEAE6;
  --spot:var(--s1); --spot-fill:var(--s1-fill); --spot-tint:var(--s1-tint);
  --f-word:"Lora",Georgia,serif;
  --f-ui:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-mono:"Noto Sans Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --r:12px;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
body[data-book="2"]{ --spot:var(--s2); --spot-fill:var(--s2-fill); --spot-tint:var(--s2-tint) }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --s1:#FFA98E; --s1-fill:#FF8D6D; --s1-tint:#2C1C16;
  --s2:#86C2E6; --s2-fill:#5AA7D4; --s2-tint:#122531;
  --bg:#141110; --surf:#1D1917; --fg:#F3ECE8; --mut:#A6968E;
  --faint:#7E6F68; --line:#2F2825;
  --ok:#6BC79B; --ok-t:#14291F; --no:#F09080; --no-t:#301A16; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --s1:#FFA98E; --s1-fill:#FF8D6D; --s1-tint:#2C1C16;
  --s2:#86C2E6; --s2-fill:#5AA7D4; --s2-tint:#122531;
  --bg:#141110; --surf:#1D1917; --fg:#F3ECE8; --mut:#A6968E;
  --faint:#7E6F68; --line:#2F2825;
  --ok:#6BC79B; --ok-t:#14291F; --no:#F09080; --no-t:#301A16; color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--spot-fill)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--spot-fill);color:#fff}
.top-in{padding-left:var(--gut);padding-right:var(--gut-r);padding-block:10px;display:flex;flex-direction:column;gap:9px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:15px;font-weight:700}
.brand span{font-size:11.5px;opacity:.8;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.books{display:flex;gap:6px}
.books button{flex:1;border:0;border-radius:999px;cursor:pointer;font-family:var(--f-ui);font-size:12.5px;font-weight:500;padding:7px 4px;background:rgba(255,255,255,.22);color:#fff}
.books button[aria-selected="true"]{background:#fff;color:var(--spot);font-weight:700}
.days{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 auto;border:0;border-radius:8px;cursor:pointer;font-family:var(--f-mono);font-size:12px;padding:6px 9px;background:rgba(255,255,255,.18);color:#fff;white-space:nowrap}
.days button[aria-current="true"]{background:#fff;color:var(--spot);font-weight:700}
.days button.scored::after{content:attr(data-sc);margin-left:4px;font-size:10px;opacity:.85}

main{padding-left:var(--gut);padding-right:var(--gut-r);padding-block:14px 44px;display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.meta em{font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--spot);letter-spacing:.06em}
.meta .t{color:var(--mut);font-size:13px}
.meta .num{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.prog{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:-10px}
.prog i{display:block;height:100%;background:var(--spot-fill);transition:width .25s}

.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px 15px;display:flex;flex-direction:column;gap:13px}
.kind{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.07em;color:var(--spot);background:var(--spot-tint);border-radius:5px;padding:3px 7px;align-self:flex-start}
.ask{margin:0;font-size:13px;color:var(--mut)}
.qs{margin:0;font-family:var(--f-word);font-size:17px;line-height:1.55}
.qs strong{color:var(--spot);font-weight:600;border-bottom:2px solid var(--spot-tint)}
.qw{margin:0;font-family:var(--f-word);font-size:26px;font-weight:600;color:var(--spot);text-align:center;padding-block:6px}

.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--fg);
  border-radius:10px;padding:11px 13px;font-family:var(--f-ui);font-size:14.5px;cursor:pointer;
  display:flex;gap:9px;align-items:flex-start;
}
.opt .mk{flex:0 0 auto;font-family:var(--f-mono);font-size:11.5px;color:var(--faint);padding-top:2px}
.opt.en{font-family:var(--f-word);font-size:15px}
.opt:hover{border-color:var(--spot)}
.opt[aria-pressed="true"]{border-color:var(--spot);background:var(--spot-tint)}
.opt.right{border-color:var(--ok);background:var(--ok-t);color:var(--ok)}
.opt.wrong{border-color:var(--no);background:var(--no-t);color:var(--no)}
.opt:disabled{cursor:default}
.opt:focus-visible,.typein:focus-visible,.acts button:focus-visible,
.books button:focus-visible,.days button:focus-visible{outline:2px solid var(--spot);outline-offset:2px}

.slots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.slot{width:22px;height:34px;border-bottom:2px solid var(--line);font-family:var(--f-mono);font-size:19px;font-weight:500;display:grid;place-items:center}
.slot.given{color:var(--faint);border-bottom-color:var(--faint)}
.slot.fill{border-bottom-color:var(--spot)}
.card.right .slot{color:var(--ok);border-bottom-color:var(--ok)}
.card.wrong .slot{color:var(--no);border-bottom-color:var(--no)}
.typein{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:11px 13px;font-family:var(--f-mono);font-size:17px;text-align:center;letter-spacing:.06em}

.verdict{min-height:20px;font-size:13.5px;text-align:center;font-weight:500}
.verdict.right{color:var(--ok)}
.verdict.wrong{color:var(--no)}
.trans{margin:0;font-size:12.5px;color:var(--mut);text-align:center}
.acts{display:flex;gap:8px}
.acts button{flex:1;border-radius:10px;padding:11px 6px;font-family:var(--f-ui);font-size:13.5px;cursor:pointer;border:1px solid var(--line);background:var(--surf);color:var(--mut)}
.acts button.go{background:var(--spot-fill);border-color:var(--spot-fill);color:#fff;font-weight:700}
.acts button:disabled{opacity:.45;cursor:default}

.sheet{display:flex;flex-direction:column;gap:7px}
.sheet h2{margin:0;font-size:12.5px;font-weight:500;color:var(--mut)}
.marks{display:flex;flex-wrap:wrap;gap:4px}
.mkb{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);color:var(--faint);background:var(--surf)}
.mkb.right{background:var(--ok-t);border-color:var(--ok);color:var(--ok)}
.mkb.wrong{background:var(--no-t);border-color:var(--no);color:var(--no)}
.mkb.now{border-color:var(--spot);color:var(--spot);font-weight:700}

.done{background:var(--spot-tint);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.done b{font-size:28px;font-family:var(--f-mono);color:var(--spot)}
.done p{margin:0;font-size:13.5px;color:var(--mut)}
.recap{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.rc{background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px}
.rc b{font-family:var(--f-word);font-size:14px;color:var(--no)}
.rc span{color:var(--mut)}
.foot{color:var(--faint);font-size:11.5px;text-align:center;padding-top:14px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

"no":"2","type":"B 동의어","q":"Agroforestry combines trees and crops to keep soil healthy and productive.","a":"forest farming","w":"agroforestry","kr":"혼농임업은 나무와 작물을 결합해 토양을 건강하고 비옥하게 유지한다."},{"no":"3","type":"B 동의어","q":"Factories must store hazardous chemicals in sealed, clearly labeled containers.","a":"dangerous","w":"hazardous","kr":"공장은 유해 화학 물질을 밀봉되고 명확히 표시된 용기에 보관해야 한다."},{"no":"4","type":"B 동의어","q":"When the waste is treated aerobically, it produces far less methane.","a":"with oxygen","w":"aerobically","kr":"폐기물을 호기성으로 처리하면 메탄이 훨씬 적게 발생한다."},{"no":"5","type":"B 동의어","q":"Glass is an amorphous solid lacking the ordered structure of crystals.","a":"shapeless","w":"amorphous","kr":"유리는 결정의 규칙적인 구조가 없는 무정형 고체다."},{"no":"6","type":"B 동의어","q":"Anaerobic bacteria digest the waste where no oxygen is present.","a":"oxygen-free","w":"anaerobic","kr":"혐기성 박테리아는 산소가 없는 곳에서 폐기물을 분해한다."},{"no":"7","type":"B 동의어","q":"The crystal's anisotropy causes light to bend differently along each axis.","a":"directionality","w":"anisotropy","kr":"그 결정의 이방성은 빛이 각 축을 따라 다르게 굴절되도록 한다."},{"no":"8","type":"B 동의어","q":"Aquaculture now supplies nearly half of the seafood consumed globally.","a":"fish farming","w":"aquaculture","kr":"양식업은 이제 전 세계에서 소비되는 해산물의 거의 절반을 공급한다."},{"no":"9","type":"B 동의어","q":"Manufacturers increasingly use biodegradable packaging to reduce plastic waste.","a":"decomposable","w":"biodegradable","kr":"제조업체들은 플라스틱 폐기물을 줄이려고 생분해성 포장재를 점점 더 사용한다."},{"no":"10","type":"B 동의어","q":"The hollow design increases the vessel's buoyancy in deep water.","a":"floatability","w":"buoyancy","kr":"속이 빈 설계는 깊은 물에서 선박의 부력을 높여준다."},{"no":"11","type":"C 빈칸","q":"The buo____ raft stayed afloat despite carrying heavy cargo.","a":"buoyant","w":"","kr":"그 부력이 좋은 뗏목은 무거운 화물을 싣고도 물 위에 떠 있었다."},{"no":"12","type":"C 빈칸","q":"Enzyme cata_____ allows biochemical reactions to occur at body temperature.","a":"catalysis","w":"","kr":"효소 촉매 작용은 생화학 반응이 체온에서 일어나도록 해 준다."},{"no":"13","type":"C 빈칸","q":"Cemen______ binds loose grains together to form solid rock.","a":"Cementation","w":"","kr":"교결 작용은 느슨한 입자들을 서로 결합시켜 단단한 암석을 형성한다."},{"no":"14","type":"C 빈칸","q":"Sandstone is a cla____ rock formed from compacted mineral fragments.","a":"clastic","w":"","kr":"사암은 다져진 광물 조각으로 이루어진 쇄설성 암석이다."},{"no":"15","type":"C 빈칸","q":"Intensive farming can quickly dep____ the soil of key minerals.","a":"deplete","w":"","kr":"집약적 농업은 토양에서 주요 미네랄을 빠르게 고갈시킬 수 있다."},{"no":"16","type":"A 뜻쓰기","q":"combustible","a":"가연성의, 잘 타는","w":"combustible","kr":""},{"no":"17","type":"A 뜻쓰기","q":"compaction","a":"압축, 다져짐","w":"compaction","kr":""},{"no":"18","type":"A 뜻쓰기","q":"condense","a":"응축하다, 압축하다","w":"condense","kr":""},{"no":"19","type":"A 뜻쓰기","q":"cylindrical","a":"원통형의","w":"cylindrical","kr":""},{"no":"20","type":"A 뜻쓰기","q":"deflect","a":"방향을 빗나가게 하다, 편향시키다","w":"deflect","kr":""},{"no":"21","type":"A 뜻쓰기","q":"deposition","a":"퇴적, 침전","w":"deposition","kr":""},{"no":"22","type":"A 뜻쓰기","q":"diffract","a":"회절시키다","w":"diffract","kr":""},{"no":"23","type":"A 뜻쓰기","q":"equilibrium","a":"균형, 평형 상태","w":"equilibrium","kr":""},{"no":"24","type":"A 뜻쓰기","q":"filtration","a":"여과","w":"filtration","kr":""}]},{"day":41,"topic":"기술·공학·경제","book":2,"bank":["accelerator","breakthrough","profit-driven","collect","dual","facility","fissure","founder","intake","part","representation","sturdiness","acceptance"],"items":[{"no":"1","type":"B 동의어","q":"The rapid adoption of smartphones transformed how people access information.","a":"acceptance","w":"adoption","kr":"스마트폰의 빠른 채택은 사람들이 정보에 접근하는 방식을 바꿔 놓았다."},{"no":"2","type":"B 동의어","q":"Data visualization helps readers grasp complex trends at a glance.","a":"representation","w":"visualization","kr":"데이터 시각화는 독자들이 복잡한 추세를 한눈에 파악하도록 도와준다."},{"no":"3","type":"B 동의어","q":"Computers store all information using a binary system of zeros and ones.","a":"dual","w":"binary","kr":"컴퓨터는 0과 1로 이루어진 이진법 체계로 모든 정보를 저장한다."},{"no":"4","type":"B 동의어","q":"The film was a commercial success despite mixed reviews from critics.","a":"profit-driven","w":"commercial","kr":"그 영화는 비평가들의 엇갈린 평가에도 불구하고 상업적인 성공을 거뒀다."},{"no":"5","type":"B 동의어","q":"The research complex houses dozens of specialized laboratories.","a":"facility","w":"complex","kr":"그 연구 단지에는 수십 개의 전문 실험실이 들어 있다."},{"no":"6","type":"B 동의어","q":"Memory is one essential component of every modern computer system.","a":"part","w":"component","kr":"메모리는 모든 현대 컴퓨터 시스템의 필수 구성 요소 중 하나다."},{"no":"7","type":"B 동의어","q":"Studies link excessive sugar consumption to several health problems.","a":"intake","w":"consumption","kr":"여러 연구가 과도한 설탕 섭취를 몇몇 건강 문제와 연결 짓는다."},{"no":"8","type":"B 동의어","q":"A small crack in the concrete can spread if water seeps inside.","a":"fissure","w":"crack","kr":"콘크리트의 작은 균열은 물이 스며들면 번질 수 있다."},{"no":"9","type":"B 동의어","q":"The durability of the new alloy makes it ideal for aircraft components.","a":"sturdiness","w":"durability","kr":"이 새로운 합금의 내구성 덕분에 항공기 부품에 안성맞춤이다."},{"no":"10","type":"B 동의어","q":"The young entrepreneur launched three startups before turning thirty.","a":"founder","w":"entrepreneur","kr":"그 젊은 기업가는 서른이 되기 전에 스타트업 셋을 세웠다."},{"no":"11","type":"C 빈칸","q":"Solar panels har____ energy from sunlight throughout the daylight hours.","a":"harvest","w":"","kr":"태양광 패널은 낮 시간 내내 햇빛에서 에너지를 수확한다."},{"no":"12","type":"C 빈칸","q":"The startup joined a university incu_____ to access mentorship and funding.","a":"incubator","w":"","kr":"그 신생 기업은 멘토링과 자금을 얻으려고 대학 창업 보육 기관에 들어갔다."},{"no":"13","type":"C 빈칸","q":"Technological innov_____ has transformed how students learn today.","a":"innovation","w":"","kr":"기술 혁신은 오늘날 학생들이 배우는 방식을 변화시켰다."},{"no":"14","type":"C 빈칸","q":"Proper insul_____ dramatically lowers a building's heating costs in winter.","a":"insulation","w":"","kr":"적절한 단열은 겨울철 건물의 난방비를 크게 낮춰준다."},{"no":"15","type":"C 빈칸","q":"The museum offers an inter______ exhibit that responds to visitors.","a":"interactive","w":"","kr":"그 박물관은 방문객에게 반응하는 쌍방향 전시를 제공한다."},{"no":"16","type":"A 뜻쓰기","q":"manufacture","a":"제조하다, 대량 생산하다","w":"manufacture","kr":""},{"no":"17","type":"A 뜻쓰기","q":"nanotechnology","a":"(원자·분자 단위로 물질을 다루는) 나노 기술","w":"nanotechnology","kr":""},{"no":"18","type":"A 뜻쓰기","q":"parallel","a":"병렬의, 동시에 진행되는","w":"parallel","kr":""},{"no":"19","type":"A 뜻쓰기","q":"productivity","a":"생산성","w":"productivity","kr":""},{"no":"20","type":"A 뜻쓰기","q":"regulation","a":"규제, 규정, 규칙","w":"regulation","kr":""},{"no":"21","type":"A 뜻쓰기","q":"simulate","a":"모의 실험하다, 모사하다","w":"simulate","kr":""},{"no":"22","type":"A 뜻쓰기","q":"turbine","a":"터빈","w":"turbine","kr":""},{"no":"23","type":"A 뜻쓰기","q":"stability","a":"안정성","w":"stability","kr":""},{"no":"24","type":"A 뜻쓰기","q":"startup","a":"신생 기업","w":"startup","kr":""}]},{"day":42,"topic":"기술·공학·경제","book":2,"bank":["allotment","chip material","close up","closeness","forecasting","free-market","inducement","momentum","on-demand","pier","reactivity","recover","strenuous"],"items":[{"no":"1","type":"B 동의어","q":"The factory uses a just-in-time system to minimize stored inventory.","a":"on-demand","w":"just-in-time","kr":"그 공장은 저장 재고를 최소화하려고 적시 공급 시스템을 사용한다."},{"no":"2","type":"B 동의어","q":"Tax breaks provide a strong incentive for renewable energy investment.","a":"inducement","w":"incentive","kr":"세금 감면은 재생 에너지 투자에 강한 장려책을 제공한다."},{"no":"3","type":"B 동의어","q":"The spiral jetty stretched out into the shallow salt lake.","a":"pier","w":"jetty","kr":"그 나선형 방파제는 얕은 소금 호수 안으로 길게 뻗어 있었다."},{"no":"4","type":"B 동의어","q":"Traditional rice farming was extremely labor-intensive before machines arrived.","a":"strenuous","w":"labor-intensive","kr":"전통적인 벼농사는 기계가 등장하기 전에는 대단히 노동 집약적이었다."},{"no":"5","type":"B 동의어","q":"Critics blame the crisis on decades of laissez-faire economic policy.","a":"free-market","w":"laissez-faire","kr":"비평가들은 그 위기를 수십 년간의 자유방임주의 경제 정책 탓으로 돌린다."},{"no":"6","type":"B 동의어","q":"The warehouse's proximity to the highway lowered delivery times.","a":"closeness","w":"proximity","kr":"창고가 고속도로에 가까워서 배송 시간이 줄었다."},{"no":"7","type":"B 동의어","q":"The model uses predictive algorithms to anticipate customer behavior.","a":"forecasting","w":"predictive","kr":"그 모델은 고객 행동을 예측하기 위해 예측 알고리즘을 사용한다."},{"no":"8","type":"B 동의어","q":"The government set a strict quota for annual timber harvesting.","a":"allotment","w":"quota","kr":"정부는 연간 목재 벌채에 엄격한 할당량을 정했다."},{"no":"9","type":"B 동의어","q":"The economy began to rebound after several years of recession.","a":"recover","w":"rebound","kr":"그 경제는 몇 년간의 불황 이후 반등하기 시작했다."},{"no":"10","type":"B 동의어","q":"The team's responsiveness to customer complaints improved overall satisfaction.","a":"reactivity","w":"responsiveness","kr":"고객 불만에 대한 팀의 대응력이 전반적인 만족도를 높였다."},{"no":"11","type":"C 빈칸","q":"The mineral can se__ small cracks before they grow larger.","a":"seal","w":"","kr":"그 광물은 작은 균열이 더 커지기 전에 그것들을 밀봉할 수 있다."},{"no":"12","type":"C 빈칸","q":"Modern electronics depend on tiny semico_______ chips.","a":"semiconductor","w":"","kr":"현대 전자기기는 아주 작은 반도체 칩에 의존한다."},{"no":"13","type":"C 빈칸","q":"The theory finally gained trac____ after new evidence emerged.","a":"traction","w":"","kr":"그 이론은 새로운 증거가 나온 뒤에야 마침내 탄력을 얻었다."},{"no":"14","type":"C 빈칸","q":"Nerve cells tran____ electrical signals across tiny gaps called synapses.","a":"transmit","w":"","kr":"신경 세포는 시냅스라는 작은 틈을 가로질러 전기 신호를 전송한다."},{"no":"15","type":"C 빈칸","q":"Affl____ households tend to spend more on education and travel.","a":"Affluent","w":"","kr":"부유한 가정은 교육과 여행에 더 많이 지출하는 경향이 있다."},{"no":"16","type":"A 뜻쓰기","q":"assembly-line","a":"조립 라인식의, 대량 생산식의","w":"assembly-line","kr":""},{"no":"17","type":"A 뜻쓰기","q":"calibrate","a":"정밀 조정하다, 눈금을 맞추다","w":"calibrate","kr":""},{"no":"18","type":"A 뜻쓰기","q":"capitalism","a":"자본주의","w":"capitalism","kr":""},{"no":"19","type":"A 뜻쓰기","q":"circulate","a":"순환하다","w":"circulate","kr":""},{"no":"20","type":"A 뜻쓰기","q":"drainage","a":"배수","w":"drainage","kr":""},{"no":"21","type":"A 뜻쓰기","q":"fireproof","a":"내화성의","w":"fireproof","kr":""},{"no":"22","type":"A 뜻쓰기","q":"freelance","a":"회사에 소속되지 않은, 프리랜서의","w":"freelance","kr":""},{"no":"23","type":"A 뜻쓰기","q":"hydroelectric","a":"수력 발전의","w":"hydroelectric","kr":""},{"no":"24","type":"A 뜻쓰기","q":"iteration","a":"반복, 반복 버전","w":"iteration","kr":""}]}]}</script>
<script>
(function(){
  "use strict";
  // MODE — quiz(미니 퀴즈) · review(복습 퀴즈) · rtest(REVIEW TEST) · ftest(FINAL TEST)
  var MODE = "review";

  var CFG={
    quiz:{title:"미니 퀴즈",sub:"Mini Quiz",key:"mq",src:"data/quiz.json",
          foot:"미니 퀴즈 1,008문항 · DAY 마다 24"},
    review:{title:"복습 퀴즈",sub:"Review Quiz",key:"rq",src:"data/quiz.json",
          foot:"앞서 외운 DAY 에서 20문항을 뽑습니다"},
    rtest:{title:"REVIEW TEST",sub:"Review Test",key:"rt",src:"data/test.json",
          foot:"REVIEW TEST 6회 · 회차마다 20문항"},
    ftest:{title:"FINAL TEST",sub:"Final Test",key:"ft",src:"data/test.json",
          foot:"FINAL TEST 2회 · 회차마다 40문항"}
  };
  var C=CFG[MODE];
  var SET="novetoefl-"+C.key+"-set", SC="novetoefl-"+C.key+"-score";

  var RAW=null, SETS=[], book=1, at=0, pos=0, picks=[], answered=false, items=[];
  var saved=load(SET,{}), score=load(SC,{});

  function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
  function pad(n){return String(n).padStart(2,"0")}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

  var $main=document.getElementById("main"), $days=document.getElementById("days"),
      $books=document.getElementById("books");
  document.getElementById("ttl").textContent=C.title;
  document.getElementById("sub").textContent=C.sub;

  var tag=document.getElementById("DATA"), rawtxt=tag?tag.textContent.trim():"";
  (rawtxt ? Promise.resolve(JSON.parse(rawtxt))
          : fetch(C.src).then(function(r){return r.json()})
  ).then(function(j){ RAW=j; build(); }).catch(function(){
    $main.innerHTML='<p class="foot">불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.</p>';
  });

  /* 회차 목록을 만든다 — 모드마다 한 회차의 뜻이 다르다 */
  function build(){
    if(MODE==="quiz"||MODE==="review"){
      SETS=RAW.days.map(function(d){
        return {id:"d"+d.day, day:d.day, book:d.book,
                label:"DAY "+pad(d.day), topic:d.topic,
                bank:d.bank, items:d.items};
      });
      if(MODE==="review"){ SETS=SETS.filter(function(s){return s.day>1}) }
    }else{
      var kind = MODE==="rtest" ? "REVIEW" : "FINAL";
      SETS=RAW.tests.filter(function(t){return t.kind===kind}).map(function(t){
        // 실용(1~3회·FINAL 1) 과 학술(4~6회·FINAL 2) 로 가른다
        return {id:t.kind+t.no, day:t.no,
                book:(t.kind==="FINAL" ? t.no : (t.no>3?2:1)),
                label:(t.kind==="REVIEW"?"REVIEW ":"FINAL ")+t.no,
                topic:t.range, bank:t.bank, items:t.items};
      });
    }
    if(saved.book)book=saved.book;
    var i=SETS.map(function(s){return s.id}).indexOf(saved.id);
    at = i>-1 ? i : firstOf(book);
    buildBooks(); buildDays(); start();
  }

  function listOf(b){return SETS.filter(function(s){return s.book===b})}
  function firstOf(b){var l=listOf(b);return l.length?SETS.indexOf(l[0]):0}

  function buildBooks(){
    $books.innerHTML="";
    var names = (MODE==="rtest"||MODE==="ftest")
      ? ["실용어휘","학술어휘"] : ["실용 · DAY 01–21","학술 · DAY 22–42"];
    [1,2].forEach(function(b){
      var n=listOf(b).length; if(!n) return;
      var btn=el("button",null,names[b-1]);
      btn.setAttribute("role","tab");
      btn.setAttribute("aria-selected", b===book?"true":"false");
      btn.onclick=function(){
        if(book===b)return;
        book=b; at=firstOf(b); persist(); buildBooks(); buildDays(); start();
        window.scrollTo(0,0);
      };
      $books.appendChild(btn);
    });
  }

  function buildDays(){
    $days.innerHTML="";
    var l=listOf(book);
    if(l.length<2){ $days.hidden=true; return }
    $days.hidden=false;
    l.forEach(function(s){
      var b=el("button",null,s.label);
      b.setAttribute("role","tab");
      b.setAttribute("aria-current", SETS[at]===s?"true":"false");
      var sc=score[s.id];
      if(sc){ b.classList.add("scored"); b.dataset.sc=sc.right+"/"+sc.of }
      b.onclick=function(){at=SETS.indexOf(s);persist();start();window.scrollTo(0,0)};
      $days.appendChild(b);
    });
    var c=$days.querySelector('[aria-current="true"]');
    if(c)c.scrollIntoView({block:"nearest",inline:"center"});
  }
  function persist(){save(SET,{book:book,id:SETS[at]?SETS[at].id:""})}

  /* 복습 퀴즈 — 앞선 DAY 전체에서 20문항을 뽑는다 (열 때마다 새로 뽑힌다).
     DAY 23 이면 DAY 01~22 가 통째로 바구니가 된다. */
  function makeItems(s){
    if(MODE!=="review") return s.items.slice();
    var flat=[];
    RAW.days.forEach(function(d){
      if(d.day>=s.day) return;
      d.items.forEach(function(it){ flat.push({it:it, bank:d.bank}) });
    });
    shuffle(flat);
    return flat.slice(0,20).map(function(x,i){
      var o={}; for(var k in x.it) o[k]=x.it[k];
      o.no=String(i+1); o._bank=x.bank; return o;
    });
  }

  function start(){
    var s=SETS[at]; if(!s)return;
    items=makeItems(s); pos=0; picks=[]; answered=false;
    buildDays(); render();
  }

  function meanPool(s){
    var out=[];
    items.forEach(function(it){ if(it.type.indexOf("A")===0 && it.a) out.push(it.a) });
    if(out.length<4){
      RAW.days && RAW.days.forEach(function(d){ d.items.forEach(function(it){
        if(it.type.indexOf("A")===0 && it.a) out.push(it.a) }) });
    }
    return out;
  }

  function render(){
    var s=SETS[at];
    document.body.dataset.book=s.book;
    $main.innerHTML="";
    if(pos>=items.length) return finish(s);

    var it=items[pos];
    var m=el("div","meta");
    m.appendChild(el("em",null,s.label));
    m.appendChild(el("span","t",s.topic));
    m.appendChild(el("span","num",(pos+1)+" / "+items.length));
    $main.appendChild(m);
    var pr=el("div","prog"), bi=el("i");
    bi.style.width=(pos/items.length*100)+"%"; pr.appendChild(bi);
    $main.appendChild(pr);

    var card=el("div","card");
    card.appendChild(el("span","kind",it.type));
    var vd=el("p","verdict");
    var tr=el("p","trans");
    var acts=el("div","acts");
    var go=el("button","go","확인");
    var skip=el("button",null,"모르겠어요");
    acts.appendChild(skip); acts.appendChild(go);

    var getAnswer=null, lock=null;

    if(it.type.indexOf("A")===0){
      card.appendChild(el("p","ask","이 낱말의 뜻을 고르세요."));
      card.appendChild(el("p","qw",it.q));
      var pool=meanPool(s).filter(function(x){return x!==it.a});
      var opts=shuffle(pool.slice()).slice(0,3).concat([it.a]);
      opts=shuffle(opts);
      var box=el("div","opts"); var btns=[];
      opts.forEach(function(o,i){
        var b=el("button","opt");
        b.appendChild(el("span","mk","ABCD"[i]));
        b.appendChild(el("span",null,o));
        b.dataset.v=o;
        b.setAttribute("aria-pressed","false");
        b.onclick=function(){
          if(answered)return;
          btns.forEach(function(x){x.setAttribute("aria-pressed","false")});
          b.setAttribute("aria-pressed","true");
        };
        btns.push(b); box.appendChild(b);
      });
      card.appendChild(box);
      getAnswer=function(){
        var s2=btns.filter(function(b){return b.getAttribute("aria-pressed")==="true"})[0];
        return s2?s2.dataset.v:null;
      };
      lock=function(ok){
        btns.forEach(function(b){
          b.disabled=true;
          if(b.dataset.v===it.a) b.classList.add("right");
          else if(b.getAttribute("aria-pressed")==="true") b.classList.add("wrong");
        });
      };
    }else if(it.type.indexOf("B")===0){
      card.appendChild(el("p","ask","굵은 낱말을 바꿔 쓸 수 있는 말을 고르세요."));
      var qs=el("p","qs"); qs.innerHTML=markWord(it.q, it.w); card.appendChild(qs);
      var bank=(it._bank||s.bank||[]).filter(function(x){return x!==it.a});
      var o2=shuffle(bank.slice()).slice(0,3).concat([it.a]);
      o2=shuffle(o2);
      var box2=el("div","opts"); var bt2=[];
      o2.forEach(function(o,i){
        var b=el("button","opt en");
        b.appendChild(el("span","mk","ABCD"[i]));
        b.appendChild(el("span",null,o));
        b.dataset.v=o; b.setAttribute("aria-pressed","false");
        b.onclick=function(){
          if(answered)return;
          bt2.forEach(function(x){x.setAttribute("aria-pressed","false")});
          b.setAttribute("aria-pressed","true");
        };
        bt2.push(b); box2.appendChild(b);
      });
      card.appendChild(box2);
      getAnswer=function(){
        var s2=bt2.filter(function(b){return b.getAttribute("aria-pressed")==="true"})[0];
        return s2?s2.dataset.v:null;
      };
      lock=function(){
        bt2.forEach(function(b){
          b.disabled=true;
          if(b.dataset.v===it.a) b.classList.add("right");
          else if(b.getAttribute("aria-pressed")==="true") b.classList.add("wrong");
        });
      };
    }else{
      card.appendChild(el("p","ask","빈칸에 들어갈 낱말의 철자를 채우세요."));
      var qs3=el("p","qs"); qs3.innerHTML=esc(it.q).replace(/_+/g,function(u){
        return '<strong>'+u+'</strong>' }); card.appendChild(qs3);
      var inp=el("input","typein");
      inp.type="text"; inp.id="in-"+s.id+"-"+pos;
      inp.autocapitalize="off"; inp.autocorrect="off"; inp.spellcheck=false;
      inp.setAttribute("autocomplete","off");
      inp.placeholder="낱말 전체를 적으세요";
      inp.setAttribute("aria-label","철자 입력");
      card.appendChild(inp);
      inp.addEventListener("keydown",function(e){if(e.key==="Enter")go.click()});
      getAnswer=function(){return inp.value.trim()};
      lock=function(){ inp.disabled=true };
      setTimeout(function(){inp.focus()},30);
    }

    card.appendChild(vd); card.appendChild(tr); card.appendChild(acts);
    $main.appendChild(card);

    go.onclick=function(){
      if(answered){ pos++; render(); return }
      var got=getAnswer();
      if(got===null||got===""){ vd.className="verdict"; vd.textContent="답을 고르거나 적어 주세요."; return }
      grade(got);
    };
    skip.onclick=function(){ if(!answered) grade("") };

    function grade(got){
      var ok = norm(got)===norm(it.a);
      answered=true; picks.push({ok:ok,it:it,got:got});
      lock(ok);
      card.classList.add(ok?"right":"wrong");
      vd.className="verdict "+(ok?"right":"wrong");
      vd.innerHTML = ok ? "맞았습니다" : ("정답은 <b>"+esc(it.a)+"</b> 입니다");
      if(it.kr) tr.textContent=it.kr;
      go.textContent = (pos+1>=items.length) ? "결과 보기" : "다음";
      skip.disabled=true; go.focus();
      paintSheet();
    }

    var sheet=el("div","sheet");
    sheet.appendChild(el("h2",null,"답안지"));
    var mk=el("div","marks"); mk.id="marks"; sheet.appendChild(mk);
    $main.appendChild(sheet);
    paintSheet();
    $main.appendChild(el("p","foot",C.foot));

    function paintSheet(){
      var box=document.getElementById("marks"); if(!box)return;
      box.innerHTML="";
      for(var i=0;i<items.length;i++){
        var c = i<picks.length ? (picks[i].ok?"mkb right":"mkb wrong")
              : (i===pos?"mkb now":"mkb");
        box.appendChild(el("span",c,String(i+1)));
      }
    }
  }

  function norm(s){return String(s).trim().toLowerCase().replace(/\s+/g," ")}

  function markWord(sentence, word){
    var safe=esc(sentence);
    var stem=String(word||"").replace(/[^A-Za-z -]/g,"").trim();
    if(!stem) return safe;
    var parts=stem.split(/\s+/).filter(function(x){return x.length>2});
    if(!parts.length) return safe;
    parts.forEach(function(p){
      safe=safe.replace(new RegExp("\\b("+p+"[a-z]*)\\b","i"),"<strong>$1</strong>");
    });
    return safe;
  }

  function finish(s){
    var right=picks.filter(function(p){return p.ok}).length;
    score[s.id]={right:right,of:items.length}; save(SC,score); buildDays();
    var m=el("div","meta");
    m.appendChild(el("em",null,s.label));
    m.appendChild(el("span","t",s.topic));
    $main.appendChild(m);

    var box=el("div","done");
    box.appendChild(el("b",null,right+" / "+items.length));
    box.appendChild(el("p",null, right===items.length
      ? "전부 맞았습니다." : "틀린 문항을 한 번 더 보고 가세요."));
    var bad=picks.filter(function(p){return !p.ok});
    if(bad.length){
      var rc=el("div","recap");
      bad.forEach(function(p){
        var r=el("div","rc");
        r.appendChild(el("b",null,p.it.a));
        var txt=p.it.type.indexOf("A")===0 ? ("  "+p.it.q)
              : (p.it.kr ? ("  "+p.it.kr) : "");
        if(txt) r.appendChild(el("span",null,txt));
        rc.appendChild(r);
      });
      box.appendChild(rc);
    }
    var acts=el("div","acts"); acts.style.width="100%";
    var again=el("button","go",MODE==="review"?"새로 뽑아 풀기":"다시 풀기");
    again.onclick=function(){start();window.scrollTo(0,0)};
    acts.appendChild(again);
    var l=listOf(book), i=l.indexOf(s);
    if(i>-1 && i+1<l.length){
      var nx=el("button",null,"다음 "+(MODE==="rtest"||MODE==="ftest"?"회차":"DAY"));
      nx.onclick=function(){at=SETS.indexOf(l[i+1]);persist();start();window.scrollTo(0,0)};
      acts.appendChild(nx);
    }
    box.appendChild(acts);
    $main.appendChild(box);
    $main.appendChild(el("p","foot",C.foot));
  }
})();
</script>

</body>
</html>
