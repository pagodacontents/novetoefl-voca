<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>노베토플 알파벳 색인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans:wght@400;500&display=swap">
<style>
/* 레이아웃 — 머리에 알파벳 띠, 본문은 글자마다 한 덩이. 항목의 DAY 표는
   그 낱말이 사는 권의 별색을 쓴다(실용 170 C / 학술 2955 C). */
:root{
  --s1:#D1522B; --s1-fill:#FF8D6D; --s1-tint:#FFF1EB;
  --s2:#004871; --s2-fill:#003A5D; --s2-tint:#E8F0F6;
  --bg:#FDFAF8; --surf:#FFFFFF; --fg:#1B1512; --mut:#7C6C64;
  --faint:#A99A93; --line:#EDE2DC;
  --spot:var(--s1); --spot-fill:var(--s1-fill); --spot-tint:var(--s1-tint);
  --f-word:"Lora",Georgia,serif;
  --f-ui:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-ipa:"Noto Sans","Segoe UI",system-ui,sans-serif;
  --r:12px;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --s1:#FFA98E; --s1-fill:#FF8D6D; --s1-tint:#2C1C16;
  --s2:#86C2E6; --s2-fill:#5AA7D4; --s2-tint:#122531;
  --bg:#141110; --surf:#1D1917; --fg:#F3ECE8; --mut:#A6968E;
  --faint:#7E6F68; --line:#2F2825; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --s1:#FFA98E; --s1-fill:#FF8D6D; --s1-tint:#2C1C16;
  --s2:#86C2E6; --s2-fill:#5AA7D4; --s2-tint:#122531;
  --bg:#141110; --surf:#1D1917; --fg:#F3ECE8; --mut:#A6968E;
  --faint:#7E6F68; --line:#2F2825; color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--spot-fill)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--spot-fill);color:#fff}
.top-in{padding-left:var(--gut);padding-right:var(--gut-r);padding-block:10px;display:flex;flex-direction:column;gap:9px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:15px;font-weight:700}
.brand span{font-size:11.5px;opacity:.8;font-family:var(--f-ipa);letter-spacing:.06em;text-transform:uppercase}
.brand .tot{margin-left:auto;font-size:11.5px;opacity:.85;font-family:var(--f-ipa);font-variant-numeric:tabular-nums}
.search input{width:100%;border:0;border-radius:9px;padding:9px 12px;font-family:var(--f-ui);font-size:14px;background:rgba(255,255,255,.2);color:#fff}
.search input::placeholder{color:rgba(255,255,255,.75)}
.search input:focus-visible{outline:2px solid #fff;outline-offset:1px}
.rail{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:0 0 auto;border:0;background:transparent;color:#fff;cursor:pointer;font-family:var(--f-ipa);font-size:12.5px;font-weight:500;padding:4px 7px;border-radius:6px;opacity:.78}
.rail button:hover,.rail button:focus-visible{background:rgba(255,255,255,.22);opacity:1;outline:none}

main{padding-left:var(--gut);padding-right:var(--gut-r);padding-block:8px 44px;max-width:620px;margin:0 auto}
.grp{padding-top:10px}
.gh{position:sticky;top:calc(env(safe-area-inset-top,0px) + 118px);z-index:10;background:var(--bg);display:flex;align-items:baseline;gap:9px;padding-block:7px;border-bottom:1px solid var(--line)}
.gh b{font-family:var(--f-word);font-size:22px;font-weight:600;color:var(--spot)}
.gh span{font-family:var(--f-ipa);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}

.row{display:flex;gap:10px;align-items:flex-start;padding-block:9px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.txt{flex:1;min-width:0}
.w{font-family:var(--f-word);font-size:16px;font-weight:600;word-break:break-word}
.w .st{font-size:10.5px;color:var(--spot-fill);margin-left:6px;letter-spacing:.5px}
.fam{display:block;font-size:12px;color:var(--mut);margin-top:1px}
.day{
  flex:0 0 auto;border-radius:7px;padding:3px 7px;font-family:var(--f-ipa);
  font-size:11px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;
  background:var(--s1-tint);color:var(--s1);
}
.day.b2{background:var(--s2-tint);color:var(--s2)}

.lead{display:flex;flex-wrap:wrap;gap:6px;padding-block:12px 4px;color:var(--mut);font-size:12.5px;align-items:center}
.lead .key{display:inline-flex;align-items:center;gap:5px}
.chip{border-radius:6px;padding:2px 6px;font-family:var(--f-ipa);font-size:10.5px;font-weight:500}
.chip.b1{background:var(--s1-tint);color:var(--s1)}
.chip.b2{background:var(--s2-tint);color:var(--s2)}
.empty{text-align:center;color:var(--faint);font-size:13.5px;padding:48px 0}
.foot{color:var(--faint);font-size:11.5px;text-align:center;padding-top:18px;margin-top:10px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
</style>
</head>
<body>


<header class="top">
  <div class="top-in">
    <div class="brand"><b>알파벳 색인</b><span>Index</span><span class="tot" id="tot"></span></div>
    <div class="search"><input id="q" type="search" placeholder="영어 단어로 찾기" autocomplete="off" aria-label="단어 찾기"></div>
    <div class="rail" id="rail" aria-label="알파벳"></div>
  </div>
</header>

<main id="main"><p class="empty">색인을 불러오는 중입니다.</p></main>

        if(query){ query=""; $q.value=""; render() }
        var t=document.getElementById("L"+g.letter);
        if(t) t.scrollIntoView({block:"start"});
      };
      $rail.appendChild(b);
    });
  }

  function render(){
    $main.innerHTML="";
    var s=query.trim().toLowerCase();
    $tot.textContent=total().toLocaleString()+"개";

    if(!s){
      var lead=el("div","lead");
      lead.appendChild(el("span",null,"표제어가 선 DAY 를 함께 적었습니다."));
      var k1=el("span","key"); k1.appendChild(el("span","chip b1","DAY 01"));
      k1.appendChild(el("span",null,"실용"));
      var k2=el("span","key"); k2.appendChild(el("span","chip b2","DAY 22"));
      k2.appendChild(el("span",null,"학술"));
      lead.appendChild(k1); lead.appendChild(k2);
      $main.appendChild(lead);
    }

    var hits=0;
    G.forEach(function(g){
      var items=g.items.filter(function(it){
        return !s || it.word.toLowerCase().indexOf(s)>-1;
      });
      if(!items.length) return;
      hits+=items.length;
      var box=el("section","grp"); box.id="L"+g.letter;
      var gh=el("div","gh");
      gh.appendChild(el("b",null,g.letter));
      gh.appendChild(el("span",null,items.length+(s?"":"")));
      box.appendChild(gh);
      items.forEach(function(it){ box.appendChild(row(it)) });
      $main.appendChild(box);
    });

    if(!hits) $main.appendChild(el("p","empty","찾는 단어가 없습니다."));
    $main.appendChild(el("p","foot","노베토플 4.5+ 단어장 · 표제어 1,608"));
  }

  function row(it){
    var r=el("div","row"), t=el("div","txt");
    var w=el("div","w",it.word);
    if(it.star){ w.appendChild(el("span","st",it.star)) }
    t.appendChild(w);
    if(it.fam) t.appendChild(el("span","fam",it.fam));
    r.appendChild(t);
    var d=el("span","day"+(it.day>21?" b2":""),"DAY "+String(it.day).padStart(2,"0"));
    r.appendChild(d);
    return r;
  }

  $q.addEventListener("input",function(){query=$q.value;render()});
})();
</script>

</body>
</html>
