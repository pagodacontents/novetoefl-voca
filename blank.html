<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>노베토플 빈칸 철자 훈련</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+Mono:wght@400;500&display=swap">
<style>
/* 빈칸 철자 훈련 — 저자 별책 원고(Reading Task 1 빈칸 어휘) 그대로.
   문장 속 낱말 하나가 앞 글자만 남고 비어 있다. 채워 넣고 확인하면
   정답·품사·뜻·원형·완성 문장·해석을 한자리에서 보여 준 뒤 넘어간다.
   DAY 0 기능어 워밍업, 혼동 세트 83항목, 낱말 찾기(573)도 함께 담는다. */
:root{
  --s1:#D1522B; --s1-fill:#FF8D6D; --s1-tint:#FFF1EB;
  --s2:#004871; --s2-fill:#003A5D; --s2-tint:#E8F0F6;
  --bg:#FDFAF8; --surf:#FFFFFF; --fg:#1B1512; --mut:#7C6C64;
  --faint:#A99A93; --line:#EDE2DC;
  --ok:#2E7D5B; --ok-t:#E6F3EC; --no:#B3402E; --no-t:#FBEAE6;
  --spot:var(--s1); --spot-fill:var(--s1-fill); --spot-tint:var(--s1-tint);
  --f-word:"Lora",Georgia,serif;
  --f-ui:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-mono:"Noto Sans Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --r:12px;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
body[data-book="2"]{ --spot:var(--s2); --spot-fill:var(--s2-fill); --spot-tint:var(--s2-tint) }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --s1:#FFA98E; --s1-fill:#FF8D6D; --s1-tint:#2C1C16;
  --s2:#86C2E6; --s2-fill:#5AA7D4; --s2-tint:#122531;
  --bg:#141110; --surf:#1D1917; --fg:#F3ECE8; --mut:#A6968E;
  --faint:#7E6F68; --line:#2F2825;
  --ok:#6BC79B; --ok-t:#14291F; --no:#F09080; --no-t:#301A16;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --s1:#FFA98E; --s1-fill:#FF8D6D; --s1-tint:#2C1C16;
  --s2:#86C2E6; --s2-fill:#5AA7D4; --s2-tint:#122531;
  --bg:#141110; --surf:#1D1917; --fg:#F3ECE8; --mut:#A6968E;
  --faint:#7E6F68; --line:#2F2825;
  --ok:#6BC79B; --ok-t:#14291F; --no:#F09080; --no-t:#301A16;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--spot-fill)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--spot-fill);color:#fff}
.top-in{padding-left:var(--gut);padding-right:var(--gut-r);padding-block:10px;display:flex;flex-direction:column;gap:9px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:15px;font-weight:700}
.brand span{font-size:11.5px;opacity:.8;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.books{display:flex;gap:6px}
.books button{flex:1;border:0;border-radius:999px;cursor:pointer;font-family:var(--f-ui);font-size:12.5px;font-weight:500;padding:7px 4px;background:rgba(255,255,255,.22);color:#fff}
.books button[aria-selected="true"]{background:#fff;color:var(--spot);font-weight:700}
.days{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 auto;border:0;border-radius:8px;cursor:pointer;font-family:var(--f-mono);font-size:12px;padding:6px 9px;background:rgba(255,255,255,.18);color:#fff;white-space:nowrap}
.days button[aria-current="true"]{background:#fff;color:var(--spot);font-weight:700}
.days button.done::after{content:" ✓";font-size:10px}


.modes{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:1 0 auto;border:0;border-radius:999px;cursor:pointer;font-family:var(--f-ui);font-size:12.5px;font-weight:500;padding:7px 12px;white-space:nowrap;background:rgba(255,255,255,.2);color:#fff}
.modes button[aria-selected="true"]{background:#fff;color:var(--spot);font-weight:700}

main{padding-left:var(--gut);padding-right:var(--gut-r);padding-block:14px 44px;display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}

.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.meta em{font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--spot);letter-spacing:.06em}
.meta .num{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.prog{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:-10px}
.prog i{display:block;height:100%;background:var(--spot-fill);transition:width .25s}

.stage{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.sent{font-family:var(--f-word);font-size:17px;line-height:1.72;color:var(--fg)}
.sent .gap{font-family:var(--f-mono);font-size:16px;color:var(--spot);background:var(--spot-tint);border-radius:5px;padding:1px 5px;white-space:nowrap}
.sent .gap u{text-decoration:none;letter-spacing:.1em}
.sent b{color:var(--spot);font-weight:700}
.typein{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:12px 13px;font-family:var(--f-mono);font-size:17px;letter-spacing:.06em}
.typein:focus-visible{outline:2px solid var(--spot);outline-offset:2px}

.card{border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.card.right{background:var(--ok-t);border:1px solid var(--ok)}
.card.wrong{background:var(--no-t);border:1px solid var(--no)}
.card .vt{font-size:13px;font-weight:700}
.card.right .vt{color:var(--ok)} .card.wrong .vt{color:var(--no)}
.card .ans{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .ans b{font-family:var(--f-word);font-size:20px;color:var(--fg)}
.card .pos{font-size:11.5px;background:var(--surf);border-radius:999px;padding:2px 8px;color:var(--mut)}
.card .mean{font-size:14px;color:var(--fg)}
.card .sub{font-size:12px;color:var(--mut)}
.card .kr{font-size:13.5px;color:var(--mut);line-height:1.65}
.card .en{font-family:var(--f-word);font-size:14.5px;line-height:1.68;color:var(--fg)}

.acts{display:flex;gap:8px}
.acts button{flex:1;border-radius:10px;padding:12px 6px;font-family:var(--f-ui);font-size:13.5px;cursor:pointer;border:1px solid var(--line);background:var(--surf);color:var(--mut)}
.acts button.go{background:var(--spot-fill);border-color:var(--spot-fill);color:#fff;font-weight:700}
.acts button:focus-visible,.books button:focus-visible,.days button:focus-visible,.modes button:focus-visible{outline:2px solid var(--spot);outline-offset:2px}

.sheet{display:flex;flex-direction:column;gap:7px}
.sheet h2{margin:0;font-size:13px;font-weight:500;color:var(--mut)}
.marks{display:flex;flex-wrap:wrap;gap:5px}
.mk{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);color:var(--faint);background:var(--surf);cursor:pointer}
.mk.right{background:var(--ok-t);border-color:var(--ok);color:var(--ok)}
.mk.wrong{background:var(--no-t);border-color:var(--no);color:var(--no)}
.mk.now{border-color:var(--spot);color:var(--spot);font-weight:700}

.done{background:var(--spot-tint);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.done b{font-size:26px;font-family:var(--f-mono);color:var(--spot)}
.done p{margin:0;font-size:13.5px;color:var(--mut)}
.wrongs{display:flex;flex-direction:column;gap:6px;width:100%}
.wrongs div{display:flex;gap:8px;align-items:baseline;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:7px 10px;text-align:left}
.wrongs i{font-style:normal;font-family:var(--f-word);font-size:14px;color:var(--spot)}
.wrongs span{font-size:12.5px;color:var(--mut)}

.sec{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:13.5px;font-weight:700;color:var(--spot)}
.sec p.lead{margin:0;font-size:13px;color:var(--mut);line-height:1.7}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.row .k{font-family:var(--f-mono);font-size:13px;color:var(--spot);background:var(--spot-tint);border-radius:5px;padding:1px 6px;white-space:nowrap}
.row .v{font-size:13px;color:var(--fg);flex:1;min-width:140px}
.row .n{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-left:auto;white-space:nowrap}
.row .w{font-family:var(--f-word)}
.fam{display:flex;flex-direction:column;gap:7px}
.fam h4{margin:0;font-size:12.5px;font-weight:500;color:var(--mut)}

/* 혼동 세트 — 원고 표의 여섯 칸(기준·종류·Day·갈림길·해당 단어·수)을
   좁은 화면에서는 두 줄로 편다. 한 줄에 몰아넣으니 오른쪽 칸이 잘려
   아랫줄을 밀고 들어갔다 (TJ 지적 2026-10-29). */
.csets{display:flex;flex-direction:column;gap:11px}
.cset{display:flex;flex-direction:column;gap:5px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.csets .cset:last-child{border-bottom:0;padding-bottom:0}
.cset .ch{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cset .k{font-family:var(--f-mono);font-size:13px;color:var(--spot);background:var(--spot-tint);border-radius:5px;padding:1px 6px;white-space:nowrap}
.cset .kind{font-size:11.5px;color:var(--mut)}
.cset .n{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-left:auto;white-space:nowrap}
.cset .cw{font-family:var(--f-word);font-size:13.5px;line-height:1.6;color:var(--fg)}
.cset .fork{font-size:11.5px;color:var(--faint)}
.cset .fork b{font-family:var(--f-mono);font-weight:500;color:var(--mut)}
.find{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:11px 13px;font-family:var(--f-ui);font-size:14px}
.hit{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.hit b{font-family:var(--f-word);font-size:15px;min-width:34%}
.hit em{font-style:normal;font-size:11px;color:var(--mut)}
.hit span{font-size:12.5px;color:var(--mut);flex:1}
.hit i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--faint)}

.foot{color:var(--faint);font-size:11.5px;text-align:center;padding-top:14px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

    if(c)n.className=c; if(x!=null)n.textContent=x; return n}
  function esc(s){return String(s).replace(/[&<>"]/g,function(ch){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]})}
  function norm(s){return String(s||"").toLowerCase()
    .replace(/[^a-z]/g,"")}

  try{ D=JSON.parse(document.getElementById("DATA").textContent||"null") }
  catch(e){ D=null }
  if(!D||!D.days){ $main.innerHTML='<p class="foot">자료를 읽지 못했습니다.</p>';
    return }

  function dayOf(n){for(var i=0;i<D.days.length;i++)
    if(D.days[i].day===n)return D.days[i]; return D.days[0]}

  // ---- 머리 ----
  function buildModes(){
    $modes.innerHTML="";
    MODES.forEach(function(m){
      var b=el("button",null,m[1]);
      b.setAttribute("role","tab");
      b.setAttribute("aria-selected", mode===m[0]?"true":"false");
      b.onclick=function(){ if(mode===m[0])return;
        mode=m[0]; pos=0; answered=false; persist();
        buildModes(); buildDays(); render(); window.scrollTo(0,0) };
      $modes.appendChild(b);
    });
  }
  function buildDays(){
    $days.innerHTML="";
    if(mode!=="drill"){ $days.style.display="none"; return }
    $days.style.display="flex";
    D.days.forEach(function(d){
      var b=el("button",null,"DAY "+("0"+d.day).slice(-2));
      b.setAttribute("role","tab");
      if(d.day===day)b.setAttribute("aria-current","true");
      if(score["d"+d.day]!=null)b.className="done";
      b.onclick=function(){ day=d.day; start(); window.scrollTo(0,0) };
      $days.appendChild(b);
    });
  }
  function scrollDay(){
    var b=$days.querySelector('[aria-current="true"]');
    if(b&&b.scrollIntoView)b.scrollIntoView({block:"nearest",
      inline:"center"});
  }

  // ---- DAY 훈련 ----
  function start(){ pos=0; answered=false; marks=[]; persist();
    buildDays(); render(); scrollDay() }

  function gapHTML(it){
    var q=esc(it.q), h=esc(it.hint);
    var i=q.indexOf(h);
    if(i<0)return q;
    var stem=esc(it.stem), bl=new Array(it.blanks+1).join("_");
    return q.slice(0,i)+'<span class="gap">'+stem+'<u>'+bl+'</u></span>'+
      q.slice(i+h.length);
  }
  function fullHTML(it){
    var f=esc(it.full), a=esc(it.a);
    var i=f.toLowerCase().indexOf(a.toLowerCase());
    if(i<0)return f;
    return f.slice(0,i)+"<b>"+f.slice(i,i+a.length)+"</b>"+f.slice(i+a.length);
  }

  function render(){
    if(mode==="warm")return renderWarm();
    if(mode==="mix")return renderMix();
    if(mode==="find")return renderFind();
    renderDrill();
  }

  function renderDrill(){
    var d=dayOf(day), n=d.items.length;
    $main.innerHTML="";
    if(pos>=n)return renderDone(d);
    var it=d.items[pos];

    var meta=el("div","meta");
    // 머리에 적던 낱말 범위(ability ~ against)는 뺐다 — 그날 답이 무엇인지
    // 미리 알려 주는 셈이었다 (TJ 지적 2026-10-29).
    meta.appendChild(el("em",null,"DAY "+("0"+d.day).slice(-2)));
    meta.appendChild(el("span","num",(pos+1)+" / "+n));
    $main.appendChild(meta);
    var pr=el("div","prog"), bar=el("i");
    bar.style.width=(pos/n*100)+"%"; pr.appendChild(bar);
    $main.appendChild(pr);

    var st=el("div","stage");
    var s=el("div","sent"); s.innerHTML=gapHTML(it); st.appendChild(s);

    var inp=el("input","typein");
    inp.type="text"; inp.autocapitalize="none"; inp.autocomplete="off";
    inp.spellcheck=false;
    inp.placeholder=it.stem+"… ("+(it.stem.length+it.blanks)+"글자)";
    st.appendChild(inp);

    var acts=el("div","acts");
    var skip=el("button",null,"모르겠어요");
    var go=el("button","go","확인");
    acts.appendChild(skip); acts.appendChild(go);
    st.appendChild(acts);
    $main.appendChild(st);

    function reveal(ok){
      if(answered)return;
      answered=true; marks[pos]=ok?1:0;
      inp.disabled=true;
      var c=el("div","card "+(ok?"right":"wrong"));
      c.appendChild(el("div","vt",ok?"맞았습니다":"다시 보세요"));
      var a=el("div","ans");
      a.appendChild(el("b",null,it.a));
      a.appendChild(el("span","pos",it.pos));
      a.appendChild(el("span","mean",it.mean));
      c.appendChild(a);
      if(it.base||it.book){
        var sub=[];
        if(it.base)sub.push("원형 "+it.base);
        if(it.book)sub.push("본책 "+it.book);
        c.appendChild(el("div","sub",sub.join(" · ")));
      }
      var en=el("div","en"); en.innerHTML=fullHTML(it); c.appendChild(en);
      if(it.kr)c.appendChild(el("div","kr",it.kr));
      st.replaceChild(c,acts);
      // 틀렸을 때는 그 문장을 한 번 더 — 왼쪽 다시 풀기 · 오른쪽 다음 문장
      // (TJ 지시 2026-10-29).
      var nx=el("div","acts");
      if(!ok){
        var again=el("button",null,"다시 풀기");
        again.onclick=function(){ answered=false; marks[pos]=undefined;
          renderDrill(); window.scrollTo(0,0) };
        nx.appendChild(again);
      }
      var b=el("button","go",pos+1>=n?"결과 보기":"다음 문장");
      b.onclick=function(){ pos++; answered=false; render();
        window.scrollTo(0,0) };
      nx.appendChild(b); st.appendChild(nx);
      b.focus();
      sheet(d);
    }
    go.onclick=function(){ reveal(norm(inp.value)===norm(it.a)) };
    skip.onclick=function(){ reveal(false) };
    inp.onkeydown=function(e){ if(e.key==="Enter")go.click() };
    setTimeout(function(){inp.focus()},40);
    sheet(d);
  }

  function sheet(d){
    var old=$main.querySelector(".sheet"); if(old)old.remove();
    var sh=el("div","sheet");
    sh.appendChild(el("h2",null,"답안지"));
    var ms=el("div","marks");
    d.items.forEach(function(_it,i){
      var m=el("div","mk"+(marks[i]===1?" right":marks[i]===0?" wrong":"")+
        (i===pos?" now":""), String(i+1));
      ms.appendChild(m);
    });
    sh.appendChild(ms);
    $main.appendChild(sh);
  }

  function renderDone(d){
    var right=marks.filter(function(x){return x===1}).length;
    score["d"+d.day]=right; save(SC,score); buildDays();
    var box=el("div","done");
    box.appendChild(el("b",null,right+" / "+d.items.length));
    box.appendChild(el("p",null, right===d.items.length
      ? "열넷 모두 맞았습니다." : "틀린 낱말을 한 번 더 보고 가세요."));
    var bad=d.items.filter(function(_x,i){return marks[i]!==1});
    if(bad.length){
      var ws=el("div","wrongs");
      bad.forEach(function(it){
        var r=el("div");
        r.appendChild(el("i",null,it.a));
        r.appendChild(el("span",null,"("+it.pos+") "+it.mean));
        ws.appendChild(r);
      });
      box.appendChild(ws);
    }
    var acts=el("div","acts");
    var again=el("button","go","다시 풀기");
    again.onclick=function(){start();window.scrollTo(0,0)};
    acts.appendChild(again);
    var next=el("button",null,"다음 DAY");
    var at=D.days.map(function(x){return x.day}).indexOf(d.day);
    next.disabled = at<0||at+1>=D.days.length;
    next.onclick=function(){day=D.days[at+1].day;start();
      window.scrollTo(0,0)};
    acts.appendChild(next);
    box.appendChild(acts);
    $main.innerHTML=""; $main.appendChild(box);
    foot();
  }

  // ---- 기능어 워밍업 ----
  function renderWarm(){
    var w=D.warmup||{};
    $main.innerHTML="";
    var s0=el("div","sec");
    s0.appendChild(el("h3",null,"DAY 0 — 기능어 워밍업"));
    if(w.lead)s0.appendChild(el("p","lead",w.lead));
    $main.appendChild(s0);

    // 원고는 「가족」으로 묶어 두었다 — a+빈칸, th+빈칸(the 포함) … .
    // 그 머리를 빠뜨리고 빈칸 모양만 늘어놓으니 무엇끼리 한 가족인지
    // 보이지 않았다 (TJ 지적 2026-10-29).
    var s1=el("div","sec");
    s1.appendChild(el("h3",null,"1. 헷갈리는 빈칸 가족"));
    var seen={}, order=[];
    (w.family||[]).forEach(function(f){
      if(!seen[f.family]){ seen[f.family]=[]; order.push(f.family) }
      seen[f.family].push(f);
    });
    order.forEach(function(name){
      var g=el("div","fam");
      g.appendChild(el("h4",null,name));
      var r1=el("div","rows");
      seen[name].forEach(function(f){
        var r=el("div","row");
        r.appendChild(el("span","k",f.hint));
        r.appendChild(el("span","v w",(f.cands||[]).join(", ")));
        r.appendChild(el("span","n","기출 "+f.seen));
        r1.appendChild(r);
      });
      g.appendChild(r1); s1.appendChild(g);
    });
    $main.appendChild(s1);

    var s2=el("div","sec");
    s2.appendChild(el("h3",null,"2. 품사 그룹별 정리"));
    var r2=el("div","rows");
    (w.groups||[]).forEach(function(g){
      var r=el("div","row");
      r.appendChild(el("span","k",g.group));
      r.appendChild(el("span","v w",(g.words||[]).map(function(x){
        return x.hint?(x.w+" ("+x.hint+")"):x.w}).join(", ")));
      r.appendChild(el("span","n",g.n+"개 · 기출 "+g.seen));
      r2.appendChild(r);
    });
    s2.appendChild(r2); $main.appendChild(s2);
    foot();
  }

  // ---- 혼동 세트 ----
  function renderMix(){
    $main.innerHTML="";
    var s=el("div","sec");
    s.appendChild(el("h3",null,"혼동 세트 "+(D.confuse||[]).length+"항목"));
    s.appendChild(el("p","lead","같은 힌트·같은 접두로 헷갈리는 자리다. "+
      "갈림길을 눈에 익혀 두면 빈칸에서 헤매지 않는다."));
    $main.appendChild(s);
    // 원고 표의 여섯 칸을 그대로 — 기준·종류·Day·갈림길·해당 단어·수.
    var box=el("div","sec"), rows=el("div","csets");
    (D.confuse||[]).forEach(function(c){
      var r=el("div","cset");
      var h=el("div","ch");
      h.appendChild(el("span","k",c.key));
      if(c.kind)h.appendChild(el("span","kind",c.kind));
      h.appendChild(el("span","n",c.day+(c.n?" · "+c.n+"개":"")));
      r.appendChild(h);
      r.appendChild(el("div","cw",(c.words||[]).join(", ")));
      if(c.fork){
        var f=el("div","fork");
        f.appendChild(document.createTextNode("갈림길 "));
        f.appendChild(el("b",null,c.fork));
        r.appendChild(f);
      }
      rows.appendChild(r);
    });
    box.appendChild(rows); $main.appendChild(box);
    foot();
  }

  // ---- 낱말 찾기 ----
  function renderFind(){
    $main.innerHTML="";
    var s=el("div","sec");
    s.appendChild(el("h3",null,"낱말 찾기 "+(D.index||[]).length+"개"));
    var inp=el("input","find");
    inp.type="search"; inp.placeholder="영어 낱말이나 뜻으로 찾기";
    inp.autocapitalize="none"; inp.autocomplete="off";
    s.appendChild(inp);
    var list=el("div"); s.appendChild(list);
    $main.appendChild(s);
    function draw(q){
      list.innerHTML="";
      var ws=(D.index||[]).filter(function(x){
        if(!q)return false;
        return x.w.toLowerCase().indexOf(q)>=0||x.mean.indexOf(q)>=0;
      }).slice(0,80);
      if(!q){ list.appendChild(el("p","lead",
        "찾을 낱말을 적어 보세요. 뜻으로도 찾을 수 있습니다.")); return }
      if(!ws.length){ list.appendChild(el("p","lead","찾는 낱말이 없습니다."));
        return }
      ws.forEach(function(x){
        var h=el("div","hit");
        h.appendChild(el("b",null,x.w));
        h.appendChild(el("em",null,x.pos));
        h.appendChild(el("span",null,x.mean));
        h.appendChild(el("i",null,x.day));
        list.appendChild(h);
      });
    }
    inp.oninput=function(){draw(inp.value.trim().toLowerCase())};
    draw("");
    foot();
  }

  function foot(){
    var n=0; D.days.forEach(function(d){n+=d.items.length});
    $main.appendChild(el("p","foot",
      "별책 빈칸 어휘 "+n+"문장 · 낱말 "+(D.index||[]).length+"개"));
  }

  buildModes(); buildDays();
  if(mode==="drill")start(); else render();
})();
</script>

</body>
</html>
